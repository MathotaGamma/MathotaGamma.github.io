      // targetに存在しないkeyをsourceから埋める。
      // 最上層配列はダメ。辞書型の入れ子のみ
      function mergeMissingKeys(target, source) {
        try {
          if (!target || typeof target !== 'object' || Array.isArray(target) ||
              !source || typeof source !== 'object' || Array.isArray(source)) {
            return target;
          }

          for (const key of Object.keys(source)) {
            const sourceVal = source[key];
            const targetVal = target[key];

            if (!(key in target)) {
              target[key] = typeof structuredClone === 'function'
                ? structuredClone(sourceVal)
                : JSON.parse(JSON.stringify(sourceVal));
            } else if (
              targetVal && typeof targetVal === 'object' && !Array.isArray(targetVal) &&
              sourceVal && typeof sourceVal === 'object' && !Array.isArray(sourceVal)
            ) {
              mergeMissingKeys(targetVal, sourceVal);
            }
          }

          return target;
        } catch(err) {
          console.log('error at mergeMissingKeys: ', err);
          throw err;
        }
      }

        alert(`Google連携状態...${status.ok ? 'OK' : 'No'}
loggedIn...${status.loggedIn}
expired...${status.expired}`);
      });

          }
        }
        if (tryLogIn && !isGuest && !hasDriveConnection) {
          await initDriveManager();
        }
        updateGoogleUI();
      }

      function getLayersFromLayersInfo() {
        layers.length = 0;

          const args = layerInfo.args;
          layers.push(Layer[layerKind](args.size === 0 ? undefined : structuredClone(Object.fromEntries(args))));
        }

      // layersInfo, layerDuplicationCountListを設定する

          const layerKind_k = layerInfo.layerKind;
          const isOutputLayer_k = layerInfo.kind === "Output";
          if (!isOutputLayer_k) {
            if (layerDuplicationCountList[layerKind_k] == null)
              layerDuplicationCountList[layerKind_k] = 1;
            else
              layerDuplicationCountList[layerKind_k]++;
          }
          const layerDuplicationCount = layerDuplicationCountList[layerKind_k];
          const name = isOutputLayer_k ? "Output" : layerKind_k+'-'+String(layerDuplicationCount);
          layersInfo[layerIdx].name = name;
        }

      function addLayer({ kind, index=layersInfo.length-1, init=false }) {
        if (layersInfo.length + 1 > usableInfo.entirely.layerCountLength) {
          alert(`現在Userは、出力層を含めて最大で${usableInfo.entirely.layerCountLength}個の層まで配置できます。`);
          return;
        }
        const isOutputLayer = kind === "Output";
        const layerKind = isOutputLayer ? "Dense" : kind;
        if (isOutputLayer)
          index = layersInfo.length;
        let args = isOutputLayer
           ? new Map([["units", currentGameInfo.output.shape]])
           : new Map(layerInitArgs[layerKind]);
        layersInfo.splice(index, 0, {
          kind,
          layerKind,
          name: "---",
          args
        });
        
        
        selectedIdx = index;
        if (!init)
          isChanged = true;
      }

      function logger(message=null, durationInp=null) {
        // messageが配列なら<br>で結合
        if (message != null)
          logQueue.push([Array.isArray(message) ? message.join('<br>') : message, durationInp]);
        if (isLogging || logQueue.length === 0)
          return;
        const [logText, duration] = logQueue.shift();
        loggerDiv.classList.add('show');
        loggerDiv.innerHTML = logText;
        isLogging = true;
        // 1500 ms + 文字数*50 ms の間表示
        setTimeout(() => {
          loggerDiv.classList.remove('show');
          setTimeout(() => {
            isLogging = false;
            logger();
          }, 800);
        }, duration ? (duration + 500) : (50*loggerDiv.innerHTML.length + 2000));
      }
      
      // mimeTypeの種類
      /*
        TXT: 'text/plain;charset=utf-8'
        JSON: 'application/json'
        未定義: 'application/octet-stream'
      */
      function fileDownloader({ textData, fileName, type='text/plain;charset=utf-8' }) {
        try {
          const blob = new Blob([textData], { type });
          
          const url = URL.createObjectURL(blob);
          
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch(err) {
          console.error(err.message);
        }
      }

          const convertEntirelyLayersInfo = structuredClone(entirelyLayersInfo);
          for (let key of Object.keys(entirelyLayersInfo)) {
            const layersInfo_k = entirelyLayersInfo[key];
            for (let index = 0; index < layersInfo_k.length; index++) {
              convertEntirelyLayersInfo[key][index].args = Object.fromEntries(entirelyLayersInfo[key][index].args);
            }
          }
          
          let res = await drive.saveFile({ path: entirelyLayersInfoPath, data: convertEntirelyLayersInfo });
          console.log(entirelyLayersInfoPath, 'ok:', res != null);
          // userInfo, usageInfoをmergeする。

          }
          
          // userUsableInfoをDriveに保存する
          const userUsableInfoPath = appDataDirectory + 'user-usable-info.json';
          res = await drive.saveFile({ path: userUsableInfoPath, data: structuredClone(userUsableInfo) });
          console.log(userUsableInfoPath, 'ok:', res != null);
          
          const checkCk = new CogniKeel({
            inputShape: currentGameInfo.input.shape,
            onLog: () => {}
          });
        
          
          checkCk.addLayers(layers);
          checkCk.configure({});
          checkCk.initialize();
          const MCLM = await checkCk.getMCLM({ weightsInclude: false });
          const mclmPath = appDataDirectory + 'mclm/'+gameKind+'.mclm';
          res = await drive.saveFile({ path: mclmPath, data: MCLM, mimeType: 'text/plain;charset=utf-8' });

          console.log('driveに保存が完了しました');
          logger('Google Drive AppDataへの保存が完了しました。', 2000);
          isChanged = false;
        } catch(err) {
          logger('Google Drive AppDataへの保存中にエラーが発生しました。', 2000);

        }

      function drawLayersScreen() {
        getLayersFromLayersInfo();
        for (let index = 0; index < layerContainerList.length; index++) {
          layerContainerList[index].removeEventListener('click', layerContainerClicked);
          layerContainerList[index] = null;
        }
        layerContainerList.length = 0;
        layersScreen.innerHTML = '';
        const logArray = [];
        // ===== Network情報を得るためcheckCkを宣言&初期化
        const checkCk = new CogniKeel({
          inputShape: currentGameInfo.input.shape,
          onLog: (log) => logArray.push(log)
        });
        
        let isError = false;
        let errorIdx = -1;
        let errorMessage;
        try {
          checkCk.addLayers(layers);
          checkCk.configure({});
          checkCk.initialize();
        } catch(err) {
          // logArrayは初期化時、target,online用のInputLayerで2つ分で、エラーが出たLayerはlogされないのでerrorIdxはlogArray.length-2 (InputLayer含めて)
          errorMessage = err.message;
          isError = true;
          errorIdx = logArray.length-2;
        }

        const image = new Image(60, 50);

        // 矢印 layer 矢印 layer ... 矢印 layer 矢印 を作る。
        // layerIdx === layers.lengthはlayerContainerを飛ばす
        for (let layerIdx = 0; layerIdx < layers.length+1; layerIdx++) {
          let ckInfo;

          let layerInfo;

      // cloneNode(true)は使わない。
      // optionの構成情報を保持しておく（実際のoption群から動的取得）
      function getOptionsData(select) {
        return Array.from(select.options).map(opt => ({
          value: opt.value,
          text: opt.text
        }));
      }

      // 新規のselectを生成して差し替える
      function rebuildSelect(oldSelect, selectedValue, optionsData, onChange) {
        const newSelect = document.createElement('select');
        newSelect.id = oldSelect.id;

        optionsData.forEach(data => {
          const opt = document.createElement('option');
          opt.value = data.value;
          opt.text = data.text;
          // .valueではなく selected属性で明示的に指定する
          opt.selected = (data.value === selectedValue);
          newSelect.appendChild(opt);
        });

        newSelect.addEventListener('change', onChange);
        oldSelect.parentNode.replaceChild(newSelect, oldSelect);
        return newSelect;
      }

      function handleChange() {
        const newValue = gameSelect.value;

        if (!confirmChange()) {
          // 古いselectを破棄し、新規要素で差し替える
          const optionsData = getOptionsData(gameSelect);
          gameSelect = rebuildSelect(gameSelect, gameKind, optionsData, handleChange);
          return;
        }


        gameKind = gameSelect.value;
        currentGameInfo.gameKind = gameKind;
        isChanged = false;
        initGame();
      }
      gameSelect.addEventListener('change', handleChange);
      
      function loginWithAnotherEmail() {
        if (userInfo.emailAddress === null)
          return;
        
        alert('以前とは異なるアカウントでログインしたため、リロードします(前回:'+userInfo.emailAddress+')。');
        // window.location.reload();
        return;
      }
      
      async function initDrive() {
        await initDriveManager();
        return await initData();
      }
      
      async function initDriveManager() {
        logger('Google Driveに接続中', 1000);
        const EMBEDDED_CLIENT_ID = '673216051028-hjomu6c8livrv4ga0c0f37o3i3qt0dso.apps.googleusercontent.com';
        const EMBEDDED_REDIRECT_URI = 'https://mathotagamma.github.io/statics/drive-api/oauth2callback';
        try {
          drive = new DriveAPIManager({
            clientId: EMBEDDED_CLIENT_ID,
            redirectUri: EMBEDDED_REDIRECT_URI,
            space: 'appdata',
            /*progress: (phase, detail) => {
              console.log(phase, detail);
            }*/
          });
          
          console.log('info', `Drive連携を初期化しました(space: appdata)。`);
          let res = await drive.auth(true);
          
          if (!res.ok)
            res = await drive.auth(false);
            
          // 成功時リターン
          if (res.ok) {
            // emailを取得
            emailAddress = await drive.getAbout('user(emailAddress)');
            if (emailAddress != null)
              emailAddress = emailAddress.user.emailAddress;
            else {
              emailAddress = null;
              throw new Error('E-mailを取得できませんでした');
            }
            
            // 一度でもログインできた場合はGuestにしない
            isGuest = false;
            hasDriveConnection = true;
            
            // 別のアカウントでログイン
            if (emailAddress !== null && userInfo && userInfo.emailAddress != null && userInfo.emailAddress !== emailAddress)
              loginWithAnotherEmail();
            return;
          } else {
            
            if (res.error === "popup_blocked")
              alert('popupがブロックされました。');
          }
        } catch (e) {
          logger(`Drive連携の初期化に失敗しました: ${e.message}`, 2500);
        }
        if (!isGuest)
          logger('Googleアカウントと連携できませんでした。再度試してください。');
        else
          logger('Googleアカウントと連携できませんでした。ゲストでプレイします。');
        isGuest = true;
        hasDriveConnection = false;
        if (drive != null)
          await drive.signOut();
        drive = null;
        hasDriveConnection = false;
      }
      
      async function initData() {
        initDataFromOrigin();
        return await initDataFromDrive();
      }
      
      function initDataFromOrigin() {
        // entirelyLayersInfo
        for (let gameKind_k of Object.keys(gameInfo)) {
          entirelyLayersInfo[gameKind_k] = [];
        }
        
        // userInfo, usableInfo
        userInfo = structuredClone(userInfoOrigin);
        usableInfo = structuredClone(usableInfoOrigin);
      }
      
      // return falseは、初期化を中断してリロードを促す。
      async function initDataFromDrive() {
        if (!hasDriveConnection || drive == null)
          return true;
          
        // 既に初期値が代入されている。
        
        logger('Google Drive AppDataから以前のデータの取得を試みています...<br>しばらくお待ちください。', 3000);
        let hasError = false;
        // 読み込むファイル
        // directory +
        /*
          entirely-layers-info.json
          user-usable-info.json
        */
        try {
          const entirelyLayersInfoPath = appDataDirectory + 'entirely-layers-info.json';
          
          const res = await drive.getFile({ path: entirelyLayersInfoPath, type: 'json' });
          if (res == null) {
            console.log(entirelyLayersInfoPath+'ファイルが見つかりませんでした。');
          } else {
            const rawEntirelyLayersInfo = res;
            console.log(entirelyLayersInfoPath+'ファイルが見つかりました。entirelyLayersInfoに同期します。');
            entirelyLayersInfo = structuredClone(rawEntirelyLayersInfo);
            for (let key of Object.keys(rawEntirelyLayersInfo)) {
              const driveLayersInfo_k = rawEntirelyLayersInfo[key];
              for (let index = 0; index < driveLayersInfo_k.length; index++) {
                entirelyLayersInfo[key][index].args = new Map(Object.entries(rawEntirelyLayersInfo[key][index].args));
              }
            }
            // mergeMissingKeysは必要ない。
            // init()内で初めに全てのgameKindをkey、空の配列をvalueとした辞書型に代入しているため。
            console.log('entirelyLayersInfo 同期完了');
            
          }
        } catch(err) {
          hasError = true;
          console.log(err.message);
          logger('Google Drive AppDataからDataを取得中にエラーが発生しました。');
        }
        
        try {
          const userUsableInfoPath = appDataDirectory + 'user-usable-info.json';
          
          const res = await drive.getFile({ path: userUsableInfoPath, type: 'json' });
          
          if (res == null) {
            console.log(userUsableInfoPath+'ファイルが見つかりませんでした。userInfo, usableInfoを初期化します。');
            userInfo = structuredClone(userInfoOrigin);
            usableInfo = structuredClone(usableInfoOrigin);
          } else {
            console.log(userUsableInfoPath+'ファイルが見つかりました。userInfo, usableInfoを同期します。');
            const rawUserUsableInfo = res;
            
            userInfo = mergeMissingKeys(structuredClone(rawUserUsableInfo.userInfo), userInfoOrigin);
            usableInfo = mergeMissingKeys(structuredClone(rawUserUsableInfo.usableInfo), usableInfoOrigin);
            logger('同期が完了しました。');
            console.log('同期が完了しました。');
          }
        } catch(err) {
          hasError = true;
          console.log(err.message);
          logger('Google Drive AppDataからDataを取得中にエラーが発生しました。');
          // location.reload();で循環するのは嫌だからユーザーに託す
          if (!confirm('ファイルが壊れている可能性があるため、確認後初期化を行います。\n初期化を避ける場合はキャンセル後リロードを行なってください。')) {
            return false;
          }
        }
        
        userInfo.emailAddress = emailAddress;
        userInfo.isGuest = isGuest;
        
        if (hasError) {
          // ファイルが壊れている可能性があるため、代入した値で保存する。
          dataSaveToDrive();
        }
        return true;
      }

      async function init() {
        const ret = await initDrive();
        if (!ret) {
          logger('初期化を中断しました。リロードを行なってください。', 2000);
          return;
        }
        updateGoogleUI();
        layerEditItemsInit();
        initGame();
        draw();
        logger('構築が完了しました。');
        
        transitionToSolo.disabled = false;
      }
      init();
