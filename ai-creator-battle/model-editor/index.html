<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Model Editor | AI Creator Battle</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        overflow:hidden;
        touch-action: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: row;
      }
      main {
        display: flex;
        width: 100%;
        flex-direction: row;
      }
      .right-area {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .layer-editor {
        position: absolute;
        bottom: 0;
      }
    </style>
    <link rel="stylesheet" href="/statics/main-style.css" />
  </head>
  <body>
    <header>
      <nav class="breadcrumb"></nav>
      <div class="font-size-L">AI Creator Battle</div>
    </header>
    <main>
      <div class="dock-left-area">
        <div class="dock-content">
          <select>
            <option>カートポール</option>
            <option>ブロック崩し</option>
          </select>
        </div>
        <div class="dock-left-bar"></div>
      </div>
      <div class="right-area">
        <div class="layers-screen">
      
        </div>
        <div class="layer-editor">
      
        </div>
      </div>
    </main>
    <script src="/statics/main-script.js"></script>
  </body>
</html>
