      function cyc(pc, k, j) {

          YO.mod = mod; YO.send = function (c) { mod.postMessage(c); };
          mod.addMessageListener(yoLine);
          var T = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
          YO.send('usi');
          YO.send('setoption name Threads value ' + T); YO.send('setoption name USI_Hash value 128');
          YO.send('setoption name NetworkDelay value 0'); YO.send('setoption name NetworkDelay2 value 0');
          YO.state = 'ok';
          if (busy) { W.postMessage({ cmd: 'stop' }); busy = 0; }
          if (netBuf) yoApplyNet(); else YO.send('isready');
        } catch (e) {
          YO.state = 'fail'; g('ov').hidden = true; g('nnB').textContent = 'WASM失敗:' + String(e.message).slice(0, 20);
          ensureJsNet();
        }
      }
      function yoApplyNet() {
        YO.ready = false; yoStop();
        YO.mod.FS.writeFile('/hao.bin', new Uint8Array(netBuf));
        YO.send('setoption name EvalDir value .'); YO.send('setoption name EvalFile value hao.bin'); YO.send('setoption name FV_SCALE value 20');
        YO.send('isready');
      }
      function yoStop() { YO.pending = false; if (YO.running) YO.send('stop'); }
      function yoThink(play) {
        var n = play ? Math.max(1, num('show')) : Math.max(1, Math.min(legal(P).length, 300));
        YO.req = { id: ++gid, play: play, t0: Date.now(), ms: play ? num('ai') * 1000 : 0, mpv: n, mv: {}, depth: 0, ui: 0 };
        YO.pending = true;
        g('bar').firstChild.style.width = '0%';
        g('cand').innerHTML = (lastInfo ? '<div>直前: ' + lastInfo + '</div>' : '') + '<div>思考中…(やねうら王)</div>';
        yoKick();
      }
      function yoKick() {
        if (!YO.pending || !YO.ready) return;
        if (YO.running) { YO.send('stop'); return; }
        YO.pending = false; YO.running = true;
        var r = YO.cur = YO.req, D = num('D');
        r.t0 = Date.now();
        YO.send('setoption name MultiPV value ' + r.mpv);
        YO.send('position ' + (startSfen ? 'sfen ' + startSfen : 'startpos') + (hist.length ? ' moves ' + hist.map(function (h) { return m2u(h.m); }).join(' ') : ''));
        YO.send(r.play ? (r.ms ? 'go movetime ' + r.ms : 'go depth ' + (D > 0 ? Math.max(8, D) : 18)) : (D > 0 ? 'go depth ' + D : 'go infinite'));
      }
      function yoPaint(r, done) {
        var arr = Object.keys(r.mv).map(function (k) { return r.mv[k]; });
        arr.sort(function (a, b) { return ((b.d === r.depth) - (a.d === r.depth)) || (a.k - b.k); });
        var D = num('D'), pct = r.ms ? Math.min(99, (Date.now() - r.t0) * 100 / r.ms) : (D ? Math.min(99, r.depth * 100 / D) : Math.min(99, r.depth * 4));
        showList({ t: 'p', id: r.id, play: r.play, pct: done ? 100 : pct, worst: r.mpv > 5 && arr.length > 1 ? arr[arr.length - 1] : null, list: arr });
      }
      function yoLine(l) {
        if (l === 'readyok') {
          YO.ready = true; nnOk = 1;
          setNN(netBuf ? 'やねうら王 + ' + netName : 'やねうら王(内蔵:水匠5)', 100, 0);
          if (YO.pending) yoKick();
          return;
        }
        if (l.indexOf('bestmove') === 0) return yoBest(l);
        if (l.indexOf('info ') !== 0 || l.indexOf('info string') === 0) return;
        var r = YO.cur;
        if (!r || r.id !== gid) return;
        if (l.indexOf(' lowerbound') > 0 || l.indexOf(' upperbound') > 0) return;
        var mp = /multipv (\d+)/.exec(l), sc = /score (cp|mate) (-?\d+)/.exec(l), pv = / pv (\S+)/.exec(l), dp = /depth (\d+)/.exec(l);
        if (!sc || !pv || !dp) return;
        var v = +sc[2], s = sc[1] === 'cp' ? v : (v > 0 ? 30000 - v : -30000 - v);
        var mv = u2m(pv[1]);
        r.mv[mv] = { m: mv, s: s, d: +dp[1], k: mp ? +mp[1] : 1 };
        r.depth = Math.max(r.depth, +dp[1]);
        if (Date.now() - r.ui > 150) { r.ui = Date.now(); yoPaint(r, 0); }
      }
      function yoBest(l) {
        var r = YO.cur; YO.running = false; YO.cur = null;
        if (YO.pending) { yoKick(); return; }
        if (!r || r.id !== gid || over) return;
        yoPaint(r, 1);
        if (!r.play) return;
        var u = l.split(/\s+/)[1];
        if (u === 'resign') { finish(sideN(P.side) + '投了', P.side ^ 1, '投了'); return; }
        if (u === 'win') { finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち'); return; }
        var m = u2m(u), ls = legal(P);
        if (ls.indexOf(m) < 0) m = ls[0];
        doMove(m);
      }

      /* --- 初期化 --- */
      buildMenu();
      g('nnB').onclick = function () { if (!nnOk) loadHao(); };
      g('res').onclick = function () { this.hidden = true; };
      g('ed').onclick = edClick;
      setInterval(function () {
        if (busy && !over && mode !== 'train' && lastMsg && lastMsg.id === gid && Date.now() - lastRx > 25000) {
          lastRx = Date.now(); W.terminate(); newWorker(); W.postMessage(lastMsg);
        }
      }, 3000);
      newWorker();
      autoLoad();
      yoInit();
      g('btns').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'bNew') newGame();
        else if (b.id === 'bTr') { if (trainOn) { trainOn = 0; busy = 0; W.postMessage({ cmd: 'stop' }); renderBtns(); } else startTrain(); }
        else if (b.id === 'bTrR') { LWS = new Float64Array(16); try { localStorage.removeItem('shogiLW'); } catch (e) { } if (trainOn) startTrain(); else { trStat = '学習をリセットしました'; paintTrain(); } }
        else if (b.id === 'bMenu') g('menu').hidden = !g('menu').hidden;
        else if (b.dataset.a === 'u') undoFor(+b.dataset.c);
        else if (b.dataset.a === 'r') resign(+b.dataset.c);
        else if (b.dataset.a === 'd') declare();
        else if (b.dataset.a === 'p') pauseGame();
        else if (b.dataset.a === 'c') resumeGame();
        else if (b.dataset.a === 's') toStudy();
        else if (b.dataset.a === 'e') startEdit();
      };
      newGame();
    </script>
  </body>
