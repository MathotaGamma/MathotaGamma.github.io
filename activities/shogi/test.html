      function bkTab() {
        var ids = { make: 'bkMake', list: 'bkList', explore: 'bkExp' };
        Object.keys(ids).forEach(function (t) {
          g(ids[t]).hidden = BKS.tab !== t;
        });
        Array.prototype.forEach.call(g('bk').querySelectorAll('[data-t]'), function (b) {
          b.classList.toggle('on', b.dataset.t === BKS.tab);
        });
        if (BKS.tab !== 'explore' && BKS.wasEx) bkxLeave();
        BKS.wasEx = BKS.tab === 'explore';
        if (BKS.tab === 'list') bkRenderList();
        else if (BKS.tab === 'make') bkFillTarget();
        else bkxEnter();
      }

      /* --- 枝の探索(サブ盤面で駒を動かすと、AIがその局面から先の変化を探索する。定跡があれば定跡も出す) --- */
      var BKX = { flip: 0, B: null, Q: null, path: [], sort: 'c', sel: null, tg: null, seq: 0, ana: null, sec: 3, mpv: 5, auto: 0, jsId: 0, jid: 0, last: null };

      function bkxLabel(Q, m) {
        var save = P;
        P = Q;
        try {
          return (Q.side ? '△' : '▲') + mvT(m);
        } finally {
          P = save;
        }
      }

      function bkxStopEng() {
        BKX.seq++;
        YO.pending = false;
        if (YO.running) YO.send('stop');
        if (BKX.jsId) {
          W.postMessage({ cmd: 'stop' });
          BKX.jsId = 0;
          busy = 0;
        }
      }

      /* 探索タブを開いた・閉じたとき。開いている間は本局の思考を止め、閉じたら本局を再開する */
      function bkxEnter() {
        if (!BKX.Q) bkxReset(0);
        else bkxGo();
      }

      function bkxLeave() {
        bkxStopEng();
        BKX.auto = 0;
        if (!over && !editing && !paused && (mode === 'vs' || mode === 'study')) {
          gid++;
          next();
        }
      }

      function bkxReset(fromBoard) {
        var base = fromBoard && startSfen ? clonePos(startP) : newPos();
        BKX.B = base;
        BKX.Q = clonePos(base);
        BKX.path = [];
        BKX.sel = BKX.tg = null;
        BKX.auto = 0;
        if (fromBoard)
          hist.forEach(function (h) {
            make(BKX.Q, h.m);
            BKX.path.push(h.m);
          });
        bkxGo();
      }

      function bkxBack() {
        if (!BKX.path.length) return;
        BKX.path.pop();
        BKX.Q = clonePos(BKX.B);
        BKX.path.forEach(function (m) {
          make(BKX.Q, m);
        });
        BKX.sel = BKX.tg = null;
        BKX.auto = 0;
        bkxGo();
      }

      function bkxApply(m) {
        if (legal(BKX.Q).indexOf(m) < 0) return;
        BKX.last = bkxLabel(BKX.Q, m);
        make(BKX.Q, m);
        BKX.path.push(m);
        BKX.sel = BKX.tg = null;
        bkxGo();
      }

      function bkxGo() {
        bkxPaintPath();
        bkxPaintBoard();
        bkxPaintBook();
        bkxAnalyze();
      }

      /* AI(やねうら王。使えなければ自作エンジン)で、サブ盤面の局面を解析する */
      function bkxAnalyze() {
        bkxStopEng();
        var Q = BKX.Q,
          my = BKX.seq;
        BKX.ana = { list: [], depth: 0, ev: null, done: 0 };
        if (!legal(Q).length) {
          BKX.ana.done = 1;
          bkxPaintAna();
          return;
        }
        var ms = Math.max(1, BKX.sec) * 1000;
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        gid++;
        if (YO.state === 'ok') {
          YO.req = {
            id: gid,
            play: 0,
            t0: Date.now(),
            ms: ms,
            dcap: 0,
            mpv: BKX.mpv,
            mv: {},
            dt: {},
            depth: 0,
            cdepth: 0,
            pm: 0,
            ui: 0,
            guide: null,
            Q: Q,
            sfen: toSfen(Q),
            ex: function (r, done) {
              if (my !== BKX.seq) return;
              bkxUpdate(
                Object.keys(r.mv).map(function (k) {
                  return r.mv[k];
                }),
                r.depth,
                r.ev,
                done
              );
            }
          };
          YO.pending = true;
          yoKick();
        } else {
          var id = -(++BKX.jid);
          BKX.jsId = id;
          busy = 1;
          W.postMessage({
            cmd: 'go',
            id: id,
            st: toSt(Q),
            D: Math.min(Math.max(num('D'), 1), 30),
            mpv: Math.max(1, BKX.mpv),
            noScan: 1,
            rk: [hashP(Q)],
            rc: [atk(Q, Q.k[Q.side], Q.side ^ 1) ? 1 : 0],
            lw: Array.from(new Float64Array(16)),
            play: 0,
            ms: ms
          });
        }
        bkxPaintAna();
      }

      /* 自作エンジン(Worker)からの結果 */
      function bkxOnMsg(m) {
        if (anaCb && m.id === anaCb.id) {
          if (m.t === 'done') {
            busy = 0;
            anaCb.fn(m);
          }
          return;
        }
        if (m.id !== BKX.jsId || !m.list) return;
        var dp = 0;
        m.list.forEach(function (x) {
          dp = Math.max(dp, x.d || 0);
        });
        if (m.t === 'done') {
          BKX.jsId = 0;
          busy = 0;
        }
        bkxUpdate(m.list.slice(0, Math.max(BKX.mpv, 1)), dp, m.ev, m.t === 'done');
      }

      function bkxUpdate(list, depth, ev, done) {
        var arr = list.slice();
        arr.sort(function (a, b) {
          return (b.d === depth) - (a.d === depth) || (a.k || 0) - (b.k || 0) || b.s - a.s;
        });
        BKX.ana = { list: arr.slice(0, BKX.mpv), depth: depth, ev: ev, done: done ? 1 : 0 };
        bkxPaintAna();
        if (done && BKX.auto > 0 && arr.length) {
          BKX.auto--;
          bkxApply(arr[0].m);
        }
      }

      /* --- 表示 --- */
      function bkxPaintPath() {
        var names = [],
          R = clonePos(BKX.B),
          save = P;
        try {
          BKX.path.forEach(function (m) {
            P = R;
            names.push((R.side ? '△' : '▲') + mvT(m));
            make(R, m);
          });
        } finally {
          P = save;
        }
        g('bkxPath').innerHTML = names.length
          ? names.map(function (t, i) { return (i + 1) + '.' + t; }).join(' ')
          : '(初期局面)';
      }

      function bkxPaintBoard() {
        var Q = BKX.Q,
          lm = BKX.path.length ? BKX.path[BKX.path.length - 1] : -1,
          h = '<table class="bkxb' + (BKX.flip ? ' flip' : '') + '">';
        for (var r0 = 0; r0 < 9; r0++) {
          h += '<tr>';
          for (var f0 = 0; f0 < 9; f0++) {
            var r = BKX.flip ? 8 - r0 : r0,
              f = BKX.flip ? f0 : 8 - f0,
              s = f * 9 + r,
              p = Q.b[s],
              cl = (p >> 4 ? 'w ' : '') + (BKX.sel && BKX.sel.from === s ? 'sel ' : '') + (BKX.tg && BKX.tg[s] ? 'tg ' : '') + (lm >= 0 && ((lm >> 7) & 127) === s ? 'lm' : '');
            h += '<td data-q="' + s + '" class="' + cl + '">' + (p ? '<span>' + NM[p & 15] + '</span>' : '') + '</td>';
          }
          h += '</tr>';
        }
        h += '</table>';
        [1, 0].forEach(function (sd) {
          var t = '';
          for (var k = 7; k >= 1; k--)
            if (Q.h[sd][k]) {
              var mine = sd === Q.side;
              t += '<span' + (mine ? ' data-hq="' + k + '" class="hq' + (BKX.sel && BKX.sel.drop === k ? ' sel' : '') + '"' : '') + '>' + NM[k] + (Q.h[sd][k] > 1 ? Q.h[sd][k] : '') + '</span> ';
            }
          h += '<div style="font-size:13px;color:#ccc">' + (sd ? '△後手' : '▲先手') + 'の持ち駒: ' + (t || 'なし') + '</div>';
        });
        g('bkxBd').innerHTML = h;
      }

      function bkxRows(ls, withEval) {
        var Q = BKX.Q,
          h = '';
        ls.forEach(function (x) {
          h +=
            '<div data-x="' + x.m + '" style="cursor:pointer;border:1px solid #555;border-radius:4px;padding:5px;margin:3px 0">' +
            bkxLabel(Q, x.m) +
            (withEval ? ' <b>' + fmtS(x.s) + '</b> <span style="color:#aaa">深さ' + (x.d || '') + '</span>' : ' <b>' + x.c + '</b>局 勝率' + Math.round((x.w * 100) / x.c) + '%') +
            '</div>';
        });
        return h;
      }

      function bkxPaintBook() {
        var el = g('bkxBook');
        if (!BKA) {
          el.innerHTML = '<div style="color:#aaa;margin:6px 0">定跡が選ばれていません</div>';
          return;
        }
        var ls = bkMoves(BKX.Q, 1).slice(),
          tot = 0;
        ls.forEach(function (x) {
          tot += x.c;
        });
        ls.sort(function (a, b) {
          return BKX.sort === 'w' ? b.w / b.c - a.w / a.c || b.c - a.c : b.c - a.c || b.w - a.w;
        });
        el.innerHTML =
          '<div style="margin-top:8px;color:#8f8">定跡 ' + ls.length + '通り・計' + tot + '局 <button data-a="xs" data-v="c"' + (BKX.sort === 'c' ? ' class="on"' : '') + '>採用数</button><button data-a="xs" data-v="w"' + (BKX.sort === 'w' ? ' class="on"' : '') + '>勝率</button></div>' +
          (ls.length ? bkxRows(ls, 0) : '<div style="color:#aaa">定跡なし</div>');
      }

      function bkxPaintAna() {
        var a = BKX.ana,
          el = g('bkxAna');
        if (!a) return;
        var st = a.done
          ? '完了(深さ' + a.depth + ')'
          : '解析中' + (a.depth ? ' 深さ' + a.depth : '') + (BKX.auto > 0 ? ' / 自動あと' + BKX.auto + '手' : '');
        el.innerHTML =
          '<div style="margin-top:8px;color:#fc6">AI ' + st + (a.ev != null && a.list.length ? ' / 評価値 ' + fmtS(a.ev) : '') + '</div>' +
          (a.list.length ? bkxRows(a.list, 1) : '<div style="color:#aaa">' + (a.done ? '指せる手なし' : '待機中…') + '</div>');
      }

      function bkxTap(s) {
        var Q = BKX.Q;
        if (BKX.tg && BKX.tg[s]) {
          var c = BKX.tg[s],
            m = c[0];
          if (c.length > 1) {
            var yes = confirm('成りますか?(OK=成る / キャンセル=成らない)');
            m = c.filter(function (x) {
              return !!((x >> 14) & 1) === yes;
            })[0];
          }
          bkxApply(m);
          return;
        }
        var p = Q.b[s];
        BKX.sel = BKX.tg = null;
        if (p && p >> 4 === Q.side) {
          var tg = {};
          legal(Q).forEach(function (m2) {
            if ((m2 & 127) === s) (tg[(m2 >> 7) & 127] = tg[(m2 >> 7) & 127] || []).push(m2);
          });
          BKX.sel = { from: s };
          BKX.tg = tg;
        }
        bkxPaintBoard();
      }

      function bkxTapHand(t) {
        var tg = {};
        legal(BKX.Q).forEach(function (m) {
          if ((m & 127) === 81 && m >> 15 === t) (tg[(m >> 7) & 127] = tg[(m >> 7) & 127] || []).push(m);
        });
        BKX.sel = { drop: t };
        BKX.tg = tg;
        bkxPaintBoard();
      }

      function bkFillTarget() {
        var cur = g('bkTarget').value,
          h = '<option value="">新しい定跡を作る</option>';
        bkMeta().forEach(function (x) {
          h += '<option value="' + x.id + '">既存「' + bkEsc(x.name) + '」に追加(' + x.pos + '局面)</option>';
        });
        g('bkTarget').innerHTML = h;
        g('bkTarget').value = cur;
      }

      /* --- 検索条件の解釈 --- */
      function bkTokRaw(tk) {
        var u = tk.replace(/^[▲△+\-]/, ''),
          x = /^([1-9])([1-9])([1-9])([1-9])([A-Z]{2})?$/.exec(u);
        if (x) {
          var pr = x[5] && 'TO NY NK NG UM RY'.indexOf(x[5]) >= 0 ? '+' : '';
          u = x[1] + 'abcdefghi'.charAt(x[2] - 1) + x[3] + 'abcdefghi'.charAt(x[4] - 1) + pr;
        } else if (/^[plnsgbr]\*[1-9][a-i]$/i.test(u)) u = u.charAt(0).toUpperCase() + u.slice(1);
        if (/^[1-9][a-i][1-9][a-i]\+?$/.test(u) || /^[PLNSGBR]\*[1-9][a-i]$/.test(u)) return u2m(u);
        return -1;
      }

      function bkTokMove(tk, Q) {
        var m = bkTokRaw(tk);
        return m >= 0 && legal(Q).indexOf(m) >= 0 ? m : -1;
      }

      /* 自分の手だけ(相手の手は問わない) */
      function bkParseOwn(str) {
        var ts = str.trim().split(/[\s,、]+/).filter(Boolean);
        if (!ts.length) throw new Error('自分の指し手が入力されていません');
        return ts.map(function (tk, i) {
          var m = bkTokRaw(tk);
          if (m < 0) throw new Error((i + 1) + '個目「' + tk + '」は解釈できません(例: 7g7f 6g6f / 8h2b+ / P*5e)');
          return m;
        });
      }

      function bkParseMoves(str) {
        var Q = newPos(),
          seq = [],
          ts = str.trim().split(/[\s,、]+/).filter(Boolean);
        if (!ts.length) throw new Error('指し手が入力されていません');
        ts.forEach(function (tk, i) {
          var m = bkTokMove(tk, Q);
          if (m < 0) throw new Error((i + 1) + '手目「' + tk + '」は解釈できないか、その局面で指せない手です');
          make(Q, m);
          seq.push(m);
        });
        return { hash: hashP(Q), n: ts.length, seq: seq };
      }

      function bkParseForm(str) {
        var gs = [];
        str
          .trim()
          .split(/[\s,、]+/)
          .filter(Boolean)
          .forEach(function (tk) {
            var o = parseGoalTok(tk);
            if (!o) throw new Error('「' + tk + '」は解釈できません(例: k2h s3h 歩76 成香1d)');
            gs.push(o);
          });
        if (!gs.length) throw new Error('囲いの駒とマスが入力されていません');
        return gs;
      }

      /* 取得元の候補(上から順に試す): 指定したURL → ミラー */
      function bkUrls(nm, year) {
        var us = [],
          cu = g('bkUrl').value.trim();
        if (cu) us.push(cu.replace(/\{year\}/g, year));
        us.push(BK_MIRROR.replace('{year}', year));
        return us;
      }

      /* 同じ.7zを、この定跡に追加済みか調べる */
      function bkDup(meta, name, size) {
        if (!meta || !meta.files) return null;
        return (
          meta.files.filter(function (f) {
            return f.name === name && (!size || !f.size || f.size === size);
          })[0] || null
        );
      }

      function bkAskDup(meta, name, size) {
        var d = bkDup(meta, name, size);
        return !d || confirm('「' + name + '」は、定跡「' + meta.name + '」に追加済みです(' + (d.date || '') + ' / 条件: ' + (d.cond || '') + ')。もう一度追加しますか?');
      }

      function openBook() {
        g('menu').hidden = true;
        g('bk').hidden = false;
        bkTab();
      }

      function bkRenderList() {
        var ms = bkMeta(),
          on = bkLS('shogiBkOn', ''),
          h =
            '<label style="color:#eee"><input type="checkbox" id="bkUse"' + (bkLS('shogiBkUse', '1') === '1' ? ' checked' : '') + '> AIの手番で定跡を使う</label>' +
            '<label>定跡を行うのは</label><select id="bkWho"><option value="me">自分</option><option value="ai">AI</option></select>' +
            '<div style="font-size:12px;color:#aaa">自分=自分の手番側の定跡 / AI=AIの手番側の定跡(自分が先手なら先手の定跡)</div>' +
            '<label>使う最大手数</label><input type="number" id="bkMax" min="1" value="' + bkMax() + '">' +
            '<div style="margin-top:8px"><label style="color:#eee"><input type="radio" name="bkSel" value=""' + (on ? '' : ' checked') + '> 使わない</label></div>';
        ms.forEach(function (x) {
          var sd = x.sides ? ' 先手 ' + ((x.sides[0] || {}).pos || 0) + '局面/' + ((x.gamesBy || {})[0] || 0) + '局, 後手 ' + ((x.sides[1] || {}).pos || 0) + '局面/' + ((x.gamesBy || {})[1] || 0) + '局' : '';
          h +=
            '<div style="border:1px solid #555;border-radius:6px;padding:6px;margin:6px 0"><label style="margin:0;color:#eee"><input type="radio" name="bkSel" value="' + x.id + '"' + (x.id === on ? ' checked' : '') + '> ' + bkEsc(x.name) + '</label>' +
            '<div style="font-size:12px;color:#aaa">' + x.pos + '局面 / ' + x.games + '局' + sd + '</div>' +
            '<div style="font-size:11px;color:#888">' + bkEsc((x.files || []).map(function (f) { return f.name; }).join(', ')) + ' ' + bkEsc(x.made || '') + '</div>' +
            '<button data-a="exp" data-id="' + x.id + '">書き出し</button> <button data-a="del" data-id="' + x.id + '">削除</button></div>';
        });
        if (!ms.length) h += '<div style="margin:8px 0">定跡がありません</div>';
        h += '<label>読み込み(.json)</label><input type="file" id="bkImp" accept=".json,application/json">';
        g('bkList').innerHTML = h;
        bkSyncWho();
      }

      /* --- 作成の実行(取得→解凍・集計を複数のワーカーで並行→結合) --- */
      var BKR = null; /* 実行中の1回分。なければ null */

      function bkPct(f) {
        return Math.max(0, Math.min(1, f)) * 100 + '%';
      }

      /* 文章だけの状態(準備中・中止・失敗・完成など)。0 と 1 のときは、2本のバーも 0% / 100% にそろえる */
      function bkProg(frac, txt, stat) {
        g('bkB').style.width = bkPct(frac);
        if (frac === 0 || frac === 1) {
          g('bkB1').style.width = bkPct(frac);
          g('bkT1').textContent = frac ? '完了' : '-';
          g('bkT2').textContent = frac ? '完了' : '-';
        }
        g('bkP').textContent = txt;
        if (stat != null) g('bkS').textContent = stat;
      }

      function bkSec(s) {
        s = Math.max(0, Math.round(s));
        return s >= 60 ? Math.floor(s / 60) + '分' + (s % 60) + '秒' : s + '秒';
      }

      function bkBusy(on) {
        BKS.busy = on;
        var b = g('bk').querySelector('[data-a="stop"]');
        b.hidden = !on;
        ['go', 'pick'].forEach(function (a) {
          g('bk').querySelector('[data-a="' + a + '"]').disabled = !!on;
        });
      }

      /* 後片付け(取得の中断・ワーカー停止・状態のリセット)。何があっても次の開始ができる状態に戻す */
      function bkRunEnd(run, msg) {
        run.dead = true;
        try {
          run.ctl.abort();
        } catch (e) {}
        run.workers.forEach(function (w) {
          try {
            w.terminate();
          } catch (e) {}
        });
        run.workers = [];
        if (BKR === run) BKR = null;
        bkBusy(0);
        if (msg) bkProg(0, msg, '');
      }

      function bkStop() {
        if (BKR) bkRunEnd(BKR, '中止しました');
        else bkBusy(0);
      }

      function bkFail(run, e) {
        if (!run || run.dead) return;
        bkRunEnd(run, '');
        var net = e instanceof TypeError || (e && /HTTP|range|Failed to fetch|NetworkError/i.test(e.message || ''));
        bkProg(0, '', '');
        g('bkP').innerHTML =
          '<span style="color:#f88">' +
          bkEsc('失敗: ' + (e && e.message ? e.message : e)) +
          '</span>' +
          (net ? '<div style="margin-top:6px">取得できません。取得元URLを確認するか、保存した.7zを「.7zから作成」で選んでください。</div>' : '');
      }

      async function bkIs7z(blob) {
        try {
          var u = new Uint8Array(await blob.slice(0, 6).arrayBuffer());
          return u[0] === 0x37 && u[1] === 0x7a && u[2] === 0xbc && u[3] === 0xaf && u[4] === 0x27 && u[5] === 0x1c;
        } catch (e) {
          return false;
        }
      }

      async function bkCacheGet(url) {
        try {
          if (!window.caches) return null;
          var c = await caches.open('wdoor7z-v1'),
            r = await c.match(url);
          return r ? await r.blob() : null;
        } catch (e) {
          return null;
        }
      }

      async function bkCachePut(url, blob) {
        try {
          if (!window.caches || !g('bkSave').checked) return;
          var c = await caches.open('wdoor7z-v1');
          await c.put(url, new Response(blob, { headers: { 'content-type': 'application/octet-stream' } }));
        } catch (e) {}
      }

      async function bkCacheClear() {
        try {
          await caches.delete('wdoor7z-v1');
          bkProg(0, '保存した.7zを削除しました', '');
        } catch (e) {
          bkProg(0, '削除できませんでした: ' + e.message, '');
        }
      }

      /* 分割(Range)取得: 8MBずつ6本並行で取得して、通常の1本取得より速くする */
      async function bkRanged(url, onProg, signal, onSize) {
        var h = await fetch(url, { method: 'HEAD', signal: signal });
        if (!h.ok) throw new Error('HTTP ' + h.status);
        var total = +h.headers.get('content-length');
        if (!total) throw new Error('サイズ不明');
        if (onSize) onSize(total);
        var CH = 8 * 1048576,
          n = Math.ceil(total / CH),
          parts = new Array(n),
          next = 0,
          got = 0;
        async function lane() {
          while (next < n) {
            var i = next++,
              a = i * CH,
              b = Math.min(total, a + CH) - 1,
              r = await fetch(url, { headers: { Range: 'bytes=' + a + '-' + b }, signal: signal });
            if (r.status !== 206) throw new Error('range未対応(' + r.status + ')');
            var buf = await r.arrayBuffer();
            if (buf.byteLength !== b - a + 1) throw new Error('range長さ不一致');
            parts[i] = buf;
            got += buf.byteLength;
            onProg(got / total);
          }
        }
        var lanes = [];
        for (var k = 0; k < Math.min(6, n); k++) lanes.push(lane());
        await Promise.all(lanes);
        return new Blob(parts);
      }

      async function bkStream(url, onProg, signal, onSize) {
        var r = await fetch(url, { signal: signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var tot = +r.headers.get('content-length') || 0,
          ch = [],
          n = 0,
          rd = r.body.getReader();
        if (tot && onSize) onSize(tot);
        for (;;) {
          var x = await rd.read();
          if (x.done) break;
          ch.push(x.value);
          n += x.value.length;
          if (tot) onProg(n / tot);
        }
        return new Blob(ch);
      }

      async function bkGet(run, j) {
        var urls = bkUrls(j.name, j.year),
          last = null;
        for (var k = 0; k < urls.length; k++) {
          var url = urls[k],
            hit = await bkCacheGet(url);
          if (hit && (await bkIs7z(hit))) {
            j.dlFrac = 1;
            j.st = '保存済みを再利用';
            return hit;
          }
          try {
            var blob,
              onS = function (n) {
                j.size = n;
              },
              onP = function (f) {
                j.dlFrac = f;
                bkRunPaint(run);
              };
            try {
              blob = await bkRanged(url, onP, run.ctl.signal, onS);
            } catch (e1) {
              if (run.dead || (e1 && e1.name === 'AbortError')) throw e1;
              blob = await bkStream(url, onP, run.ctl.signal, onS);
            }
            if (!(await bkIs7z(blob))) throw new Error('7zファイルではありません(' + url.replace(/^https?:\/\//, '').split('/')[0] + ')');
            await bkCachePut(url, blob);
            return blob;
          } catch (e) {
            if (run.dead || (e && e.name === 'AbortError')) throw e;
            last = e;
          }
        }
        throw last || new Error('取得できません');
      }

      function bkSumS(run) {
        var S = { games: 0, g0: 0, g1: 0, rated: 0, scanned: 0, norate: 0, short: 0, bad: 0 },
          pos = 0;
        run.jobs.forEach(function (j) {
          if (j.S)
            Object.keys(S).forEach(function (k) {
              S[k] += j.S[k] || 0;
            });
          pos += j.pos || 0;
        });
        S.pos = pos;
        return S;
      }

      function bkRunPaint(run, force) {
        if (run.dead) return;
        var now = Date.now();
        if (!force && now - (run.lp || 0) < 120) return;
        run.lp = now;
        var jobs = run.jobs,
          known = jobs.filter(function (j) {
            return j.size;
          }),
          avg = known.length
            ? known.reduce(function (s, j) {
                return s + j.size;
              }, 0) / known.length
            : 1,
          wsum = 0,
          dlGot = 0,
          dlTot = 0,
          anSum = 0,
          lines = [];
        jobs.forEach(function (j) {
          var w = j.size || avg,
            df = j.dl ? 1 : j.dlFrac || 0;
          wsum += w;
          dlTot += w;
          dlGot += w * df;
          anSum += w * (j.frac || 0);
          lines.push(
            j.name + ': ' +
              (j.st === '解析中'
                ? '解析 ' + Math.round((j.frac || 0) * 100) + '%' + (j.tot ? '(棋譜 ' + j.n + '/' + j.tot + ')' : '')
                : j.st === 'ダウンロード'
                  ? 'ダウンロード ' + Math.round(df * 100) + '%'
                  : j.st)
          );
        });
        var dlF = dlTot ? dlGot / dlTot : 0,
          anF = wsum ? anSum / wsum : 0,
          el = (now - run.t0) / 1000;
        /* ダウンロードの速度と残り時間 */
        if (!run.dlT0 && dlGot > 0) run.dlT0 = now;
        var dlTxt = Math.round(dlF * 100) + '%';
        if (run.dlT0 && dlF < 1) {
          var mb = known.length ? (dlGot / 1048576).toFixed(0) + 'MB/' + (dlTot / 1048576).toFixed(0) + 'MB' : '';
          var sp = (dlGot / 1048576) / Math.max(0.5, (now - run.dlT0) / 1000);
          dlTxt += (mb ? '(' + mb + ', ' + sp.toFixed(1) + 'MB/秒)' : '') + (known.length === jobs.length && dlF > 0.03 ? ' 残り約' + bkSec(((now - run.dlT0) / 1000) * (1 - dlF) / dlF) : '');
        } else if (dlF >= 1) dlTxt = '完了';
        /* 解析の残り時間(最初のワーカーが動き始めてからの実測から見積もる) */
        if (!run.anT0 && anF > 0) run.anT0 = now;
        var anTxt = Math.round(anF * 100) + '%';
        if (anF >= 1) anTxt = '完了';
        else if (run.anT0 && anF > 0.03) {
          var waitDl = !run.dlDone;
          if (!waitDl) anTxt += ' 残り約' + bkSec(((now - run.anT0) / 1000) * (1 - anF) / anF);
        }
        g('bkB1').style.width = bkPct(dlF);
        g('bkT1').textContent = dlTxt;
        g('bkB').style.width = bkPct(anF);
        g('bkT2').textContent = anTxt;
        var S = bkSumS(run);
        g('bkP').textContent = lines.join(' / ');
        g('bkS').textContent =
          '採用 ' + S.games + ' / 走査 ' + S.scanned + ' / 手数不足(他はOK) ' + S.short +
          (run.opt.pat && (run.opt.pat.type === 'form' || run.opt.pat.type === 'own') ? ' / 先手 ' + S.g0 + '局・後手 ' + S.g1 + '局' : '') +
          ' / 局面 ' + S.pos + ' / ' + bkSec(el);
      }

      function bkPump(run) {
        while (!run.dead && run.queue.length && run.active < run.cap) {
          run.active++;
          bkSpawn(run, run.queue.shift());
        }
      }

      function bkSpawn(run, j) {
        var w = new Worker(run.url);
        run.workers.push(w);
        j.st = '解析中';
        w.onmessage = function (e) {
          var m = e.data;
          if (run.dead) return;
          if (m.t === 'prog') {
            j.frac = m.frac;
            j.n = m.n;
            j.tot = m.tot;
            j.S = m.S;
            j.pos = m.pos;
            bkRunPaint(run);
          } else if (m.t === 'done') {
            j.book = m.book;
            j.S = m.S;
            j.frac = 1;
            j.st = '完了';
            try {
              w.terminate();
            } catch (x) {}
            run.workers = run.workers.filter(function (x) {
              return x !== w;
            });
            run.active--;
            bkRunPaint(run, true);
            bkPump(run);
            bkCheck(run);
          } else if (m.t === 'err') bkFail(run, new Error(m.txt));
        };
        w.onerror = function (e) {
          bkFail(run, new Error(e.message || 'ワーカーエラー'));
        };
        w.postMessage({ files: [{ name: j.name, blob: j.blob }], opt: Object.assign({}, run.opt, { minCnt: run.perMin, base: null }) });
      }

      function bkEnqueue(run, j) {
        j.st = '待機';
        run.queue.push(j);
        bkPump(run);
      }

      /* すべて取得・解析が終わったら、結果を1つの定跡に結合する */
      function bkCheck(run) {
        if (run.dead || run.merging || !run.dlDone || run.queue.length || run.active) return;
        var rs = run.jobs.filter(function (j) {
          return j.book;
        });
        if (!rs.length) {
          bkFail(run, run.lastErr || new Error('取得できませんでした'));
          return;
        }
        run.merging = true;
        g('bkP').textContent = '結合中…';
        g('bkT2').textContent = '結合中';
        var w = new Worker(run.url);
        run.workers.push(w);
        w.onmessage = function (e) {
          if (e.data.t === 'merged') bkDone(run, e.data.book);
          else if (e.data.t === 'err') bkFail(run, new Error(e.data.txt));
        };
        w.onerror = function (e) {
          bkFail(run, new Error(e.message || 'ワーカーエラー'));
        };
        w.postMessage({
          merge: {
            books: (run.base ? [run.base] : []).concat(
              rs.map(function (j) {
                return j.book;
              })
            ),
            minCnt: run.base ? 1 : run.opt.minCnt
          }
        });
      }

      async function bkDownloadAll(run) {
        for (var i = 0; i < run.jobs.length; i++) {
          var j = run.jobs[i];
          if (j.blob) continue;
          if (run.dead) return;
          j.st = 'ダウンロード';
          try {
            j.blob = await bkGet(run, j);
            j.size = j.blob.size;
            j.dl = 1;
            bkEnqueue(run, j);
          } catch (e) {
            if (run.dead) return;
            j.st = '取得失敗';
            j.frac = 1;
            j.dl = 1;
            run.fails.push(j.name);
            run.lastErr = e;
          }
          bkRunPaint(run, true);
        }
        run.dlDone = true;
        bkCheck(run);
      }

      async function bkGo(local) {
        if (BKR) return;
        var run = (BKR = { ctl: new AbortController(), workers: [], dead: false, jobs: [], queue: [], active: 0, t0: Date.now(), dlDone: false, fails: [], merging: false });
        bkBusy(1);
        bkProg(0, '準備中… (' + new Date().toLocaleTimeString() + ')', '');
        try {
          var opt = {
              minRate: +g('bkRate').value || 0,
              maxPly: Math.max(1, +g('bkPly').value || 50),
              minPly: Math.max(0, +g('bkMin').value || 0),
              minCnt: Math.max(1, +g('bkCnt').value || 2),
              names: g('bkNames')
                .value.toLowerCase()
                .split(/\s+/)
                .filter(Boolean),
              pat: null
            },
            tid = g('bkTarget').value,
            tmeta = bkMeta().filter(function (x) {
              return x.id === tid;
            })[0];
          bkSetLS('shogiBkRate', String(opt.minRate));
          bkSetLS('shogiBkUrl', g('bkUrl').value.trim());
          var pt = g('bkPatT').value;
          if (pt === 'moves') {
            var pm = bkParseMoves(g('bkMoves').value);
            opt.pat = { type: 'moves', hash: pm.hash, seq: pm.seq, exact: !g('bkMMerge').checked };
            opt.maxPly = Math.max(opt.maxPly, pm.n);
            run.cond = '戦法(両者' + (opt.pat.exact ? '' : '・合流') + ') ' + g('bkMoves').value.trim();
          } else if (pt === 'own') {
            var sq = bkParseOwn(g('bkOwn').value);
            opt.pat = { type: 'own', side: +g('bkWhoB').value, seq: sq, loose: g('bkOLoose').checked };
            opt.maxPly = Math.max(opt.maxPly, sq.length * 2);
            run.cond = '戦法(自分の手・' + ['先手', '後手', '先手後手'][opt.pat.side] + ') ' + g('bkOwn').value.trim();
          } else if (pt === 'form') {
            opt.pat = { type: 'form', goals: bkParseForm(g('bkForm').value), side: +g('bkWhoB').value };
            run.cond = '囲い ' + g('bkForm').value.trim() + '(' + ['先手', '後手', '先手後手'][opt.pat.side] + ')';
          } else run.cond = '指定なし';
          if (opt.pat) opt.minCnt = 1; /* 棋譜が少ないので、出現数で枝を切らない(切ると、定跡が途中で行き止まりになる) */
          run.cond += ' / レート' + opt.minRate + '以上 / 先頭' + opt.maxPly + '手';
          run.opt = opt;
          run.tmeta = tmeta;
          if (tmeta) {
            run.base = await idbGet('bk:' + tid);
            if (!run.base) throw new Error('追加先の定跡を読み込めませんでした');
          }
          var items = [];
          if (local)
            local.forEach(function (f) {
              if (!tmeta || bkAskDup(tmeta, f.name, f.size)) items.push({ name: f.name, size: f.size, blob: f });
            });
          else {
            Array.from(g('bk').querySelectorAll('.bkY'))
              .filter(function (c) {
                return c.checked;
              })
              .forEach(function (c) {
                var nm = 'wdoor' + c.value + '.7z';
                if (!tmeta || bkAskDup(tmeta, nm, 0)) items.push({ name: nm, year: c.value });
              });
            if (!items.length && !g('bk').querySelectorAll('.bkY:checked').length) throw new Error('年を選んでください');
          }
          if (!items.length) throw new Error('追加するファイルがありません');
          run.jobs = items.map(function (it, i) {
            return { i: i, name: it.name, year: it.year, size: it.size, blob: it.blob || null, dl: it.blob ? 1 : 0, dlFrac: 0, frac: 0, st: it.blob ? '待機' : '取得待ち', book: null };
          });
          run.perMin = opt.pat ? 1 : Math.max(1, Math.floor(opt.minCnt / run.jobs.length));
          run.cap = Math.max(1, Math.min(3, (navigator.hardwareConcurrency || 2) - 1));
          var eng = g('eng').textContent,
            cut = eng.indexOf("if (typeof document === 'undefined')");
          run.url = URL.createObjectURL(new Blob([(cut > 0 ? eng.slice(0, cut) : eng) + '\n' + g('bkw').textContent], { type: 'text/javascript' }));
          run.jobs.forEach(function (j) {
            if (j.blob) bkEnqueue(run, j);
          });
          bkRunPaint(run, true);
          if (local) run.dlDone = true;
          else bkDownloadAll(run).catch(function (e) {
            bkFail(run, e);
          });
          bkCheck(run);
        } catch (e) {
          bkFail(run, e);
        }
      }

      async function bkDone(run, b) {
        if (run.dead) return;
        var S = bkSumS(run),
          ms = Date.now() - run.t0,
          ls = bkMeta(),
          now = new Date().toISOString().slice(0, 16).replace('T', ' '),
          jobs = run.jobs.filter(function (j) {
            return j.book;
          }),
          fl = jobs.map(function (j) {
            return { name: j.name, size: j.size, cond: run.cond, date: now };
          }),
          fails = run.fails.slice(),
          tmeta = run.tmeta,
          opt = run.opt;
        bkRunEnd(run, '');
        if (!b.parts.length) {
          bkProg(0, '条件に合う局面がありませんでした(採用 ' + S.games + '局)。条件をゆるめてみてください。', '');
          return;
        }
        var pos = 0,
          mvs = 0,
          sides = {};
        b.parts.forEach(function (p) {
          pos += p.keys.length;
          mvs += p.mv.length;
          if (p.tag >= 0) sides[p.tag] = { pos: p.keys.length, mv: p.mv.length };
        });
        var hasSides = Object.keys(sides).length > 0,
          meta = tmeta
            ? ls.filter(function (x) {
                return x.id === tmeta.id;
              })[0]
            : null,
          id = meta ? meta.id : 'b' + Date.now();
        if (meta) {
          meta.games = (meta.games || 0) + S.games;
          meta.pos = pos;
          meta.mv = mvs;
          meta.files = (meta.files || []).concat(fl);
          meta.sides = hasSides ? sides : null;
          meta.gamesBy = { 0: ((meta.gamesBy || {})[0] || 0) + S.g0, 1: ((meta.gamesBy || {})[1] || 0) + S.g1 };
          b.name = meta.name;
          b.minCnt = Math.min(meta.minCnt || opt.minCnt, opt.minCnt);
          meta.minCnt = b.minCnt;
        } else {
          var nm = g('bkName').value.trim() || 'floodgate';
          meta = { id: id, name: nm, made: now, games: S.games, pos: pos, mv: mvs, minRate: opt.minRate, maxPly: opt.maxPly, minCnt: opt.minCnt, files: fl, sides: hasSides ? sides : null, gamesBy: { 0: S.g0, 1: S.g1 } };
          b.name = nm;
          b.minCnt = opt.minCnt;
          ls.unshift(meta);
        }
        try {
          await idbPut('bk:' + id, b);
        } catch (e) {
          bkProg(0, '保存に失敗しました: ' + e.message, '');
          return;
        }
        bkSetLS('shogiBkMeta', JSON.stringify(ls));
        bkSetLS('shogiBkOn', id);
        bkSetLS('shogiBkUse', '1');
        b.id = id;
        BKA = b;
        bkKey = -1;
        BKX.Q = null;
        bkcPaint();
        bkFillTarget();
        var sideTxt = hasSides
          ? ' 先手 ' + ((sides[0] || {}).pos || 0) + '局面(' + S.g0 + '局) / 後手 ' + ((sides[1] || {}).pos || 0) + '局面(' + S.g1 + '局)'
          : '';
        bkProg(
          1,
          (tmeta ? '追加: ' : '完成: ') + pos + '局面 / ' + S.games + '局 / ' + bkSec(ms / 1000) + sideTxt +
            (opt.minPly > 0 ? ' / 手数不足(他はOK)で除外 ' + S.short + '局' : '') +
            (S.games < 20 ? ' / 棋譜が少ないです' : '') +
            (fails.length ? ' / 取得失敗: ' + fails.join(', ') : ''),
          ''
        );
      }

      async function bkDelete(id) {
        if (!confirm('この定跡を削除しますか?')) return;
        try {
          await idbDel('bk:' + id);
        } catch (e) {}
        bkSetLS(
          'shogiBkMeta',
          JSON.stringify(
            bkMeta().filter(function (x) {
              return x.id !== id;
            })
          )
        );
        if (bkLS('shogiBkOn', '') === id) {
          bkSetLS('shogiBkOn', '');
          BKA = null;
          bkKey = -1;
        }
        bkcPaint();
        bkRenderList();
      }

      async function bkExport(id) {
        var d = await idbGet('bk:' + id),
          meta =
            bkMeta().filter(function (x) {
              return x.id === id;
            })[0] || {};
        if (!d) return;
        var o = {
          format: 'shogi-book-2',
          meta: meta,
          minCnt: d.minCnt || 1,
          parts: bkPartsOf(d).map(function (p) {
            return { tag: p.tag, keys: Array.from(p.keys), off: Array.from(p.off), mv: Array.from(p.mv), cnt: Array.from(p.cnt), win: Array.from(p.win) };
          })
        };
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' }));
        a.download = (meta.name || 'book') + '.json';
        a.click();
      }

      async function bkImport(f) {
        try {
          var o = JSON.parse(await f.text()),
            parts;
          if (o.format === 'shogi-book-2' && o.parts) parts = o.parts;
          else throw new Error('定跡ファイルの形式が違います');
          var b = {
              parts: parts.map(function (p) {
                if (p.off.length !== p.keys.length + 1 || p.mv.length !== p.cnt.length) throw new Error('定跡ファイルが壊れています');
                return { tag: p.tag, keys: Float64Array.from(p.keys), off: Uint32Array.from(p.off), mv: Int32Array.from(p.mv), cnt: Uint32Array.from(p.cnt), win: Uint32Array.from(p.win) };
              }),
              minCnt: o.minCnt || 1
            },
            id = 'b' + Date.now(),
            meta = Object.assign({}, o.meta || {}, { id: id }),
            pos = 0,
            mvs = 0;
          b.parts.forEach(function (p) {
            pos += p.keys.length;
            mvs += p.mv.length;
          });
          meta.name = meta.name || f.name.replace(/\.json$/i, '');
          meta.pos = pos;
          meta.mv = mvs;
          meta.minCnt = b.minCnt;
          b.name = meta.name;
          await idbPut('bk:' + id, b);
          var ls = bkMeta();
          ls.unshift(meta);
          bkSetLS('shogiBkMeta', JSON.stringify(ls));
          bkSetLS('shogiBkOn', id);
          b.id = id;
          BKA = b;
          bkKey = -1;
          bkcPaint();
          bkRenderList();
        } catch (e) {
          alert('読み込めませんでした: ' + e.message);
        }
      }

      function bkInit() {
        buildBook();
        var mu = g('bkUseM');
        if (mu) {
          mu.checked = bkLS('shogiBkUse', '1') === '1';
          mu.onchange = function () {
            bkSetUse(mu.checked);
          };
        }
        if (g('bkWhoM'))
          g('bkWhoM').onchange = function () {
            bkSetWho(g('bkWhoM').value);
          };
        bkSyncWho();
        var id = bkLS('shogiBkOn', '');
        if (id)
          bkLoad(id).then(function () {
            /* 読み込みが間に合わず、最初のAIの手が定跡なしで始まっていたら、定跡ありでやり直す */
            try {
              if (BKA && mode === 'vs' && !over && !paused && !editing && P.side !== human && hist.length < 2 && bkUse() && bkMoves().length) think(1);
            } catch (e) {}
          });
      }
      /* ===== 評価値グラフ(先手から見た評価値の推移。縦軸は既存の評価値バーと同じ勝率換算) ===== */
      var evEnd = null;

      /* 0手目〜最終局面の、先手から見た評価値(ないところは null) */
      function evPts() {
        var a = hist.map(function (h) {
          return h.ev == null ? null : h.ev;
        });
        a.push(over ? evEnd : curAn && curAn.ev != null ? curAn.ev * (P.side ? -1 : 1) : null);
        return a;
      }

      function evSvg(w, h) {
        var a = evPts(),
          n = a.length - 1,
          pl = 30,
          pr = 10,
          pt = 10,
          pb = 18,
          iw = w - pl - pr,
          ih = h - pt - pb,
          i,
          s;
        function X(k) {
          return pl + (n ? (k / n) * iw : 0);
        }
        function Y(v) {
          v = Math.abs(v) > 29000 ? (v > 0 ? 2999 : -2999) : Math.max(-2999, Math.min(2999, v));
          return pt + (ih * (2999 - v)) / 5998;
        }
        s = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#222;border-radius:6px"><g font-size="9" fill="#999">';
        [2000, 1000, 0, -1000, -2000].forEach(function (q) {
          var y = Y(q);
          s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y + '" y2="' + y + '" stroke="' + (q === 0 ? '#777' : '#444') + '"' + (q === 0 ? '' : ' stroke-dasharray="3 3"') + '/><text x="2" y="' + (y + 3) + '">' + q + '</text>';
        });
        var step = n > 150 ? 50 : n > 60 ? 20 : 10;
        for (i = 0; i <= n; i += step) s += '<text x="' + X(i) + '" y="' + (h - 4) + '" text-anchor="middle">' + i + '</text>';
        var d = '',
          dots = '',
          pen = 0,
          cnt = 0;
        for (i = 0; i <= n; i++) {
          if (a[i] == null) {
            pen = 0;
            continue;
          }
          cnt++;
          d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(a[i]).toFixed(1);
          pen = 1;
          if (n <= 80) dots += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(a[i]).toFixed(1) + '" r="2" fill="#fc6"/>';
        }
        s += '</g><text x="' + (pl + 3) + '" y="' + (pt + 9) + '" font-size="9" fill="#9cf">先手有利</text><text x="' + (pl + 3) + '" y="' + (pt + ih - 3) + '" font-size="9" fill="#f99">後手有利</text>';
        s += cnt ? '<path d="' + d + '" fill="none" stroke="#fc6" stroke-width="1.8"/>' + dots : '<text x="' + w / 2 + '" y="' + h / 2 + '" font-size="11" fill="#aaa" text-anchor="middle">評価値のデータがありません</text>';
        return s + '</svg>';
      }

      function evOpen() {
        g('menu').hidden = true;
        var el = g('evg'),
          w = Math.min(window.innerWidth - 24, 640);
        el.innerHTML =
          '<div><b>評価値グラフ</b> <span style="font-size:12px;color:#aaa">先手から見た勝率換算</span> <button data-e="x">閉じる</button></div>' +
          '<div style="margin:6px 0">' + evSvg(w, Math.round(w * 0.55)) + '</div>' +
          '<div id="evgT" style="font-size:13px;color:#ccc;white-space:pre-line">グラフをタップすると、その手の評価値・順位が出ます</div>';
        el.hidden = false;
        el.onclick = function (e) {
          if (e.target.closest('[data-e="x"]')) {
            el.hidden = true;
            return;
          }
          var sv = e.target.closest('svg');
          if (!sv) return;
          var r = sv.getBoundingClientRect(),
            a = evPts(),
            n = a.length - 1,
            vb = sv.getAttribute('viewBox').split(' '),
            vw = +vb[2],
            vh = +vb[3],
            x = ((e.clientX - r.left) / (r.width || 1)) * vw,
            i = Math.max(0, Math.min(n, Math.round(((x - 30) / (vw - 40)) * n))),
            old = sv.querySelector('#evSel');
          /* タップした手の位置に緑の線 */
          if (old) old.parentNode.removeChild(old);
          var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          ln.setAttribute('id', 'evSel');
          ln.setAttribute('x1', 30 + (n ? (i / n) * (vw - 40) : 0));
          ln.setAttribute('x2', 30 + (n ? (i / n) * (vw - 40) : 0));
          ln.setAttribute('y1', 10);
          ln.setAttribute('y2', vh - 18);
          ln.setAttribute('stroke', '#4f4');
          ln.setAttribute('stroke-width', 2);
          sv.appendChild(ln);
          var hh = i ? hist[i - 1] : null,
            t = i + '手目' + (hh ? ' ' + hh.txt : '(開始局面)') + '\n指した後の評価値 ' + (a[i] == null ? 'なし' : fmtS(Math.round(a[i])) + '(先手から見て)');
          if (hh && hh.inf) t += '\n' + hh.inf;
          if (hh && hh.bm) t += '\nこの局面の最善手 ' + hh.bm;
          g('evgT').textContent = t;
        };
      }

      /* ===== 棋譜から終盤の局面を探して、勝勢の側を持って VS AI を始める ===== */
      var egGames = [],
        egBusy = 0,
        egN = 0,
        anaCb = null,
        EG_TH = 800;
      var KIF_ZEN = '０１２３４５６７８９',
        KIF_KAN = '〇一二三四五六七八九',
        KIF_PN = { 歩: 1, 香: 2, 桂: 3, 銀: 4, 金: 5, 角: 6, 飛: 7, 玉: 8, 王: 8, と: 9, 杏: 10, 圭: 11, 全: 12, 馬: 14, 龍: 15, 竜: 15 };

      function kifDecode(buf) {
        try {
          return new TextDecoder('utf-8', { fatal: true }).decode(buf);
        } catch (e) {
          return new TextDecoder('shift_jis').decode(buf);
        }
      }

      /* KIF → {moves, n}。平手以外・読めない棋譜・minN手未満は null */
      function kifParse(txt, minN) {
        var lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/),
          mv = [],
          prev = -1,
          Q = newPos(),
          i;
        for (i = 0; i < lines.length; i++) {
          var l = lines[i];
          if (/^手合割[：:]/.test(l) && !/平手/.test(l)) return null;
          if (/^変化[：:]/.test(l)) break;
          var m = l.match(/^\s*\d+\s+(同\s*|[１-９1-9][一二三四五六七八九1-9])(成?[歩香桂銀金角飛玉王と杏圭全馬龍竜])(成|打)?\s*(?:\((\d)(\d)\))?/);
          if (!m) continue;
          var t;
          if (m[1][0] === '同') t = prev;
          else {
            var f = KIF_ZEN.indexOf(m[1][0]),
              r = KIF_KAN.indexOf(m[1][1]);
            if (f < 0) f = +m[1][0];
            if (r < 0) r = +m[1][1];
            t = (f - 1) * 9 + (r - 1);
          }
          prev = t;
          var pc = m[2][0] === '成' ? m[2].slice(1) : m[2],
            opt = m[3],
            ls = legal(Q),
            found = 0,
            j;
          for (j = 0; j < ls.length && !found; j++) {
            var x = ls[j];
            if (((x >> 7) & 127) !== t) continue;
            if (opt === '打') {
              if ((x & 127) === 81 && x >> 15 === KIF_PN[pc]) found = x;
            } else if (m[4] && (x & 127) === (+m[4] - 1) * 9 + (+m[5] - 1) && ((x >> 14) & 1) === (opt === '成' ? 1 : 0)) found = x;
          }
          if (!found) return null;
          make(Q, found);
          mv.push(found);
        }
        return mv.length >= (minN || 60) ? { moves: mv, n: mv.length } : null;
      }

      async function egLoad(e) {
        var fs = e.target.files,
          i;
        g('egS').textContent = '読込中…';
        for (i = 0; i < fs.length; i++) {
          try {
            var gm = kifParse(kifDecode(await fs[i].arrayBuffer()));
            if (gm) egGames.push(gm);
          } catch (err) {}
          if (i % 20 === 19) await new Promise(setTimeout);
        }
        g('egS').textContent = '棋譜: ' + egGames.length + '局(60手以上の平手のみ)';
        e.target.value = '';
      }

      /* 1局面をエンジンで短時間評価する(手番側の評価値)。読めなければ null */
      function anaOnce(Q, ms, cb) {
        bkxStopEng();
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        var fin = 0,
          done = function (v) {
            if (fin) return;
            fin = 1;
            clearTimeout(tmo);
            anaCb = null;
            cb(v);
          },
          tmo = setTimeout(function () {
            done(null);
          }, ms + 5000);
        gid++;
        if (YO.state === 'ok') {
          YO.req = {
            id: gid,
            play: 0,
            t0: Date.now(),
            ms: ms,
            dcap: 0,
            mpv: 1,
            mv: {},
            dt: {},
            depth: 0,
            cdepth: 0,
            pm: 0,
            ui: 0,
            guide: null,
            Q: Q,
            sfen: toSfen(Q),
            ex: function (r, d) {
              if (!d) return;
              var best = null;
              Object.keys(r.mv).forEach(function (k) {
                var x = r.mv[k];
                if (!best || x.d > best.d || (x.d === best.d && x.s > best.s)) best = x;
              });
              done(best ? best.s : null);
            }
          };
          YO.pending = true;
          yoKick();
        } else {
          var id = -(500000 + ++egN);
          anaCb = {
            id: id,
            fn: function (m) {
              done(m.list.length ? m.list[0].s : null);
            }
          };
          busy = 1;
          W.postMessage({
            cmd: 'go',
            id: id,
            st: toSt(Q),
            D: 12,
            mpv: 1,
            noScan: 1,
            rk: [hashP(Q)],
            rc: [atk(Q, Q.k[Q.side], Q.side ^ 1) ? 1 : 0],
            lw: Array.from(new Float64Array(16)),
            play: 0,
            ms: ms
          });
        }
      }

      async function egStart() {
        if (egBusy) return;
        if (nnWait) {
          g('msg').textContent = 'NN読込後に実行してください';
          return;
        }
        if (!egGames.length) {
          g('msg').textContent = '先に棋譜(KIF)を読み込んでください';
          return;
        }
        egBusy = 1;
        g('menu').hidden = true;
        var best = null,
          k;
        for (k = 1; k <= 25; k++) {
          var gm = egGames[(Math.random() * egGames.length) | 0],
            lo = Math.max(40, gm.n - 40),
            hi = gm.n - 6;
          if (hi < lo) continue;
          var ply = lo + ((Math.random() * (hi - lo + 1)) | 0),
            Q = newPos(),
            j;
          for (j = 0; j < ply; j++) make(Q, gm.moves[j]);
          if (!legal(Q).length) continue;
          g('msg').textContent = '終盤の局面を探しています… ' + k + '/25';
          var sc = await new Promise(function (res) {
            anaOnce(Q, 1200, res);
          });
          /* 詰みが見えている局面は除く */
          if (sc === null || Math.abs(sc) >= 29000) continue;
          if (!best || Math.abs(sc) > best.a) best = { Q: Q, s: sc, a: Math.abs(sc) };
          if (best.a >= EG_TH) break;
        }
        egBusy = 0;
        if (!best || best.a < 400) {
          g('msg').textContent = '勝勢の終盤が見つかりませんでした。もう一度押すと別の局面を探します';
          if (!over && !paused && !editing) next();
          return;
        }
        var win = best.s > 0 ? best.Q.side : best.Q.side ^ 1;
        g('mode').value = 'vs';
        g('side').value = String(win);
        newGame(best.Q);
        g('msg').textContent = '終盤から開始: あなたは' + (win ? '後手' : '先手') + '(勝勢 ' + best.a + 'cp)';
      }

      /* --- 初期化 --- */
      buildMenu();
      bkInit();

      function syncCustom() {
        SPEC.forEach(function (sp) {
          var c = g(sp[0] + 'C');
          if (c) c.style.display = g(sp[0]).value === 'c' ? '' : 'none';
        });
      }
      document.addEventListener('change', syncCustom);
      syncCustom();
      g('nnB').onclick = function () {
        if (!nnOk) loadHao();
      };
      g('res').onclick = function () {
        this.hidden = true;
      };
      g('ed').onclick = edClick;
      setInterval(function () {
        if (busy && !over && lastMsg && lastMsg.id === gid && Date.now() - lastRx > 25000) {
          lastRx = Date.now();
          W.terminate();
          newWorker();
          W.postMessage(lastMsg);
        }
      }, 3000);
      newWorker();
      autoLoad();
      yoInit();
      g('btns').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'bNew') newGame();
        else if (b.id === 'bMenu') g('menu').hidden = !g('menu').hidden;
        else if (b.dataset.a === 'f') {
          flip ^= 1;
          sel = null;
          render();
        } else if (b.dataset.a === 'm') toggleMan();
        else if (b.dataset.a === 'u') undoFor(+b.dataset.c);
        else if (b.dataset.a === 'r') resign(+b.dataset.c);
        else if (b.dataset.a === 'd') declare();
        else if (b.dataset.a === 'p') pauseGame();
        else if (b.dataset.a === 'c') resumeGame();
        else if (b.dataset.a === 's') toStudy();
        else if (b.dataset.a === 'e') startEdit();
        else if (b.dataset.a === 'k') openBook();
      };
      window.addEventListener('resize', layoutSoon);
      window.addEventListener('orientationchange', layoutSoon);
      window.addEventListener('scroll', function () {
        window.scrollTo(0, 0);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', layoutSoon);
        window.visualViewport.addEventListener('scroll', layoutSoon);
      }
      if (window.ResizeObserver) new ResizeObserver(layoutSoon).observe(g('btns'));
      new MutationObserver(layoutSoon).observe(g('app'), {
        attributes: true,
        attributeFilter: ['hidden'],
        subtree: true
      });
      /* やねうら王への停止要求が失われても止まらないようにする */
      setInterval(function () {
        if (YO.state !== 'ok' || !YO.pending || !YO.running || !YO.stopAt) return;
        if (Date.now() - YO.stopAt < 3000) return;
        YO.stopAt = Date.now();
        if (++YO.stopN >= 2) {
          clearTimeout(YO.gt);
          YO.running = false;
          YO.cur = null;
          yoKick();
        } else YO.send('stop');
      }, 1000);
      layout();
      newGame();
    </script>
