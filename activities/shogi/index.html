<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>将棋AI (tanuki- HalfKP 256x2-32-32)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2b2b; color: #eee; font: 14px sans-serif; touch-action: manipulation; }
      #app { height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 2px; box-sizing: border-box; gap: 2px; --c: min(10.6vw, calc((100dvh - 255px) / 10.2)); }
      #top { width: calc(var(--c) * 9); display: flex; justify-content: space-between; height: 22px; font-size: 13px; }
      .hand { width: calc(var(--c) * 9); height: calc(var(--c) * 0.85); display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; overflow: hidden; }
      .hp { background: #e8c27a; color: #000; border-radius: 4px; padding: 0 5px; font-size: calc(var(--c) * 0.55); line-height: calc(var(--c) * 0.8); }
      .hp.sl { background: #ff8; outline: 2px solid #f60; }
      #board { display: grid; grid-template-columns: repeat(9, var(--c)); grid-template-rows: repeat(9, var(--c)); background: #e8c27a; border: 2px solid #5a3b10; }
      .cell { box-shadow: inset 0 0 0 0.5px #5a3b10; display: flex; align-items: center; justify-content: center; font-size: calc(var(--c) * 0.7); color: #000; position: relative; user-select: none; }
      .cell.w span { transform: rotate(180deg); }
      .cell.pr span { color: #c00; }
      .cell.lm { background: #9fd8ff; }
      .cell.sl { background: #ff8; }
      .cell.tg::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(0, 150, 0, .6); }
      #ev { position: relative; width: calc(var(--c) * 9); height: 16px; background: #eee; border-radius: 3px; overflow: hidden; }
      #ev i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #111; transition: width .3s; }
      #ev span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 16px; color: #fff; mix-blend-mode: difference; }
      #info { width: calc(var(--c) * 9); flex: 1; min-height: 0; overflow: hidden; }
      .bar { height: 8px; background: #555; border-radius: 4px; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: #4c8; }
      #cand div { white-space: nowrap; font-size: 13px; line-height: 17px; }
      #btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding-bottom: env(safe-area-inset-bottom, 0px); }
      button, select, input { font-size: 15px; padding: 5px 9px; }
      #btns button { font-size: 13px; padding: 5px 7px; }
      #menu { position: fixed; inset: 0; background: #1d1d1dee; overflow-y: auto; padding: 10px; box-sizing: border-box; z-index: 5; }
      #menu label { display: block; margin: 6px 0 2px; color: #9cf; }
      #menu input[type=number] { width: 70px; }
      #menu input[type=text] { width: 90%; }
      #ov { position: fixed; left: 6%; right: 6%; top: 38%; background: #000d; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; z-index: 9; font-size: 16px; gap: 10px; pointer-events: none; }
      #ov .bar { width: 90%; height: 14px; }
      #ask { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 8; }
      #ask button { font-size: 28px; padding: 14px 24px; }
      [hidden] { display: none !important; }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="top"><span id="clk"></span><span id="msg"></span></div>
      <div id="ev"><i id="evB"></i><span id="evT">形勢</span></div>
      <div class="hand" id="h0"></div>
      <div id="board"></div>
      <div class="hand" id="h1"></div>
      <div id="info">
        <div class="bar" id="bar"><i></i></div>
        <div id="cand"></div>
      </div>
      <div id="btns"></div>
    </div>
    <div id="menu" hidden></div>
    <div id="ask" hidden>
      <button id="aY">成</button>
      <button id="aN">不成</button>
    </div>
    <div id="ov" hidden>
      <div id="ovT"></div>
      <div class="bar"><i id="ovB"></i></div>
    </div>

    <script id="eng">
      /* ===== 将棋エンジン(メインとWorkerで共用) ===== */
      var DR = [-1, -1, 0, 1, 1, 1, 0, -1], DF = [0, 1, 1, 1, 0, -1, -1, -1], FL = [4, 3, 2, 1, 0, 7, 6, 5];
      var STEP = [0, 1, 0, 0, 171, 215, 0, 0, 255, 215, 215, 215, 215, 0, 85, 170];
      var SLD = [0, 0, 1, 0, 0, 0, 170, 85, 0, 0, 0, 0, 0, 0, 170, 85];
      var VAL = [0, 90, 350, 450, 550, 600, 900, 1000, 0, 600, 600, 600, 600, 0, 1100, 1300];
      var KK = [0, 0, 1, 2, 3, 4, 5, 7, 0, 4, 4, 4, 4, 0, 6, 8];
      var HB = [0, 1, 39, 49, 59, 69, 79, 85], HE = [0, 20, 44, 54, 64, 74, 82, 88];
      function newPos() {
        var P = { b: new Int8Array(81), h: [new Int8Array(8), new Int8Array(8)], side: 0, k: [4 * 9 + 8, 4 * 9] };
        var back = [2, 3, 4, 5, 8, 5, 4, 3, 2];
        for (var f = 0; f < 9; f++) {
          P.b[f * 9] = back[f] | 16; P.b[f * 9 + 8] = back[f];
          P.b[f * 9 + 2] = 17; P.b[f * 9 + 6] = 1;
        }
        P.b[7 * 9 + 1] = 7 | 16; P.b[1 * 9 + 1] = 6 | 16;
        P.b[7 * 9 + 7] = 6; P.b[1 * 9 + 7] = 7;
        return P;
      }
      function fromSt(s) {
        return { b: Int8Array.from(s.b), h: [Int8Array.from(s.h[0]), Int8Array.from(s.h[1])], side: s.side, k: s.k.slice() };
      }
      function toSt(P) {
        return { b: Array.from(P.b), h: [Array.from(P.h[0]), Array.from(P.h[1])], side: P.side, k: P.k.slice() };
      }
      function gen(P, co) {
        var b = P.b, c = P.side, o = [], hd = P.h[c], pf = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        function ad(s, ts, t) {
          if (co && !b[ts]) return;
          var r0 = s % 9, r1 = ts % 9, z0 = c ? r0 >= 6 : r0 <= 2, z1 = c ? r1 >= 6 : r1 <= 2, last = c ? 8 - r1 : r1;
          var pr = t <= 7 && t !== 5 && t !== 8 && (z0 || z1);
          var must = (t === 1 || t === 2) ? last === 0 : (t === 3 ? last <= 1 : 0);
          if (pr) o.push(s | ts << 7 | 1 << 14);
          if (!must) o.push(s | ts << 7);
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p || (p >> 4) !== c) continue;
          var t = p & 15, f = (s / 9) | 0, r = s % 9;
          if (t === 1) pf[f] = 1;
          if (t === 3) {
            var kr = r + (c ? 2 : -2);
            if (kr >= 0 && kr < 9) for (var e = -1; e <= 1; e += 2) { var kf = f + e; if (kf >= 0 && kf < 9 && !(b[kf * 9 + kr] && (b[kf * 9 + kr] >> 4) === c)) ad(s, kf * 9 + kr, t); }
          }
          for (var j = 0; j < 8; j++) {
            var sl = SLD[t] >> j & 1;
            if (!(STEP[t] >> j & 1) && !sl) continue;
            var a = c ? FL[j] : j, nf = f + DF[a], nr = r + DR[a];
            while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
              var q = b[nf * 9 + nr];
              if (q && (q >> 4) === c) break;
              ad(s, nf * 9 + nr, t);
              if (q || !sl) break;
              nf += DF[a]; nr += DR[a];
            }
          }
        }
        if (!co) {
          for (var d = 1; d < 8; d++) {
            if (!hd[d]) continue;
            for (var u = 0; u < 81; u++) {
              if (b[u]) continue;
              var uf = (u / 9) | 0, ur = u % 9, ul = c ? 8 - ur : ur;
              if ((d <= 2 && ul === 0) || (d === 3 && ul <= 1) || (d === 1 && pf[uf])) continue;
              o.push(81 | u << 7 | d << 15);
            }
          }
        }
        return o;
      }
      function atk(P, s, c) {
        var b = P.b, f = (s / 9) | 0, r = s % 9, kr = r + (c ? -2 : 2);
        if (kr >= 0 && kr < 9) {
          for (var e = -1; e <= 1; e += 2) { var kf = f + e; if (kf >= 0 && kf < 9 && b[kf * 9 + kr] === (3 | c << 4)) return 1; }
        }
        for (var i = 0; i < 8; i++) {
          var a = (i + 4) & 7, j = c ? FL[a] : a, nf = f + DF[i], nr = r + DR[i], k = 1;
          while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
            var p = b[nf * 9 + nr];
            if (p) {
              if ((p >> 4) === c) {
                var t = p & 15;
                if (((STEP[t] >> j & 1) && k === 1) || (SLD[t] >> j & 1)) return 1;
              }
              break;
            }
            nf += DF[i]; nr += DR[i]; k++;
          }
        }
        return 0;
      }
      function make(P, m) {
        var f = m & 127, t = (m >> 7) & 127, pr = (m >> 14) & 1, d = m >> 15, c = P.side, b = P.b, cap = b[t];
        if (f === 81) { b[t] = d | c << 4; P.h[c][d]--; }
        else {
          var p = b[f];
          b[f] = 0;
          if (pr) p += 8;
          b[t] = p;
          if ((p & 15) === 8) P.k[c] = t;
          if (cap) { var ct = cap & 15; P.h[c][ct > 8 ? ct - 8 : ct]++; }
        }
        P.side ^= 1;
        return cap;
      }
      function undo(P, m, cap) {
        var f = m & 127, t = (m >> 7) & 127, pr = (m >> 14) & 1, d = m >> 15, c = P.side ^ 1, b = P.b;
        if (f === 81) { b[t] = 0; P.h[c][d]++; }
        else {
          var p = b[t];
          if (pr) p -= 8;
          b[f] = p;
          b[t] = cap;
          if ((p & 15) === 8) P.k[c] = f;
          if (cap) { var ct = cap & 15; P.h[c][ct > 8 ? ct - 8 : ct]--; }
        }
        P.side = c;
      }
      function legal(P) {
        var ms = gen(P), o = [], c = P.side;
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i], cap = make(P, m), ok = !atk(P, P.k[c], c ^ 1);
          if (ok && (m >> 15) === 1 && atk(P, P.k[c ^ 1], c) && !legal(P).length) ok = false;
          undo(P, m, cap);
          if (ok) o.push(m);
        }
        return o;
      }
      /* ----- 評価 ----- */
      var NN = 0, LW = new Float64Array(16), FB, FW, B1, W1, B2, W2, B3, W3;
      var A0 = new Int32Array(256), A1 = new Int32Array(256), IN = new Int32Array(512), H1 = new Int32Array(32), H2 = new Int32Array(32);
      function mat(P, x) {
        var c = P.side, b = P.b;
        x.fill(0);
        for (var s = 0; s < 81; s++) { var p = b[s]; if (p) x[p & 15] += (p >> 4) === c ? 1 : -1; }
        for (var t = 1; t < 8; t++) x[t] += P.h[c][t] - P.h[c ^ 1][t];
        return x;
      }
      var XV = new Float64Array(16);
      function nnEval(P) {
        var b = P.b, W = FW, k0 = P.k[0] * 1548, k1 = (80 - P.k[1]) * 1548;
        A0.set(FB); A1.set(FB);
        function add(i0, i1) {
          var o0 = (k0 + i0) * 256, o1 = (k1 + i1) * 256;
          for (var j = 0; j < 256; j++) { A0[j] += W[o0 + j]; A1[j] += W[o1 + j]; }
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p) continue;
          var t = p & 15;
          if (t === 8) continue;
          var c = p >> 4, kk = 90 + 162 * KK[t];
          add(kk + (c ? 81 : 0) + s, kk + (c ? 0 : 81) + 80 - s);
        }
        for (var cc = 0; cc < 2; cc++) {
          for (var d = 1; d < 8; d++) {
            for (var i = 0; i < P.h[cc][d]; i++) add((cc ? HE[d] : HB[d]) + i, (cc ? HB[d] : HE[d]) + i);
          }
        }
        var st = P.side, X0 = st ? A1 : A0, X1 = st ? A0 : A1;
        for (var j = 0; j < 256; j++) {
          var v = X0[j]; IN[j] = v < 0 ? 0 : v > 127 ? 127 : v;
          v = X1[j]; IN[256 + j] = v < 0 ? 0 : v > 127 ? 127 : v;
        }
        for (var i2 = 0; i2 < 32; i2++) {
          var sm = B1[i2], o = i2 * 512;
          for (var j2 = 0; j2 < 512; j2++) { var iv = IN[j2]; if (iv) sm += W1[o + j2] * iv; }
          sm >>= 6; H1[i2] = sm < 0 ? 0 : sm > 127 ? 127 : sm;
        }
        for (var i3 = 0; i3 < 32; i3++) {
          var s3 = B2[i3];
          for (var j3 = 0; j3 < 32; j3++) s3 += W2[i3 * 32 + j3] * H1[j3];
          s3 >>= 6; H2[i3] = s3 < 0 ? 0 : s3 > 127 ? 127 : s3;
        }
        var out = B3[0];
        for (var j4 = 0; j4 < 32; j4++) out += W3[j4] * H2[j4];
        return out / 16;
      }
      function evalPos(P) {
        var x = mat(P, XV), e = 0, k;
        if (NN) e = nnEval(P);
        else for (k = 1; k < 16; k++) e += VAL[k] * x[k];
        for (k = 1; k < 16; k++) e += LW[k] * x[k];
        return Math.round(e);
      }
      /* ----- 探索 ----- */
      var nodes = 0, dl = 1e15, stopF = 0;
      function sortMv(P, ms) {
        var b = P.b, sc = ms.map(function (m) {
          var v = b[(m >> 7) & 127] ? VAL[b[(m >> 7) & 127] & 15] * 10 - VAL[b[m & 127] & 15] : 0;
          return (m >> 14 & 1) ? v + 50 : v;
        }), idx = ms.map(function (_, i) { return i; });
        idx.sort(function (x, y) { return sc[y] - sc[x]; });
        return idx.map(function (i) { return ms[i]; });
      }
      function qs(P, a, b, ply) {
        var e = evalPos(P);
        if (e >= b) return e;
        if (e > a) a = e;
        if (ply > 6) return e;
        var c = P.side, ms = sortMv(P, gen(P, 1));
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i], cp = make(P, m);
          if (atk(P, P.k[c], c ^ 1)) { undo(P, m, cp); continue; }
          var v = -qs(P, -b, -a, ply + 1);
          undo(P, m, cp);
          if (stopF) return 0;
          if (v >= b) return v;
          if (v > a) a = v;
        }
        return a;
      }
      function srch(P, d, a, b, ply) {
        if ((++nodes & 511) === 0 && Date.now() > dl) stopF = 1;
        if (stopF) return 0;
        if (d <= 0) return qs(P, a, b, ply);
        var c = P.side, ms = sortMv(P, gen(P)), best = -1e9, n = 0;
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i], cp = make(P, m);
          if (atk(P, P.k[c], c ^ 1)) { undo(P, m, cp); continue; }
          n++;
          var v = -srch(P, d - 1, -b, -a, ply + 1);
          undo(P, m, cp);
          if (stopF) return 0;
          if (v > best) { best = v; if (v > a) a = v; if (a >= b) break; }
        }
        return n ? best : -30000 + ply;
      }
      function rs(P, m, d) {
        var cp = make(P, m), v = -srch(P, d - 1, -31000, 31000, 1);
        undo(P, m, cp);
        return v;
      }
      /* ----- Worker側 ----- */
      if (typeof document === 'undefined') {
        var job = 0, loadP = Promise.resolve();
        var tick = function () { return new Promise(function (r) { setTimeout(r, 0); }); };
        var leb = function (u, o, n, out) {
          for (var i = 0; i < n; i++) {
            var r = 0, sh = 0, x;
            do { x = u[o++]; r |= (x & 127) << sh; sh += 7; } while (x & 128);
            if (sh < 32 && (x & 64)) r |= -1 << sh;
            out[i] = r;
          }
          return o;
        };
        var ldMsg = function (txt, pct) { postMessage({ t: 'ld', txt: txt, pct: pct }); };
        var parseNet = async function (buf) {
          try {
            if (buf.byteLength < 1e6) throw new Error('ファイルが小さすぎます(' + buf.byteLength + 'B / Git LFSポインタの可能性)');
            var u = new Uint8Array(buf), dv = new DataView(buf), o = 12 + dv.getUint32(8, true) + 4, n = 125388 * 256;
            var isLeb = function () { var s = ''; for (var i = 0; i < 17; i++) s += String.fromCharCode(u[o + i]); return s === 'COMPRESSED_LEB128'; };
            var fb = new Int16Array(256), fw = new Int16Array(n);
            ldMsg('ヘッダ解析', 55); await tick();
            if (isLeb()) {
              o += 17; var sz = dv.getUint32(o, true); o += 4; leb(u, o, 256, fb); o += sz;
              o += 17; sz = dv.getUint32(o, true); o += 4;
              ldMsg('重み展開(LEB128)', 65); await tick();
              leb(u, o, n, fw); o += sz;
            } else {
              fb = new Int16Array(buf.slice(o, o + 512)); o += 512;
              ldMsg('入力層の重みを読込中', 65); await tick();
              fw = new Int16Array(buf.slice(o, o + n * 2)); o += n * 2;
            }
            o += 4;
            ldMsg('隠れ層の読込', 90); await tick();
            var rd = function (cnt, w) {
              var B = new Int32Array(cnt);
              for (var i = 0; i < cnt; i++) B[i] = dv.getInt32(o + 4 * i, true);
              o += 4 * cnt;
              var Wt = new Int8Array(buf.slice(o, o + cnt * w));
              o += cnt * w;
              return [B, Wt];
            };
            var l1 = rd(32, 512), l2 = rd(32, 32), l3 = rd(1, 32);
            FB = fb; FW = fw; B1 = l1[0]; W1 = l1[1]; B2 = l2[0]; W2 = l2[1]; B3 = l3[0]; W3 = l3[1];
            NN = 1;
            var ev = evalPos(newPos());
            ldMsg('読込完了 (初期局面 ' + ev + 'cp' + (o !== buf.byteLength ? ' / サイズ差 ' + (buf.byteLength - o) : '') + ')', 100);
            postMessage({ t: 'ldDone', ok: 1 });

            NN = 0;
            ldMsg('読込失敗: ' + err.message, 0);
            postMessage({ t: 'ldDone', ok: 0 });

        };
        self.onmessage = function (e) {
          var m = e.data;
          if (m.cmd === 'net') loadP = parseNet(m.buf);
          else if (m.cmd === 'stop') { job++; postMessage({ t: 'ack' }); }
          else if (m.cmd === 'go') run(m, ++job);
          else if (m.cmd === 'train') train(m, ++job);
        };
        var run = async function (m, id) {
          postMessage({ t: 'ack' });
          await loadP;
          if (id !== job) return;
          LW = Float64Array.from(m.lw);
          var P = fromSt(m.st), ms = legal(P), t0 = Date.now(), end = m.ms ? t0 + m.ms : 1e15;
          var L = ms.map(function (x) { return { m: x, s: 0, d: 0 }; });
          if (!L.length) { postMessage({ t: 'done', id: m.id, list: [], play: m.play, pct: 100 }); return; }
          var D = Math.max(1, m.D), dn = 0, tot = L.length * D, i;
          var post = function (fin) {
            var pct = Math.min(99, dn * 100 / tot);
            if (m.ms) pct = Math.max(pct, Math.min(99, (Date.now() - t0) * 100 / m.ms));
            var w = L[L.length - 1];
            postMessage({ t: fin ? 'done' : 'p', id: m.id, play: m.play, pct: fin ? 100 : pct, worst: { m: w.m, s: w.s },
              list: L.slice(0, L.length > 1 ? L.length - 1 : 1).map(function (x) { return { m: x.m, s: x.s, d: x.d }; }) });
          };
          for (var d = 1; d <= D; d++) {
            var tmp = [], to = 0, order = L.slice();
            for (i = 0; i < order.length; i++) {
              dl = d === 1 ? 1e15 : end; stopF = 0;
              var s = rs(P, order[i].m, d);
              if (id !== job) return;

              tmp.push(s); dn++;
              if (d > 1 && i % 2 === 1) post();
              await tick();
              if (id !== job) return;
            }
            if (to) break;
            for (i = 0; i < order.length; i++) { order[i].s = tmp[i]; order[i].d = d; }
            L.sort(function (a, b) { return b.s - a.s; });
            if (d < D) post();
          }
          post(1);
        };
        var train = async function (m, id) {
          postMessage({ t: 'ack' });
          await loadP;
          var lw = Float64Array.from(m.lw), zero = new Float64Array(16), dep = m.dep || 2, lr = m.lr || 0.5, vms = m.vms || 200, lastV = 0;
          var g = 0, mw = 0, md = 0, ml = 0;
          var game = async function (wb, ww, rnd, rec, label) {
            var P = newPos(), data = [], big = 0, ev = 0;
            for (var ply = 0; ply < 140; ply++) {
              var ms = legal(P);
              if (!ms.length) return { r: P.side ? 1 : -1, data: data };
              LW = P.side ? ww : wb;
              var mv = ms[0];
              if (ply < rnd) { mv = ms[Math.random() * ms.length | 0]; big = 0; }
              else {
                var bs = -1e9; stopF = 0; dl = 1e15;
                for (var i = 0; i < ms.length; i++) { var s = rs(P, ms[i], dep); if (s > bs) { bs = s; mv = ms[i]; } }

      g('btns').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'bNew') newGame();
        else if (b.id === 'bTr') { if (trainOn) { trainOn = 0; busy = 0; W.postMessage({ cmd: 'stop' }); renderBtns(); } else startTrain(); }
        else if (b.id === 'bTrR') { LWS = new Float64Array(16); try { localStorage.removeItem('shogiLW'); } catch (e) { } if (trainOn) startTrain(); else { trStat = '学習をリセットしました'; paintTrain(); } }
        else if (b.id === 'bMenu') g('menu').hidden = !g('menu').hidden;
        else if (b.dataset.a === 'u') undoFor(+b.dataset.c);
        else if (b.dataset.a === 'r') resign(+b.dataset.c);
      };
      newGame();
    </script>
  </body>

</html>
