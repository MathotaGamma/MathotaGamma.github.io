      function paintEd() {
        g('ed').innerHTML =
          '<button data-x="s">' +
          (P.side ? '後手番' : '先手番') +
          '</button><button data-x="i">初期配置</button>' +
          '<button data-x="z">全て持駒へ</button><button data-x="x">取消</button><button data-x="k">完了</button>';
      }

      function edClick(e) {
        var b = e.target.closest('button'),
          x,
          sd,
          i,
          p,
          bb;
        if (!b) return;
        sel = null;
        x = b.dataset.x;
        if (x === 's') P.side ^= 1;
        else if (x === 'i') {
          sd = P.side;
          P = newPos();
          P.side = sd;
        } else if (x === 'z') {
          for (i = 0; i < 81; i++) {
            p = P.b[i];
            bb = baseOf(p & 15);
            if (p && bb) {
              addHand(0, bb);
              P.b[i] = 0;
            }
          }
          for (i = 1; i < 8; i++) {
            P.h[0][i] = Math.min(18, P.h[0][i] + P.h[1][i]);
            P.h[1][i] = 0;
          }
        } else if (x === 'x') {
          cancelEdit();
          return;
        } else if (x === 'k') {
          finishEdit();
          return;
        }
        paintEd();
        render();
      }
      /* 成駒→元の駒(持駒にできる種類)。玉は 0 */
      function baseOf(t) {
        return t === 8 ? 0 : t > 8 ? (t === 14 ? 6 : t === 15 ? 7 : t - 8) : t;
      }

      function addHand(c, t) {
        if (t) P.h[c][t] = Math.min(18, P.h[c][t] + 1);
      }

      function editClick(s) {
        var p = P.b[s],
          q,
          c,
          t,
          b,
          pr,
          seq,
          cur,
          nx;
        if (sel && sel.f !== s && p && (p & 15) === 8) {
          g('msg').textContent = '玉の上には置けません';
          return;
        }
        if (sel && sel.f === 81) {
          /* 持駒 → 盤 */
          c = sel.c;
          t = sel.d;
          if (p) addHand(c, baseOf(p & 15));
          P.h[c][t]--;
          P.b[s] = t | (c << 4);
          sel = null;
        } else if (sel) {
          if (sel.f === s) {
            /* 種類切替: 自歩→自と→相歩→相と */
            c = p >> 4;
            t = p & 15;
            b = baseOf(t) || 8;
            pr = b === 8 || b === 5 ? 0 : b === 6 ? 14 : b === 7 ? 15 : b + 8;
            seq = [
              [0, b],
              [0, pr],
              [1, b],
              [1, pr]
            ].filter(function (x) {
              return x[1];
            });
            cur = 0;
            seq.forEach(function (x, i) {
              if (x[0] === c && x[1] === t) cur = i;
            });
            nx = seq[(cur + 1) % seq.length];
            P.b[s] = nx[1] | (nx[0] << 4);
            sel = null;
          } else {
            /* 盤 → 盤(先にある駒は、動かした駒の持ち主の持駒へ) */
            q = P.b[sel.f];
            if (p) addHand(q >> 4, baseOf(p & 15));
            P.b[s] = q;
            P.b[sel.f] = 0;
            sel = null;
          }
        } else if (p) sel = { f: s, tg: {} };
        render();
      }

      function editHand(c, t) {
        var p, b;
        if (sel && sel.f < 81) {
          /* 盤の駒 → その側の持駒 */
          p = P.b[sel.f];
          b = baseOf(p & 15);
          if (!b) {
            g('msg').textContent = '玉は持駒にできません';
            sel = null;
            render();
            return;
          }
          addHand(c, b);
          P.b[sel.f] = 0;
          sel = null;
        } else if (sel && sel.f === 81) {
          if (t && c === sel.c) {
            if (t === sel.d) {
              P.h[c][t]--;
              sel = null;
            } else sel = { f: 81, d: t, c: c, tg: {} };
          } else {
            if (c !== sel.c) {
              P.h[sel.c][sel.d]--;
              addHand(c, sel.d);
            }
            sel = null;
          }
        } else if (t) sel = { f: 81, d: t, c: c, tg: {} };
        render();
      }

      function cancelEdit() {
        P = edBackup;
        editing = 0;
        sel = null;
        g('ed').hidden = true;
        g('info').hidden = false;
        g('msg').textContent = '';
        if (over || paused) render();
        else next();
      }

      function finishEdit() {
        var kc = [0, 0];
        for (var i = 0; i < 81; i++) {
          var p = P.b[i];
          if (p && (p & 15) === 8) {
            kc[p >> 4]++;
            P.k[p >> 4] = i;
          }
        }
        if (kc[0] !== 1 || kc[1] !== 1) {
          g('msg').textContent = '玉は先手・後手1枚ずつ必要です';
          return;
        }
        if (atk(P, P.k[P.side ^ 1], P.side)) {
          g('msg').textContent = '手番でない側の玉に王手がかかっています';
          return;
        }
        var sp = P;
        newGame(sp);
      }

      /* ===== YaneuraOu (WASM) ===== */
      var YO = {
        state: 'none',
        mod: null,
        ready: false,
        running: false,
        pending: false,
        req: null,
        cur: null,
        send: function () {}
      };

      function m2u(m) {
        var f = m & 127,
          t = (m >> 7) & 127,
          sq = function (x) {
            return ((x / 9) | 0) + 1 + 'abcdefghi'[x % 9];
          };
        return (f === 81 ? 'PLNSGBR'[(m >> 15) - 1] + '*' : sq(f)) + sq(t) + ((m >> 14) & 1 ? '+' : '');
      }

      function u2m(u) {
        var sq = function (i) {
          return (u.charCodeAt(i) - 49) * 9 + (u.charCodeAt(i + 1) - 97);
        };
        if (u[1] === '*') return 81 | (sq(2) << 7) | (('PLNSGBR'.indexOf(u[0]) + 1) << 15);
        return sq(0) | (sq(2) << 7) | (u.length > 4 ? 16384 : 0);
      }

      async function yoFetch(key, name, asText, label) {
        try {
          var c = await to(idbGet(key), 2500);
          if (c) return c;
        } catch (e) {}
        var err = '',
          urls = ENGINE_DIRS.map(function (d) {
            return d + name;
          });
        for (var k = 0; k < urls.length; k++) {
          try {
            var r = await fetch(urls[k]);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var tot = +r.headers.get('content-length') || (asText ? 0 : SIZE_WASM),
              ch = [],
              n = 0,
              rd = r.body.getReader();
            for (;;) {
              var x = await rd.read();
              if (x.done) break;
              ch.push(x.value);
              n += x.value.length;
              if (!asText) setNN(label + ' ' + (n / 1048576).toFixed(0) + 'MB', Math.min(95, (n * 95) / tot), 1);
            }
            var u8 = new Uint8Array(n),
              o = 0;
            ch.forEach(function (q) {
              u8.set(q, o);
              o += q.length;
            });
            var val = asText ? new TextDecoder().decode(u8) : u8.buffer;
            if (!asText && n < 1e6) throw new Error('サイズ不正');
            idbPut(key, val).catch(function () {});
            return val;
          } catch (e) {
            err += e.message + ' ';
          }
        }
        throw new Error(name + ' 取得失敗: ' + err);
      }

      async function yoInit() {
        if (!self.crossOriginIsolated) {
          YO.state = 'fail';
          YO.why =
            'このページが cross-origin isolated ではない(coi-serviceworker.js が読めていない/初回アクセス直後は再読込が必要/ファイルとして開いている)';
          g('nnB').title = 'WASM不可';
          ensureJsNet();
          return;
        }
        YO.state = 'init';
        try {
          var glue = await yoFetch('yoJs', ENGINE_FILES.js, 1),
            wk = await yoFetch('yoWk', ENGINE_FILES.worker, 1);
          var wasm = await yoFetch('yoWasm', ENGINE_FILES.wasm, 0, 'やねうら王WASM取得中');
          setNN('やねうら王を起動中…', 97, 1);
          var jsUrl = URL.createObjectURL(new Blob([glue], { type: 'text/javascript' })),
            wkUrl = URL.createObjectURL(new Blob([wk], { type: 'text/javascript' }));
          await new Promise(function (res, rej) {
            var sc = document.createElement('script');
            sc.src = jsUrl;
            sc.onload = res;
            sc.onerror = function () {
              rej(new Error('エンジンJS読込失敗'));
            };
            document.head.appendChild(sc);
          });
          var mod = await YaneuraOu_HalfKP({
            wasmBinary: wasm,
            locateFile: function (n) {
              return /worker/.test(n) ? wkUrl : n;
            },
            mainScriptUrlOrBlob: jsUrl
          });
          YO.mod = mod;
          YO.send = function (c) {
            mod.postMessage(c);
          };
          mod.addMessageListener(yoLine);
          var T = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
          YO.send('usi');
          YO.send('setoption name Threads value ' + T);
          YO.send('setoption name USI_Hash value 128');
          YO.send('setoption name NetworkDelay value 0');
          YO.send('setoption name NetworkDelay2 value 0');
          YO.state = 'ok';
          if (busy) {
            W.postMessage({ cmd: 'stop' });
            busy = 0;
          }
          if (netBuf) yoApplyNet();
          else YO.send('isready');
        } catch (e) {
          YO.state = 'fail';
          YO.why = String(e.message);
          g('ov').hidden = true;
          g('nnB').textContent = 'WASM失敗:' + String(e.message).slice(0, 20);
          ensureJsNet();
        }
      }

      function yoApplyNet() {
        YO.ready = false;
        yoStop();
        YO.mod.FS.writeFile('/hao.bin', new Uint8Array(netBuf));
        YO.send('setoption name EvalDir value .');
        YO.send('setoption name EvalFile value hao.bin');
        YO.send('setoption name FV_SCALE value 20');
        YO.send('isready');
      }

      function yoStop() {
        YO.pending = false;
        if (YO.running) YO.send('stop');
      }

      function yoThink(play) {
        var vsU = !play && mode === 'vs',
          gd = play ? stratGuide() : null;
        var n = play
          ? g('showA').checked || +g('rnd').value
            ? 5
            : 1
          : vsU
            ? g('showU').checked
              ? 5
              : 1
            : Math.max(1, Math.min(legal(P).length, 300));
        if (gd && gd.cands.length) n = Math.min(legal(P).length, 40);
        if (play) setStratLine(gd);
        YO.req = {
          id: ++gid,
          play: play,
          t0: Date.now(),
          ms: play || vsU ? num('ai') * 1000 : 0,
          dcap: play ? lvOf().d : 0,
          mpv: n,
          mv: {},
          dt: {},
          depth: 0,
          cdepth: 0,
          pm: 0,
          ui: 0,
          guide: gd
        };
        YO.pending = true;
        g('bar').firstChild.style.width = '0%';
        g('cand').innerHTML =
          (lastInfo ? '<div>直前: ' + lastInfo + '</div>' : '') + '<div>思考中…(やねうら王)</div>';
        yoKick();
      }

      function yoKick() {
        if (!YO.pending || !YO.ready) return;
        if (YO.running) {
          YO.stopAt = Date.now();
          YO.stopN = 0;
          YO.send('stop');
          return;
        }
        YO.pending = false;
        YO.running = true;
        YO.stopAt = 0;
        var r = (YO.cur = YO.req),
          D = Math.max(1, num('D'));
        r.t0 = Date.now();
        YO.send('setoption name MultiPV value ' + r.mpv);
        YO.send(
          'position ' +
            (startSfen ? 'sfen ' + startSfen : 'startpos') +
            (hist.length
              ? ' moves ' +
                hist
                  .map(function (h) {
                    return m2u(h.m);
                  })
                  .join(' ')
              : '')
        );
        YO.send(
          r.ms
            ? 'go movetime ' + r.ms + (r.dcap ? ' depth ' + r.dcap : '')
            : 'go depth ' + (r.dcap ? Math.min(D, r.dcap) : D)
        );
        clearTimeout(YO.gt);
        if (r.play)
          YO.gt = setTimeout(
            function () {
              if (YO.cur !== r || !YO.running) return;
              YO.send('stop');
              YO.gt = setTimeout(function () {
                if (YO.cur === r && YO.running) yoFail();
              }, 5000);
            },
            (r.ms || 120000) + 5000
          );
      }
      /* 進捗: 深さごとの所要時間は約 1.5〜2.5 倍ずつ増えるので、実測の増加率から終了までの時間を見積もる */
      /* 進捗: 各深さの最初の行が出た時刻から反復1回分の所要時間を測り、増加率で「深さDの反復が終わる時刻」を見積もる */
      function yoProg(r, D) {
        var el = Date.now() - r.t0,
          p;
        if (r.ms) return Math.min(99, (el * 100) / r.ms);
        var ds = Object.keys(r.dt)
            .map(Number)
            .sort(function (x, y) {
              return x - y;
            }),
          n = ds.length;
        if (n < 4) p = Math.min(8, (r.depth * 100) / D / 3);
        else {
          var du = [],
            q;
          for (q = n - 4; q < n - 1; q++) du.push(Math.max(1, r.dt[ds[q + 1]] - r.dt[ds[q]]));
          var ratio = Math.max(1.9, Math.min(3, (du[1] / du[0] + du[2] / du[1]) / 2)),
            est = r.dt[ds[n - 1]],
            d = du[2];
          for (var j = ds[n - 1] + 1; j <= D + 1; j++) {
            d *= ratio;
            est += d;
          }
          if (el > est) est = el * 1.25;
          p = Math.min(95, (el * 100) / est);
        }
        r.pm = Math.max(r.pm, p);
        return r.pm;
      }

      function yoPaint(r, done) {
        var arr = Object.keys(r.mv).map(function (k) {
          return r.mv[k];
        });
        arr.sort(function (a, b) {
          return (b.d === r.depth) - (a.d === r.depth) || a.k - b.k;
        });
        var D = Math.max(1, num('D')),
          el = ((Date.now() - r.t0) / 1000).toFixed(1);
        r.shown = {
          t: 'p',
          id: r.id,
          play: r.play,
          ev: r.ev,
          pct: done ? 100 : yoProg(r, D),
          worst: r.mpv > 5 && arr.length > 1 ? arr[arr.length - 1] : null,
          list: arr,
          info:
            ' 深度' + (r.ms ? Math.min(r.depth, 99) : r.depth + '/' + D) + ' ' + el + '秒' + (done ? ' 完了' : '')
        };
        showList(r.shown);
      }

      function yoLine(l) {
        if (l === 'readyok') {
          YO.ready = true;
          nnOk = 1;
          setNN(netBuf ? 'やねうら王 + ' + netName : 'やねうら王(内蔵:水匠5)', 100, 0);
          if (YO.pending) yoKick();
          return;
        }
        if (l.indexOf('bestmove') === 0) return yoBest(l);
        if (l.indexOf('info ') !== 0 || l.indexOf('info string') === 0) return;
        var r = YO.cur;
        if (!r || r.id !== gid) return;
        if (l.indexOf(' lowerbound') > 0 || l.indexOf(' upperbound') > 0) return;
        var mp = /multipv (\d+)/.exec(l),
          sc = /score (cp|mate) (-?\d+)/.exec(l),
          pv = / pv (\S+)/.exec(l),
          dp = /depth (\d+)/.exec(l);
        if (!sc || !pv || !dp) return;
        var v = +sc[2],
          s = sc[1] === 'cp' ? v : v > 0 ? 30000 - v : -30000 - v;
        var mv = u2m(pv[1]);
        if (legal(P).indexOf(mv) < 0) return;
        r.mv[mv] = { m: mv, s: s, d: +dp[1], k: mp ? +mp[1] : 1 };
        if (!mp || +mp[1] === 1) r.ev = s;
        r.depth = Math.max(r.depth, +dp[1]);
        /* 詰みが見つかったら、時間いっぱい深度だけ増やし続けないよう打ち切る(時間指定の探索のみ) */
        if (
          r.ms &&
          !r.scan &&
          !r.stopped &&
          (!mp || +mp[1] === 1) &&
          Math.abs(s) > 29000 &&
          +dp[1] >= 6 &&
          YO.cur === r &&
          YO.running
        ) {
          r.stopped = 1;
          YO.send('stop');
        }
        if (!r.dt[+dp[1]]) r.dt[+dp[1]] = Date.now() - r.t0;
        if (r.scan) return;
        if (Date.now() - r.ui > 150) {
          r.ui = Date.now();
          yoPaint(r, 0);
        }
      }

      function yoFail() {
        YO.state = 'fail';
        YO.why = 'やねうら王が応答しなくなった';
        YO.running = false;
        YO.cur = null;
        YO.pending = false;
        g('nnB').textContent = 'WASM応答なし→自作エンジン';
        ensureJsNet();
        if (!over && !paused && !editing) next();
      }
      /* 最善手との評価差が許容内の候補から、評価差で重み付けしてランダムに選ぶ */
      var MAXDROP = 150;
      var LVS = [
        null,
        { d: 1, k: 3 },
        { d: 2, k: 2.5 },
        { d: 3, k: 2 },
        { d: 4, k: 1.6 },
        { d: 6, k: 1.3 },
        { d: 8, k: 1.1 },
        { d: 10, k: 1 },
        { d: 12, k: 1 },
        { d: 16, k: 1 },
        { d: 20, k: 1 },
        { d: 0, k: 1 }
      ];

      function lvOf() {
        return LVS[+g('lv').value] || LVS[11];
      }

      function pickVar(arr, bm) {
        var T = +g('rnd').value,
          best = null,
          i,
          j;
        if (!T || arr.length < 2) return bm;
        T *= (4 / (1 + Math.exp((hist.length - 15) / 5))) * lvOf().k;
        T = Math.min(T, MAXDROP);
        if (T < 1) return bm;
        for (i = 0; i < arr.length; i++) if (arr[i].m === bm) best = arr[i];
        if (!best || Math.abs(best.s) > 29000) return bm;
        var c = arr.filter(function (x) {
          return x.d >= best.d - 2 && Math.abs(x.s) < 29000 && x.s >= best.s - T && (best.s <= MAXDROP || x.s > 0);
        });
        if (c.length < 2) return bm;
        var w = c.map(function (x) {
            return Math.exp(-(best.s - x.s) / (T / 2));
          }),
          tot = 0,
          rv;
        for (j = 0; j < w.length; j++) tot += w[j];
        rv = Math.random() * tot;
        for (j = 0; j < c.length; j++) {
          rv -= w[j];
          if (rv <= 0) return c[j].m;
        }
        return bm;
      }
      /* 全手を短時間だけ評価し直す(最悪手と、上位5手の外の手の順位・最善比を出すため) */
      function yoScanStart(r, fin) {
        var n = legal(P).length;
        if (mode === 'train' || n < 6 || n <= r.mpv) {
          if (fin) fin();
          return;
        }
        YO.req = {
          id: gid,
          scan: 1,
          parent: r,
          fin: fin,
          play: false,
          ms: r.play ? 700 : 1500,
          dcap: 0,
          mpv: Math.min(n, 300),
          mv: {},
          dt: {},
          depth: 0,
          cdepth: 0,
          pm: 0,
          ui: 0
        };
        YO.pending = true;
        yoKick();
      }

      function yoScanDone(r) {
        var arr = Object.keys(r.mv).map(function (k) {
          return r.mv[k];
        });
        arr.sort(function (a, b) {
          return (b.d === r.depth) - (a.d === r.depth) || a.k - b.k;
        });
        if (arr.length > 1) {
          var sm = Object.assign(
            { t: 'p', id: gid, play: r.parent.play, list: [], ev: r.parent.ev, info: '' },
            r.parent.shown || {}
          );
          sm.worst = arr[arr.length - 1];
          sm.pct = 100;
          showList(sm);
          if (curAn) curAn.all = arr;
        }
        if (r.fin) r.fin();
      }

      function yoBest(l) {
        clearTimeout(YO.gt);
        var r = YO.cur;
        YO.running = false;
        YO.cur = null;
        if (YO.pending) {
          yoKick();
          return;
        }
        if (!r || r.id !== gid || over) return;
        if (r.scan) {
          yoScanDone(r);
          return;
        }
        yoPaint(r, 1);
        if (!r.play) {
          yoScanStart(r, null);
          return;
        }
        var u = l.split(/\s+/)[1];
        if (u === 'resign') {
          finish(sideN(P.side) + '投了', P.side ^ 1, '投了');
          return;
        }
        if (u === 'win') {
          finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
          return;
        }
        var m = u2m(u),
          ls = legal(P);
        if (ls.indexOf(m) < 0) m = ls[0];
        var gm = r.guide ? guideChoose(r, m) : 0;
        m =
          gm ||
          pickVar(
            Object.keys(r.mv).map(function (k) {
              return r.mv[k];
            }),
            m
          );
        if (ls.indexOf(m) < 0) m = ls[0];
        var fin = function () {
          doMove(m);
        };
        if (g('showA').checked) yoScanStart(r, fin);
        else fin();
      }

      /* ===== 定跡ブック(Floodgateの高レート棋譜から作成し、VS AIで使う) ===== */
      var BKS = { w: null, tab: 'make', busy: 0, cancel: 0, opt: null, src: '' },
        BKA = null,
        bkNote = '',
        bkKey = -1,
        bkVal = '';
      var BK_YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011];
      var BK_REPO = 'https://github.com/shogi-server/shogi-server/releases/',
        BK_MIRROR = 'https://mathotagamma.github.io/wdoor-getter/wdoor{year}.7z';

      function bkLS(k, d) {
        try {
          var v = localStorage.getItem(k);
          return v === null ? d : v;
        } catch (e) {
          return d;
        }
      }

      function bkSetLS(k, v) {
        try {
          localStorage.setItem(k, v);
        } catch (e) {}
      }

      function bkMeta() {
        try {
          return JSON.parse(bkLS('shogiBkMeta', '[]')) || [];
        } catch (e) {
          return [];
        }
      }

      function bkEsc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function bkUse() {
        return !!BKA && bkLS('shogiBkUse', '1') === '1';
      }

      function bkMax() {
        return +bkLS('shogiBkMax', '999') || 999;
      }

      /* AIの手番で定跡を使う(1)か、無視してエンジンで考える(0)か */
      function bkSetUse(on) {
        bkSetLS('shogiBkUse', on ? '1' : '0');
        bkKey = -1;
        bkcKey = '';
        var a = g('bkUse'),
          b = g('bkUseM');
        if (a) a.checked = !!on;
        if (b) b.checked = !!on;
        bkcPaint();
      }

      async function idbDel(k) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var t = d.transaction('f', 'readwrite');
          t.objectStore('f').delete(k);
          t.oncomplete = res;
          t.onerror = function () {
            rej(t.error);
          };
        });
      }

      async function bkLoad(id) {
        BKA = null;
        bkKey = -1;
        if (!id) return;
        try {
          var d = await idbGet('bk:' + id);
          if (d && d.keys) {
            BKA = d;
            BKA.id = id;
          }
        } catch (e) {}
        BKX.Q = null;
        bkcPaint();
      }

      /* 現在の局面の定跡手(出現数の多い順、合法手のみ) */
      function bkMoves(Q) {
        Q = Q || P;
        if (!BKA) return [];
        var h = hashP(Q),
          K = BKA.keys,
          lo = 0,
          hi = K.length - 1,
          ix = -1;
        while (lo <= hi) {
          var mid = (lo + hi) >> 1;
          if (K[mid] === h) {
            ix = mid;
            break;
          }
          if (K[mid] < h) lo = mid + 1;
          else hi = mid - 1;
        }
        if (ix < 0) return [];
        var ls = legal(Q),
          out = [];
        for (var i = BKA.off[ix]; i < BKA.off[ix + 1]; i++)
          if (ls.indexOf(BKA.mv[i]) >= 0) out.push({ m: BKA.mv[i], c: BKA.cnt[i], w: BKA.win[i] });
        return out;
      }

      function bkText(ls) {
        return ls
          .map(function (x) {
            return (P.side ? '△' : '▲') + mvT(x.m) + ' ' + x.c + '局(勝率' + Math.round((x.w * 100) / x.c) + '%)';
          })
          .join(' / ');
      }

      /* 評価値リストの右の定跡コンテナ(採用数順が標準。勝率順に切り替え可) */
      var bkSort = 'c',
        bkcKey = '',
        bkOff = -1;

      function bkcPaint() {
        var el = g('bkc');
        if (!BKA) {
          el.hidden = true;
          return;
        }
        el.hidden = false;
        var on = bkLS('shogiBkUse', '1') === '1',
          key = hashP(P) + '|' + bkSort + '|' + hist.length + '|' + BKA.id + '|' + on;
        if (key === bkcKey) return;
        bkcKey = key;
        var ls = bkMoves().slice(),
          tot = 0,
          last = hist.length ? hist[hist.length - 1] : null;
        ls.forEach(function (x) {
          tot += x.c;
        });
        ls.sort(function (a, b) {
          return bkSort === 'w' ? b.w / b.c - a.w / a.c || b.c - a.c : b.c - a.c || b.w - a.w;
        });
        if (!hist.length) bkOff = -1;
        else if (ls.length) {
          if (bkOff > hist.length) bkOff = -1;
        } else if (bkOff < 0 || bkOff > hist.length) bkOff = hist.length;
        var h =
          '<div style="color:#9cf">定跡「' + bkEsc(BKA.name || '') + '」 <button data-s="c"' + (bkSort === 'c' ? ' class="on"' : '') + '>採用数順</button><button data-s="w"' + (bkSort === 'w' ? ' class="on"' : '') + '>勝率順</button></div>' +
          '<div><button data-s="u"' + (on ? ' class="on"' : '') + '>AIは定跡を' + (on ? '使う' : '無視') + '(押して切替)</button></div>';
        if (mode === 'vs' && P.side !== human)
          h += on
            ? ls.length
              ? '<div style="color:#8f8">→ AIはこの中から選んで、定跡で指します</div>'
              : '<div style="color:#fa8">→ この局面は定跡にないので、AIはエンジンで考えます</div>'
            : '<div style="color:#fa8">→ 設定が「無視」なので、AIはエンジンで考えます</div>';
        if (bkOff >= 0) h += '<div style="color:#fa8">定跡の外に出たのは ' + bkOff + '手指した局面からです</div>';
        if (last && last.inf && last.inf.indexOf('定跡') === 0) h += '<div style="color:#8f8">直前の手は定跡(' + bkEsc(last.inf.replace(/^定跡 ?/, '')) + ')</div>';
        if (!ls.length) h += '<div style="color:#aaa">この局面は定跡にありません</div>';
        else {
          h += '<div style="color:#aaa">' + ls.length + '通り / 合計' + tot + '局</div>';
          ls.forEach(function (x) {
            h += '<div>' + (P.side ? '△' : '▲') + mvT(x.m) + ' <b>' + x.c + '</b>局 ' + Math.round((x.w * 100) / x.c) + '%</div>';
          });
        }
        el.innerHTML = h;
      }

      /* AIの手番で定跡の手があれば、それを指す(指したら true) */
      function bkTry() {
        if (!bkUse() || mode !== 'vs' || P.side === human || hist.length >= bkMax()) return false;
        var ls = bkMoves();
        if (!ls.length) return false;
        var ws = ls.map(function (x) {
            return 0.6 * x.c + 0.8 * x.w;
          }),
          tot = 0,
          i;
        for (i = 0; i < ws.length; i++) tot += ws[i];
        var rv = Math.random() * tot,
          pk = ls[0];
        for (i = 0; i < ls.length; i++) {
          rv -= ws[i];
          if (rv <= 0) {
            pk = ls[i];
            break;
          }
        }
        var id = ++gid;
        yoStop();
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        g('bar').firstChild.style.width = '100%';
        g('cand').innerHTML =
          (lastInfo ? '<div>直前: ' + lastInfo + '</div>' : '') +
          '<div style="color:#8f8">定跡で指します(「' + bkEsc(BKA.name || '') + '」)</div><div>' + bkText(ls.slice(0, 5)) + '</div>';
        g('msg').textContent = '定跡で指します';
        setTimeout(
          function () {
            if (gid !== id || over || paused || editing || P.side === human) return;
            if (legal(P).indexOf(pk.m) < 0) return;
            bkNote = '定跡 ' + pk.c + '局 勝率' + Math.round((pk.w * 100) / pk.c) + '%';
            doMove(pk.m);
          },
          350 + Math.random() * 450
        );
        return true;
      }

      /* --- 画面 --- */
      function bkHelp() {
        var st = 'font-size:12px;color:#ccc;line-height:1.55;margin:4px 0;border:1px solid #444;border-radius:6px;padding:4px 8px',
          c = 'color:#fc6';
        return (
          '<details open style="' + st + '"><summary>はじめに(全体の流れ)</summary>' +
          '<div>Floodgate(wdoor)の過去の棋譜から、探したい戦法や囲いが出てくる対局だけを集めて、定跡ファイルを作ります。1つの定跡ファイルに、たくさんの局面と、その局面での指し手(出現数・勝率つき)が入ります。局面で管理するので、手順が前後して同じ局面になる場合は1つにまとまります。</div>' +
          '<ol style="margin:4px 0;padding-left:20px"><li>下の「検索条件」で、探したい戦法か囲いを入力する(「指定なし」ならレートの高い対局すべて)。</li><li>年を選んで「ダウンロードして作成」。取得できないときは、端末に保存した .7z を「ファイルを選んで作成(.7z)」で選ぶ。</li><li>完成すると、その定跡が自動で選ばれ、VS AIでAIの手番に使われます。</li><li>対局画面の右側(評価値リストの右)に、今の局面の次の手が採用数順で出ます。「枝の探索」タブでは、定跡の木を盤面つきで1手ずつたどれます。</li></ol></details>' +
          '<details style="' + st + '"><summary>盤の座標(筋と段)の見方</summary>' +
          '<div>マスは「筋(1〜9)+段(a〜i)」で書きます。筋は盤の上に出ている数字で、右端が1、左端が9。段は上から a(一段)・b(二段)…i(九段)で、数字の1〜9や漢数字で書いてもかまいません(c=3=三)。</div>' +
          '<div>先手の初期位置: 玉 5i、金 4i と 6i、銀 3i と 7i、桂 2i と 8i、香 1i と 9i、飛 2h、角 8h、歩 1g〜9g。後手は上下左右を逆にした位置(玉 5a、飛 8b、角 2b、歩 1c〜9c)。</div></details>' +
          '<details style="' + st + '"><summary>戦法: 両者の手を順に入れる(相手の手も含める)</summary>' +
          '<div>先手の1手目、後手の1手目、先手の2手目…と、<b>先手と後手の手を交互に全部</b>、スペース区切りで入れます。</div>' +
          '<div>1手の書き方(USI形式): <span style="' + c + '">移動元のマス+移動先のマス</span>。7g7f は「7七の駒を7六へ」。成るときは最後に + を付けます(例 8h2b+)。駒を打つときは「駒の大文字+*+マス」(例 P*5e は5五に歩を打つ)。駒は P=歩 L=香 N=桂 S=銀 G=金 B=角 R=飛。CSA形式(7776FU のような書き方)も使えます。</div>' +
          '<div>例(どれも先手の出だし):<br>・四間飛車: <span style="' + c + '">7g7f 3c3d 6g6f 8c8d 2h6h</span><br>・三間飛車: <span style="' + c + '">7g7f 3c3d 2h7h</span><br>・中飛車: <span style="' + c + '">7g7f 3c3d 5g5f 8c8d 2h5h</span></div>' +
          '<div>動き: 標準では、1手目から入力と同じ手順で指した棋譜だけを拾います(定跡の最初の手も、入力した手になります)。「合流も含める」にチェックすると、手順が前後して同じ局面になる棋譜も拾います(その場合、最初の手は入力と違ってもよくなります)。手順を指し終えた後も、序盤の手数まで定跡に入ります。入力した手がその順で指せない手のときは、何手目かを表示してやり直しになります。</div></details>' +
          '<details style="' + st + '"><summary>戦法: 自分の手だけ入れる(相手の手は問わない)</summary>' +
          '<div><b>自分の指し手だけ</b>を、指す順に入れます。相手が何を指していてもかまいません。「自分は先手/後手」を選びます。書き方は上と同じ(USI形式)。</div>' +
          '<div>例(先手の四間飛車): <span style="' + c + '">7g7f 6g6f 2h6h</span></div>' +
          '<div>動き: 標準では、<b>自分の1手目が1つ目の手、2手目が2つ目の手、…</b>と連続して一致した棋譜だけを拾います(相手の手は何でもよい)。例えば「7i6h 8h7i」なら、先手が初手に7i6h、2手目に8h7iを指した棋譜です。そのため、定跡の最初の手も7i6hになります。「間に別の自分の手が挟まってもよい」にチェックすると、順番だけ守られていれば一致にします(その場合、最初の手は入力と違ってもよくなります)。</div></details>' +
          '<details style="' + st + '"><summary>囲い: 駒とマスを入れる</summary>' +
          '<div>「駒+マス」を、スペース区切りで並べます。<b>先手から見た位置</b>で書きます(後手の囲いを探すときは「後手」を選ぶと、180度回して判定します)。</div>' +

          '<div>マス: P7f でも P76 でも 歩76 でも同じ意味です(7筋6段)。</div>' +
          '<div>例:<br>・美濃囲い: <span style="' + c + '">K2h S3h G4i G5h</span><br>・矢倉: <span style="' + c + '">K8h S7g G7h G6g</span><br>・2三にと金がいる形: <span style="' + c + '">と2c</span></div>' +
          '<div>動き: 書いた駒が、すべて指定のマスに揃った局面が一度でもある棋譜を拾います(他の駒は何でもよい)。「序盤の手数」までに揃った棋譜が対象で、揃った後も序盤の手数まで定跡に入ります。</div></details>' +
          '<details style="' + st + '"><summary>そのほかの欄の意味</summary>' +
          '<div>・最低レート: 対局した2人とも、この値以上の対局だけ使う。大きいほど強い者同士の棋譜になるが、数は減ります。<br>・序盤の手数: 各対局の先頭から何手目まで定跡に入れるか。<br>・使う棋譜の最小手数: これより短い対局(早い投了・時間切れなど)は使わない。<br>・最小出現数: この回数未満しか出ない手は捨てる。1だと全部残るので、戦法・囲いを指定したときは1がおすすめ。「指定なし」は容量を抑えるため2。<br>・対局者名: 部分一致で、空白区切りならどれか。空欄なら絞らない(例: suisho dlshogi)。<br>・追加先: 既存の定跡に今回の.7zの内容を足す。同じ.7zを足したことがあると確認が出ます。</div></details>'
        );
      }

      function buildBook() {

      /* --- 枝の探索(使っている定跡の木をたどる) --- */

      /* --- 検索条件の解釈 --- */
      function bkTokRaw(tk) {
        var u = tk.replace(/^[▲△+\-]/, ''),
          x = /^([1-9])([1-9])([1-9])([1-9])([A-Z]{2})?$/.exec(u);
        if (x) {
          var pr = x[5] && 'TO NY NK NG UM RY'.indexOf(x[5]) >= 0 ? '+' : '';
          u = x[1] + 'abcdefghi'.charAt(x[2] - 1) + x[3] + 'abcdefghi'.charAt(x[4] - 1) + pr;
        } else if (/^[plnsgbr]\*[1-9][a-i]$/i.test(u)) u = u.charAt(0).toUpperCase() + u.slice(1);
        if (/^[1-9][a-i][1-9][a-i]\+?$/.test(u) || /^[PLNSGBR]\*[1-9][a-i]$/.test(u)) return u2m(u);
        return -1;
      }

      function bkTokMove(tk, Q) {
        var m = bkTokRaw(tk);
        return m >= 0 && legal(Q).indexOf(m) >= 0 ? m : -1;
      }

      /* 自分の手だけ(相手の手は問わない) */
      function bkParseOwn(str) {
        var ts = str.trim().split(/[\s,、]+/).filter(Boolean);
        if (!ts.length) throw new Error('自分の指し手が入力されていません');
        return ts.map(function (tk, i) {
          var m = bkTokRaw(tk);
          if (m < 0) throw new Error((i + 1) + '個目「' + tk + '」は解釈できません(例: 7g7f 6g6f / 8h2b+ / P*5e)');
          return m;
        });
      }

      function bkParseMoves(str) {
        var Q = newPos(),
          seq = [],
          ts = str.trim().split(/[\s,、]+/).filter(Boolean);
        if (!ts.length) throw new Error('指し手が入力されていません');
        ts.forEach(function (tk, i) {
          var m = bkTokMove(tk, Q);
          if (m < 0) throw new Error((i + 1) + '手目「' + tk + '」は解釈できないか、その局面で指せない手です');
          make(Q, m);
          seq.push(m);
        });
        return { hash: hashP(Q), n: ts.length, seq: seq };
      }

      function bkParseForm(str) {
        var gs = [];
        str
          .trim()
          .split(/[\s,、]+/)
          .filter(Boolean)
          .forEach(function (tk) {
            var o = parseGoalTok(tk);
            if (!o) throw new Error('「' + tk + '」は解釈できません(例: k2h s3h 歩76 成香1d)');
            gs.push(o);
          });
        if (!gs.length) throw new Error('囲いの駒とマスが入力されていません');
        return gs;
      }

        us.push('https://wdoor.c.u-tokyo.ac.jp/shogi/x/' + nm);
        return us;
      }

              : '失敗: ' + (e && e.message ? e.message : e)
          ) +
          '</span>' +
          (cors
            ? '<div style="margin-top:6px">対処1: 取得元URLに、自分のGitHub Pagesなど(CORSを許可しているサイト)に置いた wdoorYYYY.7z のURLを指定する(例 https://mathotagamma.github.io/wdoor-getter/wdoor{year}.7z。そのサイトに無い年は取得できません)。<br>対処2: リリースページから wdoorYYYY.7z を端末に保存し、「ファイルを選んで作成(.7z)」で選ぶ(通信は不要)。<br><a style="color:#9cf" target="_blank" rel="noopener" href="' +

      async function bkDownload(urls, label) {
        var px = g('bkProxy').value.trim(),
          lastErr = null;
        for (var k = 0; k < urls.length; k++) {
          var u = urls[k];
          if (px && u.indexOf(location.origin) !== 0) u = px.indexOf('{url}') >= 0 ? px.replace('{url}', encodeURIComponent(u)) : px + u;
          try {
            var r = await fetch(u);
            if (!r.ok) throw new Error('HTTP ' + r.status + '(' + label + ')');
            var tot = +r.headers.get('content-length') || 0,
              ch = [],
              n = 0,
              rd = r.body.getReader();
            for (;;) {
              var x = await rd.read();
              if (x.done) break;
              if (BKS.cancel) {
                rd.cancel();
                throw new Error('中止');
              }
              ch.push(x.value);
              n += x.value.length;
              bkProg(tot ? n / tot : 0, label + ' ダウンロード中 ' + (n / 1048576).toFixed(0) + 'MB' + (tot ? ' / ' + (tot / 1048576).toFixed(0) + 'MB' : ''), '');
            }
            return new Blob(ch);
          } catch (e) {
            if (e && e.message === '中止') throw e;
            lastErr = e;
            bkProg(0, label + ' 取得元' + (k + 1) + '(' + urls[k].replace(/^https?:\/\//, '').split('/')[0] + ')で失敗: ' + (e && e.message ? e.message : e) + (k + 1 < urls.length ? ' → 次を試します…' : ''), '');
          }
        }
        throw lastErr || new Error('取得できません');
      }

      async function bkGo(local) {
        if (BKS.busy) return;
        var files = [],
          tag = g('bkTag').value.trim(),
          opt = {
            minRate: +g('bkRate').value || 0,
            maxPly: Math.max(1, +g('bkPly').value || 50),
            minPly: Math.max(0, +g('bkMin').value || 0),
            minCnt: Math.max(1, +g('bkCnt').value || 2),
            names: g('bkNames')
              .value.toLowerCase()
              .split(/\s+/)
              .filter(Boolean),
            pat: null
          },
          tid = g('bkTarget').value,
          tmeta = bkMeta().filter(function (x) {
            return x.id === tid;
          })[0];
        bkSetLS('shogiBkRate', String(opt.minRate));
        bkSetLS('shogiBkTag', tag);
        bkSetLS('shogiBkProxy', g('bkProxy').value.trim());
        bkSetLS('shogiBkUrl', g('bkUrl').value.trim());
        BKS.cancel = 0;
        BKS.fails = [];
        BKS.opt = opt;
        BKS.target = tmeta ? tid : '';
        bkBusy(1);
        try {
          var pt = g('bkPatT').value;
          if (pt === 'moves') {
            var pm = bkParseMoves(g('bkMoves').value);
            opt.pat = { type: 'moves', hash: pm.hash, seq: pm.seq, exact: !g('bkMMerge').checked };
            opt.maxPly = Math.max(opt.maxPly, pm.n);
            BKS.cond = '戦法(両者の手' + (opt.pat.exact ? '・手順どおり' : '・同じ局面を含む') + ') ' + g('bkMoves').value.trim();
          } else if (pt === 'own') {
            var sq = bkParseOwn(g('bkOwn').value);
            opt.pat = { type: 'own', side: +g('bkOSide').value, seq: sq, loose: g('bkOLoose').checked };
            opt.maxPly = Math.max(opt.maxPly, sq.length * 2);
            BKS.cond = '戦法(' + ['先手', '後手'][opt.pat.side] + 'の手だけ・' + (opt.pat.loose ? '順番だけ守る' : '1手目から連続') + ') ' + g('bkOwn').value.trim();
          } else if (pt === 'form') {
            opt.pat = { type: 'form', goals: bkParseForm(g('bkForm').value), side: +g('bkFSide').value };
            BKS.cond = '囲い ' + g('bkForm').value.trim() + '(' + ['先手', '後手', 'どちらでも'][opt.pat.side] + ')';
          } else BKS.cond = '指定なし';
          BKS.cond += ' / レート' + opt.minRate + '以上 / 先頭' + opt.maxPly + '手';
          if (tmeta) opt.base = await idbGet('bk:' + tid);
          if (tmeta && !opt.base) throw new Error('追加先の定跡を読み込めませんでした');
          if (local) {
            local.forEach(function (f) {
              if (!tmeta || bkAskDup(tmeta, f.name, f.size)) files.push({ name: f.name, size: f.size, blob: f });
            });
            BKS.src = local
              .map(function (f) {
                return f.name;
              })
              .join(', ');
          } else {
            var ys = Array.from(g('bk').querySelectorAll('.bkY'))
              .filter(function (c) {
                return c.checked;
              })
              .map(function (c) {
                return c.value;
              });
            if (!ys.length || !tag) throw new Error('タグと年を指定してください');
            var fails = [],
              lastErr = null;
            for (var i = 0; i < ys.length; i++) {
              var nm = 'wdoor' + ys[i] + '.7z';
              if (tmeta && !bkAskDup(tmeta, nm, 0)) continue;
              try {
                var bl = await bkDownload(bkUrls(nm, ys[i], tag), '[' + (i + 1) + '/' + ys.length + '] ' + nm);
                files.push({ name: nm, size: bl.size, blob: bl });
              } catch (e) {
                if (e && e.message === '中止') throw e;
                fails.push(nm);
                lastErr = e;
              }
            }
            BKS.fails = fails;
            if (!files.length) throw lastErr || new Error('取得できませんでした');
            BKS.src = tag + ' ' + ys.join(',');
          }
          if (!files.length) throw new Error('追加するファイルがありません');
          BKS.files = files.map(function (f) {
            return { name: f.name, size: f.size };
          });
          bkProg(0, '解凍を開始します…', '');
          var eng = g('eng').textContent,
            cut = eng.indexOf("if (typeof document === 'undefined')"),
            src = (cut > 0 ? eng.slice(0, cut) : eng) + '\n' + g('bkw').textContent;
          BKS.w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
          BKS.w.onmessage = bkMsg;
          BKS.w.onerror = function (e) {
            bkFail(new Error(e.message || 'ワーカーエラー'));
          };
          BKS.w.postMessage({
            files: files.map(function (f) {
              return { name: f.name, blob: f.blob };
            }),
            opt: opt
          });
        } catch (e) {
          bkFail(e);
        }
      }

      function bkMsg(e) {
        var m = e.data;
        if (m.t === 'prog') {
          var S = m.S;
          bkProg(
            (m.fi + m.frac) / m.nf,
            '[' + (m.fi + 1) + '/' + m.nf + '] ' + m.file + ' を解凍・集計中 ' + Math.round(m.frac * 100) + '%' +
              (m.tot ? ' (棋譜 ' + m.n + '/' + m.tot + ')' : ''),
            '採用 ' + S.games + '局 / 条件に合う ' + S.rated + '局 / 走査 ' + S.scanned + '局 (レート不明 ' + S.norate + ', 短すぎ ' + S.short + ', 不正 ' + S.bad + ') / 局面 ' + m.pos + ' / 経過 ' + Math.round(m.ms / 1000) + '秒'
          );
        } else if (m.t === 'done') bkDone(m);
        else if (m.t === 'err') bkFail(new Error(m.txt));
      }

      async function bkDone(m) {
        if (BKS.w) {
          BKS.w.terminate();
          BKS.w = null;
        }
        bkBusy(0);
        var b = m.book,
          ls = bkMeta(),
          now = new Date().toISOString().slice(0, 16).replace('T', ' '),
          fl = BKS.files.map(function (f) {
            return { name: f.name, size: f.size, cond: BKS.cond, date: now };
          });
        if (!b.keys.length) {
          bkProg(0, '条件に合う局面がありませんでした(採用 ' + m.S.games + '局)。条件をゆるめてみてください。', '');
          return;
        }
        var meta = ls.filter(function (x) {
            return x.id === BKS.target;
          })[0],
          id = meta ? meta.id : 'b' + Date.now();
        if (meta) {
          meta.games = (meta.games || 0) + m.S.games;
          meta.pos = b.keys.length;
          meta.mv = b.mv.length;
          meta.files = (meta.files || []).concat(fl);
          b.name = meta.name;
        } else {
          var nm = g('bkName').value.trim() || 'floodgate';
          meta = {
            id: id,
            name: nm,
            made: now,
            games: m.S.games,
            pos: b.keys.length,
            mv: b.mv.length,
            minRate: BKS.opt.minRate,
            maxPly: BKS.opt.maxPly,
            files: fl
          };
          b.name = nm;
          ls.unshift(meta);
        }
        try {
          await idbPut('bk:' + id, b);
        } catch (e) {
          bkProg(0, '保存に失敗しました: ' + e.message, '');
          return;
        }
        bkSetLS('shogiBkMeta', JSON.stringify(ls));
        bkSetLS('shogiBkOn', id);
        bkSetLS('shogiBkUse', '1');
        b.id = id;
        BKA = b;
        bkKey = -1;
        bkcPaint();
        bkFillTarget();
        bkProg(
          1,
          (BKS.target ? '追加しました: ' : '完成: ') + b.keys.length + '局面 / ' + b.mv.length + '手(今回採用 ' + m.S.games + '局, ' + Math.round(m.ms / 1000) + '秒)。VS AIで使います。' + (m.S.games < 20 ? ' ※採用した棋譜が少ないです。年を増やす・最低レートを下げる・入力の手数を減らすと増えます。' : '') + (BKS.fails && BKS.fails.length ? ' 取得できなかった年: ' + BKS.fails.join(', ') : ''),
          ''
        );
      }

      async function bkDelete(id) {
        if (!confirm('この定跡を削除しますか?')) return;
        try {
          await idbDel('bk:' + id);
        } catch (e) {}
        bkSetLS(
          'shogiBkMeta',
          JSON.stringify(
            bkMeta().filter(function (x) {
              return x.id !== id;
            })
          )
        );
        if (bkLS('shogiBkOn', '') === id) {
          bkSetLS('shogiBkOn', '');
          BKA = null;
          bkKey = -1;
        }
        bkcPaint();
        bkRenderList();
      }

      async function bkExport(id) {
        var d = await idbGet('bk:' + id),
          meta =
            bkMeta().filter(function (x) {
              return x.id === id;
            })[0] || {};
        if (!d) return;
        var o = {
          format: 'shogi-book-1',
          meta: meta,
          keys: Array.from(d.keys),
          off: Array.from(d.off),
          mv: Array.from(d.mv),
          cnt: Array.from(d.cnt),
          win: Array.from(d.win)
        };
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' }));
        a.download = (meta.name || 'book') + '.json';
        a.click();
      }

      async function bkImport(f) {
        try {
          var o = JSON.parse(await f.text());
          if (o.format !== 'shogi-book-1' || !o.keys || !o.off || !o.mv) throw new Error('定跡ファイルの形式が違います');
          var b = {
              keys: Float64Array.from(o.keys),
              off: Uint32Array.from(o.off),
              mv: Int32Array.from(o.mv),
              cnt: Uint32Array.from(o.cnt),
              win: Uint32Array.from(o.win)
            },
            id = 'b' + Date.now(),
            meta = Object.assign({}, o.meta || {}, { id: id });
          if (b.off.length !== b.keys.length + 1 || b.mv.length !== b.cnt.length) throw new Error('定跡ファイルが壊れています');
          meta.name = meta.name || f.name.replace(/\.json$/i, '');
          meta.pos = b.keys.length;
          meta.mv = b.mv.length;
          b.name = meta.name;
          await idbPut('bk:' + id, b);
          var ls = bkMeta();
          ls.unshift(meta);
          bkSetLS('shogiBkMeta', JSON.stringify(ls));
          bkSetLS('shogiBkOn', id);
          b.id = id;
          BKA = b;
          bkKey = -1;
          bkcPaint();
          bkRenderList();
        } catch (e) {
          alert('読み込めませんでした: ' + e.message);
        }
      }

      function bkInit() {
        buildBook();
        var mu = g('bkUseM');
        if (mu) {
          mu.checked = bkLS('shogiBkUse', '1') === '1';
          mu.onchange = function () {
            bkSetUse(mu.checked);
          };
        }
        var id = bkLS('shogiBkOn', '');
        if (id)
          bkLoad(id).then(function () {
            /* 読み込みが間に合わず、最初のAIの手が定跡なしで始まっていたら、定跡ありでやり直す */
            try {
              if (BKA && mode === 'vs' && !over && !paused && !editing && P.side !== human && hist.length < 2 && bkUse() && bkMoves().length) think(1);
            } catch (e) {}
          });
      }

      /* --- 初期化 --- */
      buildMenu();
      bkInit();

      function syncCustom() {
        SPEC.forEach(function (sp) {
          var c = g(sp[0] + 'C');
          if (c) c.style.display = g(sp[0]).value === 'c' ? '' : 'none';
        });
      }
      document.addEventListener('change', syncCustom);
      syncCustom();
      g('nnB').onclick = function () {
        if (!nnOk) loadHao();
      };
      g('res').onclick = function () {
        this.hidden = true;
      };
      g('ed').onclick = edClick;
      setInterval(function () {
        if (busy && !over && mode !== 'train' && lastMsg && lastMsg.id === gid && Date.now() - lastRx > 25000) {
          lastRx = Date.now();
          W.terminate();
          newWorker();
          W.postMessage(lastMsg);
        }
      }, 3000);
      newWorker();
      autoLoad();
      yoInit();
      g('btns').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'bNew') newGame();
        else if (b.id === 'bTr') {
          if (trainOn) {
            trainOn = 0;
            busy = 0;
            W.postMessage({ cmd: 'stop' });
            renderBtns();
          } else startTrain();
        } else if (b.id === 'bTrR') {
          LWS = new Float64Array(16);
          try {
            localStorage.removeItem('shogiLW');
          } catch (e) {}
          if (trainOn) startTrain();
          else {
            trStat = '学習をリセットしました';
            paintTrain();
          }
        } else if (b.id === 'bMenu') g('menu').hidden = !g('menu').hidden;
        else if (b.dataset.a === 'u') undoFor(+b.dataset.c);
        else if (b.dataset.a === 'r') resign(+b.dataset.c);
        else if (b.dataset.a === 'd') declare();
        else if (b.dataset.a === 'p') pauseGame();
        else if (b.dataset.a === 'c') resumeGame();
        else if (b.dataset.a === 's') toStudy();
        else if (b.dataset.a === 'e') startEdit();
        else if (b.dataset.a === 'k') openBook();
      };
      window.addEventListener('resize', layoutSoon);
      window.addEventListener('orientationchange', layoutSoon);
      window.addEventListener('scroll', function () {
        window.scrollTo(0, 0);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', layoutSoon);
        window.visualViewport.addEventListener('scroll', layoutSoon);
      }
      if (window.ResizeObserver) new ResizeObserver(layoutSoon).observe(g('btns'));
      new MutationObserver(layoutSoon).observe(g('app'), {
        attributes: true,
        attributeFilter: ['hidden'],
        subtree: true
      });
      /* やねうら王への停止要求が失われても止まらないようにする */
      setInterval(function () {
        if (YO.state !== 'ok' || !YO.pending || !YO.running || !YO.stopAt) return;
        if (Date.now() - YO.stopAt < 3000) return;
        YO.stopAt = Date.now();
        if (++YO.stopN >= 2) {
          clearTimeout(YO.gt);
          YO.running = false;
          YO.cur = null;
          yoKick();
        } else YO.send('stop');
      }, 1000);
      layout();
      newGame();
    </script>
  </body>
</html>
