    <!--
      v32 (v31からの変更点)
      - 戦法の検索を修正: 「自分の手だけ」は、標準で自分の1手目から連続して入力どおりの棋譜だけを拾う(今までは、順番さえ合えば途中に別の手が挟まっていてもよい作りで、初手が違う棋譜も大量に拾っていた)
        従来の拾い方は「間に別の自分の手が挟まってもよい」のチェックで選べる
      - 「両者の手を順に」も、標準で1手目から手順どおりの棋譜だけを拾う。手順が前後して同じ局面になる棋譜(合流)は「合流も含める」のチェックで選べる
      - これにより、戦法を指定した定跡は、最初の手も入力した手になる(定跡の木の根元に別の初手が混ざらない)

      v31 (v30からの変更点)
      - 取得元の最優先に https://mathotagamma.github.io/wdoor-getter/wdoorYYYY.7z を追加(CORS対応のミラー)。年ごとに取得できなかった場合は飛ばして続ける。年の既定を2025に変更
      - 書き方の説明を追加: 定跡の作成タブに折りたたみ説明(全体の流れ・筋と段の見方・戦法2種類・囲い・各欄の意味)、☰の自作指定にも詳しい説明
      - 定跡コンテナに診断を追加: 今の局面でAIが定跡で指すかエンジンで考えるか、定跡の外に出た手数
      - 最小出現数の既定を条件で切替(指定なし=2、戦法・囲い=1)

      v30 (v29からの変更点)
      - 囲いの完成や戦法の完了で記録を打ち切らず、完成・完了した後も「序盤の手数」まで定跡に入れる(囲い・戦法どちらも)
      - 戦法の検索を2種類に: 「両者の手を順に」(相手の手も入れる、手順前後の合流も拾う)/「自分の手だけ」(相手の手は問わず、その順に指した棋譜を拾う)
      - 「枝の探索」タブを追加: 使っている定跡の木を、盤面つきで1手ずつたどる(戻る・最初から・今の対局の局面から・採用数順/勝率順・この局面から対局)
      - AIが定跡を指さないことがある件の対策: 定跡を使う/無視の設定を ☰ メニューと定跡コンテナに追加。定跡を使う最大手数の既定を30手から制限なしに変更。定跡の読み込み前に最初のAIの手が始まっていた場合はやり直す
      - 自作指定の表記: 駒は大文字 P L N S G B R K が正(小文字も可)。表示や例を大文字に戻した
      - 取得元: 取得元URL(任意)を追加。このページと同じ場所の wdoor/ フォルダを最優先で試す(同じ場所なら制限なし。付属の wdoor-pages.yml で自動配置できる)

      v29 (v28からの変更点)
      - 定跡の作り方を変更: 「検索条件」を入力して、それが出てくる棋譜だけから定跡を作る
        戦法 = 指し手を何手か入力(USI形式 7g7f 3c3d …、CSA形式も可)。その手順または手順前後で同じ局面になる棋譜を拾う
        囲い = 駒とマスを入力(k2h s3h g4i g5h など。先手/後手/どちらでも)。その形ができる棋譜を拾い、できるまでの手を使う
        指定なし = 高レートの対局すべて
      - 既存の定跡に.7zを追加できる(追加先を選択)。追加済みの.7z(名前とサイズで判定)を入れると、追加日と条件を出して確認する
      - 使う棋譜の最小手数を指定できる
      - 「勝った側の手だけを使う」を廃止(局面ごとの出現数が親の手の出現数と合わなくなる原因になるため)
      - 次の手の定跡リストを、評価値リストの右側の専用コンテナに表示(採用数順が標準、勝率順に切替可、縦スクロール)。定跡を指したら「直前の手は定跡」と表示し、KIFにも「*定跡 ○局 勝率○%」を書く
      - 評価値リストに、現在の局面で指せない手(前の探索の遅れて届いた結果)が混ざらないよう除外
      - 取得先: GitHub Releases のほか、wdoor(東大)のアーカイブも自動で順に試す

      v28 (v27からの変更点)
      - 設定「AIの手を自分で指せる」の動作を変更: AIが考えている間に、盤をタップしてAI側の駒を直接動かせる
        (候補手のタップ・「AI推奨で指す」ボタン・AIの手の選択待ちは廃止。動かさなければAIが自動で指す)
      - 自陣の形(戦法)の目標の指定方法を拡張
        駒は P L N S G B R K(小文字も可)。成り駒は +P(と) +L(杏) +N(圭) +S(全) +B(馬) +R(龍)
        マスは P7f のほか P76 のように数字2桁でも可。漢字も可(歩76 銀38 成香1d 馬22 龍28 と1c / 成香 成桂 成銀 杏 圭 全 竜 王)
        解釈できない指定は、目標の表示欄に出す(今までは黙って無視していた)
        成り駒を目標にしたときは、成る手を選べるようにした
      - AIの手に付けていた ★ を廃止(最善手以外を指した印だった。順位・最善比の表示は今までどおり)
      - 定跡ブックを追加(下のボタン「定跡」または ☰ から開く。タブ: 作成 / 保存済み・使用設定)
        Floodgate(wdoor)の過去の棋譜(shogi-server の Releases にある wdoorYYYY.7z)から、レートの高い対局の序盤を集めて定跡ファイルを作る
        最低レート(対局した2人とも)・序盤の手数・最小出現数・対局者名・勝った側のみ を指定できる。作成中は進捗(%・棋譜数・採用局数・局面数)を表示
        定跡ファイルには多数の局面とその指し手(出現数・勝率つき)が入り、複数保存(IndexedDB)・選択・.json書き出し/読み込みができる
        VS AIでは、AIの手番で定跡に手があればそれを(出現数と勝率で重み付けして)指す。候補手欄にも定跡の手を表示
        7zはブラウザ内で順に解凍する(LZMA2のみ対応)。GitHubの配信サーバーはブラウザからの直接ダウンロード(CORS)を許可していない場合があり、
        その場合は保存した .7z を「ファイルを選んで作成」で読み込む(任意でCORSプロキシも指定可)

      v27 (v26からの変更点)
      - コードを整形: 1行にまとめていた文を1文ずつの行に展開し、インデントを2スペースにそろえた(動作は変更なし)
      - エンジンと hao.bin の置き場所の指定を、メインスレッド(UIスクリプト)の先頭の「置き場所の設定」にまとめた
        HAO_URLS(hao.bin の取得先) / ENGINE_DIRS(やねうら王の置き場) / ENGINE_FILES(ファイル名) / SIZE_HAO・SIZE_WASM(進捗表示用の大きさ)

      v26 (v25からの変更点)
      - 自陣の形(戦法)の目標を、自作エンジンでも使えるように変更(やねうら王専用ではなくなった)
      - どのエンジンで動いているかを、候補手欄の先頭に常時表示(「エンジン: やねうら王(WASM) + hao.bin」/「自作エンジン(やねうら王は使えません: 理由)」)

      v25 (v24からの変更点)
      - 最悪手: 解析が終わったあと、全手を短時間(自分の手番1.5秒/AIの手番0.7秒)だけ評価し直して最悪手を必ず表示
        (VS AIの上位5手のみの探索では出なかった)。あわせて、上位5手の外の手を指したときも「何位・最善比」を表示
      - AIの手のばらつき: 最善手以外を選んだ手には ★ を付けて表示(順位・最善比つき)。候補の深度条件を1段ゆるめ、選ばれにくい場面を減らした
      - 設定「AIの手を自分で決める」を追加。ONのとき、AIの手番でも盤をタップして指せる。候補手(上位5手)をタップしても指せる。
        「AI推奨で指す」ボタンでAIの選んだ手をそのまま指せる(AIは自動では指さない)
      - 設定「自陣の形(戦法)の目標」を追加(プリセット+自作)。自作は「駒+マス」(例 P7f R6h K2h)を優先順に空白区切り(先手視点。後手は自動で反転)
        AIは最善手から150cp以内(形勢が悪いときは60cp)なら、目標に近づく手を優先して指す
        目指せないときは理由を画面に表示(動かせる駒がない/塞がれている(他の駒を先に動かす場合は「今は動かせない」)/評価が下がるため見送り/駒を取られた・形勢が悪いため断念)
        (v26で自作エンジンでも有効になった)

      v24 (v23からの変更点)
      - 詰みが見つかった局面で、時間制限の探索が深度245(上限)まで空回りする問題を修正
        (時間指定の探索で詰みの評価が出て深度6以上になったら探索を打ち切る。深度表示も99を上限に)

      v23 (v22からの変更点)
      - AIの強さ: 「10(最強)」を「10」に変更し、末尾に「無制限」(探索深さの制限なし)を追加。既定は無制限
      - 局面編集: パレット(駒の種類選択・先手後手の駒・盤に置く/持駒に追加・消す)を廃止
        「全消去」を「全て持駒へ」に変更(玉以外の駒を先手の持駒にまとめる。そこから選択して好きな場所・側に置ける)
        玉の上には置けない(玉が消えるのを防止)
      - 設定の「任意」用の数値欄は、「任意」を選んだときだけ表示(初期値7が紛らわしかったため)

      v22 (v21からの変更点)
      - 局面編集の操作を刷新
        盤上の駒をタップ=選択 / 別のマスをタップ=移動(先に駒があれば、選択した駒の持ち主の持駒にして置く)
        選択中に同じ駒をもう一度タップ=種類切替(自歩→自と→相歩→相と→…。金・玉は 自→相)して選択解除
        選択中に持駒エリアをタップ=その側の持駒にする(玉は不可) / 持駒の駒をタップ=選択して盤へ置ける
        移動・配置・切替・持駒化のあとは選択解除
      - AIの強さレベル(1〜10)を追加。低いほど探索深さを制限し、手のばらつきを大きくする
      - ばらつきで選ぶ手の評価低下に上限(150cp)を設定。勝勢から互角以下になる手も選ばない

      v21 (v20からの変更点)
      - VS AIの自分の手番の解析を、AIの手番と同じ方式に変更(考慮時間=AI考慮時間、候補手は上位5手)。研究・AI学習は従来のまま
      - そのため VS AI中は、自分の手の「何位・最善比」は上位5手に入った場合のみ表示され、最悪手は表示されない

      v20 (v19からの変更点)
      - ばらつきの許容値を手数に応じて滑らかに減衰: 許容cp = 設定値 × 4 / (1 + e^((手数 - 15) / 5))
        (0手目で約3.8倍、15手目で2倍、30手目で約0.2倍、以降ほぼ最善手)

      v19 (v18からの変更点)
      - AIの手のばらつき設定を追加(既定60cp)。最善手との評価差が許容内の候補から評価差で重み付けして選ぶ(序盤16手までは許容2倍)
      - ばらつきが有効なときは AIの手番も MultiPV=5 で探索

      v18 (元ファイルからの変更点)
      - 盤面サイズを JS で実測計算(ボタンの折返し高さも考慮)。小さい画面でも極端に小さくならない
      - 横長/狭い画面では「左:盤面 / 右:情報・ボタン」の横配置に自動切替
      - ボタンが画面外に出ない・ページがスクロールしない(position:fixed + visualViewport 追従)
      - 評価バー: 常にMultiPV1の評価値を使用。停止要求が失われたときの自動復旧(ウォッチドッグ)を追加
    -->

      #bk label {

    </style>

  <body>
    <div id="app">
      <div id="L">
        <div class="hand" id="h0"></div>
        <div id="board"></div>
        <div class="hand" id="h1"></div>
      </div>
      <div id="R">
        <div id="top"><span id="clk"></span><span id="nnB"></span><span id="msg"></span></div>
        <div id="ev"><i id="evB"></i><span id="evT">形勢</span></div>
        <div id="info">
          <div class="bar" id="bar"><i></i></div>
          <div id="infoRow">
            <div id="cand"></div>

        </div>

    </div>
    <div id="menu" hidden></div>

      <button id="aN">不成</button>
    </div>
    <div id="res" hidden></div>
    <div id="ov" hidden>
      <div id="ovT"></div>
      <div class="bar"><i id="ovB"></i></div>
    </div>

    <script id="eng">
      /* ===== 将棋エンジン(メインとWorkerで共用) ===== */
      var DR = [-1, -1, 0, 1, 1, 1, 0, -1],
        DF = [0, 1, 1, 1, 0, -1, -1, -1],
        FL = [4, 3, 2, 1, 0, 7, 6, 5];
      var STEP = [0, 1, 0, 0, 171, 215, 0, 0, 255, 215, 215, 215, 215, 0, 85, 170];
      var SLD = [0, 0, 1, 0, 0, 0, 170, 85, 0, 0, 0, 0, 0, 0, 170, 85];
      var VAL = [0, 90, 350, 450, 550, 600, 900, 1000, 0, 600, 600, 600, 600, 0, 1100, 1300];
      var KK = [0, 0, 1, 2, 3, 4, 5, 7, 0, 4, 4, 4, 4, 0, 6, 8];
      var HB = [0, 1, 39, 49, 59, 69, 79, 85],
        HE = [0, 20, 44, 54, 64, 74, 82, 88];

      function newPos() {
        var P = { b: new Int8Array(81), h: [new Int8Array(8), new Int8Array(8)], side: 0, k: [4 * 9 + 8, 4 * 9] };
        var back = [2, 3, 4, 5, 8, 5, 4, 3, 2];
        for (var f = 0; f < 9; f++) {
          P.b[f * 9] = back[f] | 16;
          P.b[f * 9 + 8] = back[f];
          P.b[f * 9 + 2] = 17;
          P.b[f * 9 + 6] = 1;
        }
        P.b[7 * 9 + 1] = 7 | 16;
        P.b[1 * 9 + 1] = 6 | 16;
        P.b[7 * 9 + 7] = 6;
        P.b[1 * 9 + 7] = 7;
        return P;
      }

      function fromSt(s) {
        return {
          b: Int8Array.from(s.b),
          h: [Int8Array.from(s.h[0]), Int8Array.from(s.h[1])],
          side: s.side,
          k: s.k.slice()
        };
      }

      function toSt(P) {
        return { b: Array.from(P.b), h: [Array.from(P.h[0]), Array.from(P.h[1])], side: P.side, k: P.k.slice() };
      }

      function gen(P, co) {
        var b = P.b,
          c = P.side,
          o = [],
          hd = P.h[c],
          pf = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        function ad(s, ts, t) {
          if (co && !b[ts]) return;
          var r0 = s % 9,
            r1 = ts % 9,
            z0 = c ? r0 >= 6 : r0 <= 2,
            z1 = c ? r1 >= 6 : r1 <= 2,
            last = c ? 8 - r1 : r1;
          var pr = t <= 7 && t !== 5 && t !== 8 && (z0 || z1);
          var must = t === 1 || t === 2 ? last === 0 : t === 3 ? last <= 1 : 0;
          if (pr) o.push(s | (ts << 7) | (1 << 14));
          if (!must) o.push(s | (ts << 7));
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p || p >> 4 !== c) continue;
          var t = p & 15,
            f = (s / 9) | 0,
            r = s % 9;
          if (t === 1) pf[f] = 1;
          if (t === 3) {
            var kr = r + (c ? 2 : -2);
            if (kr >= 0 && kr < 9)
              for (var e = -1; e <= 1; e += 2) {
                var kf = f + e;
                if (kf >= 0 && kf < 9 && !(b[kf * 9 + kr] && b[kf * 9 + kr] >> 4 === c)) ad(s, kf * 9 + kr, t);
              }
          }
          for (var j = 0; j < 8; j++) {
            var sl = (SLD[t] >> j) & 1;
            if (!((STEP[t] >> j) & 1) && !sl) continue;
            var a = c ? FL[j] : j,
              nf = f + DF[a],
              nr = r + DR[a];
            while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
              var q = b[nf * 9 + nr];
              if (q && q >> 4 === c) break;
              ad(s, nf * 9 + nr, t);
              if (q || !sl) break;
              nf += DF[a];
              nr += DR[a];
            }
          }
        }
        if (!co) {
          for (var d = 1; d < 8; d++) {
            if (!hd[d]) continue;
            for (var u = 0; u < 81; u++) {
              if (b[u]) continue;
              var uf = (u / 9) | 0,
                ur = u % 9,
                ul = c ? 8 - ur : ur;
              if ((d <= 2 && ul === 0) || (d === 3 && ul <= 1) || (d === 1 && pf[uf])) continue;
              o.push(81 | (u << 7) | (d << 15));
            }
          }
        }
        return o;
      }

      function atk(P, s, c) {
        var b = P.b,
          f = (s / 9) | 0,
          r = s % 9,
          kr = r + (c ? -2 : 2);
        if (kr >= 0 && kr < 9) {
          for (var e = -1; e <= 1; e += 2) {
            var kf = f + e;
            if (kf >= 0 && kf < 9 && b[kf * 9 + kr] === (3 | (c << 4))) return 1;
          }
        }
        for (var i = 0; i < 8; i++) {
          var a = (i + 4) & 7,
            j = c ? FL[a] : a,
            nf = f + DF[i],
            nr = r + DR[i],
            k = 1;
          while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
            var p = b[nf * 9 + nr];
            if (p) {
              if (p >> 4 === c) {
                var t = p & 15;
                if (((STEP[t] >> j) & 1 && k === 1) || (SLD[t] >> j) & 1) return 1;
              }
              break;
            }
            nf += DF[i];
            nr += DR[i];
            k++;
          }
        }
        return 0;
      }

      function make(P, m) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15,
          c = P.side,
          b = P.b,
          cap = b[t];
        if (f === 81) {
          b[t] = d | (c << 4);
          P.h[c][d]--;
        } else {
          var p = b[f];
          b[f] = 0;
          if (pr) p += 8;
          b[t] = p;
          if ((p & 15) === 8) P.k[c] = t;
          if (cap) {
            var ct = cap & 15;
            P.h[c][ct > 8 ? ct - 8 : ct]++;
          }
        }
        P.side ^= 1;
        return cap;
      }

      function undo(P, m, cap) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15,
          c = P.side ^ 1,
          b = P.b;
        if (f === 81) {
          b[t] = 0;
          P.h[c][d]++;
        } else {
          var p = b[t];
          if (pr) p -= 8;
          b[f] = p;
          b[t] = cap;
          if ((p & 15) === 8) P.k[c] = f;
          if (cap) {
            var ct = cap & 15;
            P.h[c][ct > 8 ? ct - 8 : ct]--;
          }
        }
        P.side = c;
      }

      function legal(P) {
        var ms = gen(P),
          o = [],
          c = P.side;
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i],
            cap = make(P, m),
            ok = !atk(P, P.k[c], c ^ 1);
          if (ok && m >> 15 === 1 && atk(P, P.k[c ^ 1], c) && !legal(P).length) ok = false;
          undo(P, m, cap);
          if (ok) o.push(m);
        }
        return o;
      }

      /* ----- ハッシュ・千日手 ----- */
      var Z1 = new Int32Array(3000),
        Z2 = new Int32Array(3000),
        PK = [],
        PC = [],
        EC = new Map();
      (function () {
        var x = 123456789;
        function r() {
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          return x | 0;
        }
        for (var i = 0; i < 3000; i++) {
          Z1[i] = r();
          Z2[i] = r();
        }
      })();

      function hashP(P) {
        var h1 = P.side ? -1640531527 : 0,
          h2 = P.side ? 1013904242 : 0,
          b = P.b,
          i,
          p;
        for (i = 0; i < 81; i++) {
          p = b[i];
          if (p) {
            h1 ^= Z1[i * 32 + p];
            h2 ^= Z2[i * 32 + p];
          }
        }
        for (var c = 0; c < 2; c++)
          for (var t = 1; t < 8; t++) {
            var n = P.h[c][t];
            if (n) {
              var k = 2592 + (c * 8 + t) * 19 + n;
              h1 ^= Z1[k];
              h2 ^= Z2[k];
            }
          }
        return (h1 >>> 0) * 2097152 + (h2 >>> 11);
      }
      /* 千日手の周期 j..k のうち、k手目を指した側だけが毎手王手→1、もう一方→2、なし→0 */
      function cyc(pc, k, j) {
        var a = 1,
          b = 1,
          i;
        for (i = k; i > j; i -= 2)
          if (!pc[i]) {
            a = 0;
            break;
          }
        for (i = k - 1; i > j; i -= 2)
          if (!pc[i]) {
            b = 0;
            break;
          }
        return a ? 1 : b ? 2 : 0;
      }

      /* ----- 評価 ----- */
      var NN = 0,
        LW = new Float64Array(16),
        FB,
        FW,
        B1,
        W1,
        B2,
        W2,
        B3,
        W3;
      var A0 = new Int32Array(256),
        A1 = new Int32Array(256),
        IN = new Int32Array(512),
        H1 = new Int32Array(32),
        H2 = new Int32Array(32);

      function mat(P, x) {
        var c = P.side,
          b = P.b;
        x.fill(0);
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (p) x[p & 15] += p >> 4 === c ? 1 : -1;
        }
        for (var t = 1; t < 8; t++) x[t] += P.h[c][t] - P.h[c ^ 1][t];
        return x;
      }
      var XV = new Float64Array(16);

      function nnEval(P) {
        var b = P.b,
          W = FW,
          k0 = P.k[0] * 1548,
          k1 = (80 - P.k[1]) * 1548;
        A0.set(FB);
        A1.set(FB);
        function add(i0, i1) {
          var o0 = (k0 + i0) * 256,
            o1 = (k1 + i1) * 256;
          for (var j = 0; j < 256; j++) {
            A0[j] += W[o0 + j];
            A1[j] += W[o1 + j];
          }
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p) continue;
          var t = p & 15;
          if (t === 8) continue;
          var c = p >> 4,
            kk = 90 + 162 * KK[t];
          add(kk + (c ? 81 : 0) + s, kk + (c ? 0 : 81) + 80 - s);
        }
        for (var cc = 0; cc < 2; cc++) {
          for (var d = 1; d < 8; d++) {
            for (var i = 0; i < P.h[cc][d]; i++) add((cc ? HE[d] : HB[d]) + i, (cc ? HB[d] : HE[d]) + i);
          }
        }
        var st = P.side,
          X0 = st ? A1 : A0,
          X1 = st ? A0 : A1;
        for (var j = 0; j < 256; j++) {
          var v = X0[j];
          IN[j] = v < 0 ? 0 : v > 127 ? 127 : v;
          v = X1[j];
          IN[256 + j] = v < 0 ? 0 : v > 127 ? 127 : v;
        }
        for (var i2 = 0; i2 < 32; i2++) {
          var sm = B1[i2],
            o = i2 * 512;
          for (var j2 = 0; j2 < 512; j2++) {
            var iv = IN[j2];
            if (iv) sm += W1[o + j2] * iv;
          }
          sm >>= 6;
          H1[i2] = sm < 0 ? 0 : sm > 127 ? 127 : sm;
        }
        for (var i3 = 0; i3 < 32; i3++) {
          var s3 = B2[i3];
          for (var j3 = 0; j3 < 32; j3++) s3 += W2[i3 * 32 + j3] * H1[j3];
          s3 >>= 6;
          H2[i3] = s3 < 0 ? 0 : s3 > 127 ? 127 : s3;
        }
        var out = B3[0];
        for (var j4 = 0; j4 < 32; j4++) out += W3[j4] * H2[j4];
        return out / 20;
      }

      function evalPos(P) {
        var x = mat(P, XV),
          e = 0,
          k;
        if (NN) {
          var hk = hashP(P),
            cv = EC.get(hk);
          if (cv === undefined) {
            cv = nnEval(P);
            if (EC.size > 600000) EC.clear();
            EC.set(hk, cv);
          }
          e = cv;
        } else for (k = 1; k < 16; k++) e += VAL[k] * x[k];
        for (k = 1; k < 16; k++) e += LW[k] * x[k];
        return Math.round(e);
      }

      /* ----- 探索 ----- */
      var nodes = 0,
        dl = 1e15,
        stopF = 0;
      var TT = new Map(),
        KL = [],
        HT = new Int32Array(32768),
        ttLW = '';

      function sortMv(P, ms, tm, ply) {
        var b = P.b,
          k1 = KL[ply * 2] | 0,
          k2 = KL[ply * 2 + 1] | 0;
        var sc = ms.map(function (m) {
            if (m === tm) return 1e8;
            var v = b[(m >> 7) & 127] ? VAL[b[(m >> 7) & 127] & 15] * 10 - VAL[b[m & 127] & 15] + 1e6 : 0;
            if ((m >> 14) & 1) v += 5e5;
            if (!v) v = m === k1 ? 9e5 : m === k2 ? 8e5 : HT[m & 32767];
            return v;
          }),
          idx = ms.map(function (_, i) {
            return i;
          });
        idx.sort(function (x, y) {
          return sc[y] - sc[x];
        });
        return idx.map(function (i) {
          return ms[i];
        });
      }

      function qs(P, a, b, ply) {
        var e = evalPos(P);
        if (e >= b) return e;
        if (e > a) a = e;
        if (ply > 6) return e;
        var c = P.side,
          ms = sortMv(P, gen(P, 1), 0, 63);
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i],
            cp = make(P, m);
          if (atk(P, P.k[c], c ^ 1)) {
            undo(P, m, cp);
            continue;
          }
          var v = -qs(P, -b, -a, ply + 1);
          undo(P, m, cp);
          if (stopF) return 0;
          if (v >= b) return v;
          if (v > a) a = v;
        }
        return a;
      }

      function sub(P, m, d, a, b, ply, red) {
        var c = P.side,
          cp = make(P, m),
          v;
        if (atk(P, P.k[c], c ^ 1) || (m >> 15 === 1 && atk(P, P.k[c ^ 1], c) && !legal(P).length)) {
          undo(P, m, cp);
          return 1e9;
        }
        var k = hashP(P),
          n = PK.length,
          j,
          f = 0;
        PK.push(k);
        PC.push(atk(P, P.k[c ^ 1], c) ? 1 : 0);
        for (j = n - 4; j >= 0 && j >= n - 60; j -= 2)
          if (PK[j] === k) {
            f = 1;
            break;
          }
        if (f) {
          var r = cyc(PC, n, j);
          v = r === 1 ? -(29000 - ply) : r === 2 ? 29000 - ply : 0;
        } else v = -srch(P, d - 1 - (red || 0), -b, -a, ply);
        PK.pop();
        PC.pop();
        undo(P, m, cp);
        return v;
      }

      function srch(P, d, a, b, ply) {
        if ((++nodes & 511) === 0 && Date.now() > dl) stopF = 1;
        if (stopF) return 0;
        if (d <= 0) return qs(P, a, b, ply);
        var key = PK[PK.length - 1],
          e = TT.get(key),
          tm = 0,
          a0 = a,
          inChk = PC[PC.length - 1];
        if (e) {
          tm = e[3];
          if (e[0] >= d && e[1] < 29000 && e[1] > -29000) {
            if (e[2] === 0) return e[1];
            if (e[2] === 1 && e[1] >= b) return e[1];
            if (e[2] === 2 && e[1] <= a) return e[1];
          }
        }
        var ms = sortMv(P, gen(P), tm, ply),
          best = -1e9,
          n = 0,
          bm = 0;
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i],
            quiet = !P.b[(m >> 7) & 127] && !((m >> 14) & 1);
          var v = sub(P, m, d, a, b, ply + 1, 0);
          if (v === 1e9) continue;
          n++;
          if (stopF) return 0;
          if (v > best) {
            best = v;
            bm = m;
            if (v > a) a = v;
            if (a >= b) {
              if (quiet) {
                if (KL[ply * 2] !== m) {
                  KL[ply * 2 + 1] = KL[ply * 2];
                  KL[ply * 2] = m;
                }
                HT[m & 32767] += d * d;
              }
              break;
            }
          }
        }
        if (!n) return -30000 + ply;
        if (TT.size > 2e6) TT.clear();
        TT.set(key, [d, best, best <= a0 ? 2 : best >= b ? 1 : 0, bm]);
        return best;
      }

      function rs(P, m, d) {
        return sub(P, m, d, -31000, 31000, 1, 0);
      }

      /* ----- Worker側 ----- */
      if (typeof document === 'undefined') {
        var job = 0,
          loadP = Promise.resolve(),
          lastGo = null;
        var tick = function () {
          return new Promise(function (r) {
            setTimeout(r, 0);
          });
        };
        var leb = function (u, o, n, out) {
          for (var i = 0; i < n; i++) {
            var r = 0,
              sh = 0,
              x;
            do {
              x = u[o++];
              r |= (x & 127) << sh;
              sh += 7;
            } while (x & 128);
            if (sh < 32 && x & 64) r |= -1 << sh;
            out[i] = r;
          }
          return o;
        };
        var ldMsg = function (txt, pct) {
          postMessage({ t: 'ld', txt: txt, pct: pct });
        };
        var parseNet = async function (buf) {
          try {
            if (buf.byteLength < 1e6)
              throw new Error('ファイルが小さすぎます(' + buf.byteLength + 'B / Git LFSポインタの可能性)');
            var u = new Uint8Array(buf),
              dv = new DataView(buf),
              o = 12 + dv.getUint32(8, true) + 4,
              n = 125388 * 256;
            var isLeb = function () {
              var s = '';
              for (var i = 0; i < 17; i++) s += String.fromCharCode(u[o + i]);
              return s === 'COMPRESSED_LEB128';
            };
            var fb = new Int16Array(256),
              fw = new Int16Array(n);
            ldMsg('ヘッダ解析', 55);
            await tick();
            if (isLeb()) {
              o += 17;
              var sz = dv.getUint32(o, true);
              o += 4;
              leb(u, o, 256, fb);
              o += sz;
              o += 17;
              sz = dv.getUint32(o, true);
              o += 4;
              ldMsg('重み展開(LEB128)', 65);
              await tick();
              leb(u, o, n, fw);
              o += sz;
            } else {
              fb = new Int16Array(buf.slice(o, o + 512));
              o += 512;
              ldMsg('入力層の重みを読込中', 65);
              await tick();
              fw = new Int16Array(buf.slice(o, o + n * 2));
              o += n * 2;
            }
            o += 4;
            ldMsg('隠れ層の読込', 90);
            await tick();
            var rd = function (cnt, w) {
              var B = new Int32Array(cnt);
              for (var i = 0; i < cnt; i++) B[i] = dv.getInt32(o + 4 * i, true);
              o += 4 * cnt;
              var Wt = new Int8Array(buf.slice(o, o + cnt * w));
              o += cnt * w;
              return [B, Wt];
            };
            var l1 = rd(32, 512),
              l2 = rd(32, 32),
              l3 = rd(1, 32);
            FB = fb;
            FW = fw;
            B1 = l1[0];
            W1 = l1[1];
            B2 = l2[0];
            W2 = l2[1];
            B3 = l3[0];
            W3 = l3[1];
            NN = 1;
            EC.clear();
            TT.clear();
            var ev = evalPos(newPos()),
              nz = 0;
            for (var q = 0; q < 512; q++) if (IN[q]) nz++;
            if (nz < 8) {
              NN = 0;
              ldMsg('評価関数が無効(出力が一定/非ゼロ' + nz + '): 駒得評価で代用', 100);
              postMessage({ t: 'ldDone', ok: 0 });
            } else {
              ldMsg(
                '読込完了 (初期局面 ' +
                  ev +
                  'cp' +
                  (o !== buf.byteLength ? ' / サイズ差 ' + (buf.byteLength - o) : '') +
                  ')',
                100
              );
              postMessage({ t: 'ldDone', ok: 1 });
            }
            if (lastGo) run(lastGo, ++job);
          } catch (err) {

      /* --- NN読込 --- */
      function setNN(txt, pct, ov) {

      function newWorker() {
        var url = URL.createObjectURL(new Blob([g('eng').textContent], { type: 'text/javascript' }));
        W = new Worker(url);
        W.onmessage = onMsg;
        lastRx = Date.now();
        W.onerror = function (e) {
          busy = 0;
          g('cand').innerHTML = '<div>ワーカーエラー: ' + e.message + '</div>';
        };
        if (netBuf && jsNet) W.postMessage({ cmd: 'net', buf: netBuf });
      }

      function ensureJsNet() {
        if (netBuf && !jsNet) {
          jsNet = 1;
          setNN('NN 解析中…', 50, 1);
          W.postMessage({ cmd: 'net', buf: netBuf });
        }
      }

      function useNet(buf, name) {
        netBuf = buf;
        netName = name;
        if (YO.state === 'ok') {
          yoApplyNet();
          return;
        }
        ensureJsNet();
      }

      function readFile(f) {
        var r = new FileReader();
        r.onprogress = function (e) {
          if (e.total)
            setNN(
              'NN 読込中 ' + (e.loaded / 1048576).toFixed(0) + 'MB / ' + (e.total / 1048576).toFixed(0) + 'MB',
              (e.loaded * 50) / e.total,
              1
            );
        };
        r.onload = function () {
          idbPut('hao', r.result).catch(function () {});
          useNet(r.result, f.name);
        };
        r.readAsArrayBuffer(f);
      }

      function idb() {
        return new Promise(function (res, rej) {
          var r = indexedDB.open('shogiNN', 1);
          r.onupgradeneeded = function () {
            r.result.createObjectStore('f');
          };
          r.onsuccess = function () {
            res(r.result);
          };
          r.onerror = function () {
            rej(r.error);
          };
        });
      }

      async function idbGet(k) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var q = d.transaction('f').objectStore('f').get(k);
          q.onsuccess = function () {
            res(q.result);
          };
          q.onerror = function () {
            rej(q.error);
          };
        });
      }

      async function idbPut(k, v) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var t = d.transaction('f', 'readwrite');
          t.objectStore('f').put(v, k);
          t.oncomplete = res;
          t.onerror = function () {
            rej(t.error);
          };
        });
      }

      function to(p, ms) {
        return Promise.race([
          p,
          new Promise(function (r) {
            setTimeout(function () {
              r(null);
            }, ms);
          })
        ]);
      }

      async function autoLoad() {
        try {
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
        } catch (e) {}
        try {
          var c = await to(idbGet('hao'), 2500);
          if (c && c.byteLength > 1e6) {
            setNN('保存済みの hao.bin を読込中…', 50, 1);
            useNet(c, 'hao.bin(保存済み)');
            return;
          }
        } catch (e) {}
        if (navigator.onLine === false) {
          setNN('オフラインで hao.bin が未保存です。☰からファイルを選んでください', 0, 1);
          setTimeout(function () {
            g('ov').hidden = true;
          }, 5000);
          return;
        }
        loadHao();
      }

      async function loadHao() {
        var err = '';
        for (var k = 0; k < HAO_URLS.length; k++) {
          try {
            setNN('hao.bin ダウンロード開始…', 0, 1);
            var r = await fetch(HAO_URLS[k]);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var tot = +r.headers.get('content-length') || SIZE_HAO,
              ch = [],
              n = 0;
            if (!r.body || !r.body.getReader) {
              var ab = await r.arrayBuffer();
              ch.push(new Uint8Array(ab));
              n = ab.byteLength;
            }
            var rd =
              r.body && r.body.getReader
                ? r.body.getReader()
                : {
                    read: function () {
                      return Promise.resolve({ done: 1 });
                    }
                  };
            for (;;) {
              var x = await rd.read();
              if (x.done) break;
              ch.push(x.value);
              n += x.value.length;
              setNN(
                'hao.bin ダウンロード中 ' + (n / 1048576).toFixed(1) + 'MB / ' + (tot / 1048576).toFixed(1) + 'MB',
                Math.min(50, (n * 50) / tot),
                1
              );
            }
            if (n < 1e6) throw new Error('サイズ不正 ' + n + 'B(LFSポインタ)');
            var u8 = new Uint8Array(n),
              o = 0;
            ch.forEach(function (c) {
              u8.set(c, o);
              o += c.length;
            });
            idbPut('hao', u8.buffer).catch(function () {});
            useNet(u8.buffer, 'hao.bin');
            return;
          } catch (e) {
            err += k + 1 + ': ' + e.message + ' ';
          }
        }
        setNN('取得失敗(タップで再試行) ' + err, 0, 0);
        g('nnB').textContent = '⚠取得失敗:タップで再試行';
      }

      /* --- Worker通信 --- */

      function onMsg(e) {
        var m = e.data;
        lastRx = Date.now();
        if (m.t === 'err') {
          busy = 0;
          g('cand').innerHTML = '<div>エラー: ' + m.txt + '</div>';
          return;
        }
        if (m.t === 'ld') {
          setNN('NN ' + m.txt + ' (' + Math.round(m.pct) + '%)', m.pct, m.pct < 100);
        } else if (m.t === 'ldDone') {
          g('ov').hidden = true;
          nnOk = m.ok;
          if (m.ok) setNN('NN読込済: ' + netName, 100, 0);
        } else if (m.t === 'ack') clearTimeout(tm);
        else if (m.id !== gid) return;
        else if (m.t === 'p' || m.t === 'done') {
          showList(m);
          if (m.t === 'done') {
            busy = 0;
            if (m.play && m.list.length && !over) {
              var pm = m.list[0].m,
                gm = 0;
              if (jsGuide) {
                var rr = { guide: jsGuide, mv: {} };
                m.list.forEach(function (x) {
                  rr.mv[x.m] = x;
                });
                if (m.worst) rr.mv[m.worst.m] = { m: m.worst.m, s: m.worst.s, d: 0 };
                gm = guideChoose(rr, pm);
              }
              pm = gm || pickVar(m.list, pm);
              doMove(pm);
            }
          }
        } else if (m.t === 'tr') showTrain(m);
        else if (m.t === 'tv' && mode === 'train') {
          P = fromSt(m.st);
          last = { f: m.mv & 127, t: (m.mv >> 7) & 127 };
          flip = 0;
          trLive = m.label + ' ' + m.ply + '手目';

      /* --- 表記・棋譜 --- */
      function mvT(m, kif) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15;
        var nm = f === 81 ? NM[d] : NM[P.b[f] & 15],
          dis = '';
        if (f !== 81 && !kif) {
          dis = disamb(f, t);
          if (!pr && legal(P).indexOf(m | 16384) >= 0) dis += '不成';
        }
        return (
          FN[(t / 9) | 0] +
          RN[t % 9] +
          nm +
          dis +
          (pr ? '成' : '') +
          (f === 81 ? '打' : kif ? '(' + (((f / 9) | 0) + 1) + ((f % 9) + 1) + ')' : '')
        );
      }
      /* 同じ種類の駒が複数ある場合の区別: 直・右・左・上・引・寄 (先手後手それぞれ自分から見た向き) */
      function disamb(f, t) {
        var pc = P.b[f],
          black = pc >> 4 === 0,
          froms = [],
          tF = (t / 9) | 0,
          tR = t % 9;
        legal(P).forEach(function (x) {
          var xf = x & 127;
          if (xf < 81 && ((x >> 7) & 127) === t && P.b[xf] === pc && froms.indexOf(xf) < 0) froms.push(xf);
        });
        if (froms.length < 2) return '';
        var info = froms.map(function (x) {
          var xF = (x / 9) | 0,
            xR = x % 9;
          return { me: x === f, rs: black ? tF - xF : xF - tF, fw: black ? xR - tR : tR - xR };
        });
        var me = info.filter(function (o) {
            return o.me;
          })[0],
          others = info.filter(function (o) {
            return !o.me;
          });
        if (
          me.rs === 0 &&
          me.fw > 0 &&
          !others.some(function (o) {
            return o.rs === 0 && o.fw > 0;
          }) &&
          others.some(function (o) {
            return o.rs !== 0;
          })
        )
          return '直';
        var mov = me.fw > 0 ? '上' : me.fw < 0 ? '引' : '寄';
        var rights = others.filter(function (o) {
            return o.rs > me.rs;
          }).length,
          lefts = others.filter(function (o) {
            return o.rs < me.rs;
          }).length;
        var same = others.filter(function (o) {
          return o.rs === me.rs;
        }).length;
        var side = rights === 0 && lefts > 0 ? '右' : lefts === 0 && rights > 0 ? '左' : '';
        if (same === 0) return side || mov;
        return side + mov;
      }

      function engLabel() {

        if (YO.state === 'init' || YO.state === 'none') return '自作エンジン(やねうら王を準備中)';
        return '自作エンジン(やねうら王は使えません: ' + (YO.why || '理由不明') + ')';

      function exportKif() {
        var tot = [0, 0],
          f2 = function (n) {
            return String(n).padStart(2, '0');
          };
        var t =
          (startSfen ? '手合割：その他\n' : '手合割：平手\n') +
          '先手：' +
          (mode === 'vs' && human === 0 ? '人間' : 'AI') +
          '\n後手：' +
          (mode === 'vs' && human === 1 ? '人間' : 'AI') +
          '\n' +
          (startSfen ? bodText(startP) : '') +
          '手数----指手---------消費時間--\n';
        hist.forEach(function (h, i) {
          var sec = Math.round(h.t / 1000);
          tot[h.c] += sec;
          t +=
            String(i + 1).padStart(4, ' ') +
            ' ' +
            h.kif +
            '   (' +
            ((sec / 60) | 0) +
            ':' +
            f2(sec % 60) +
            '/' +
            f2((tot[h.c] / 3600) | 0) +
            ':' +
            f2(((tot[h.c] / 60) | 0) % 60) +
            ':' +
            f2(tot[h.c] % 60) +
            ')\n' +
            (h.inf ? '*' + h.inf + '\n' : '');
        });
        if (over && endKif) t += String(hist.length + 1).padStart(4, ' ') + ' ' + endKif + '\n' + endTxt + '\n';
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' }));
        a.download = 'shogi_' + Date.now() + '.kif';
        a.click();
      }

      /* --- 対局進行 --- */
      function newGame(sp) {
        g('res').hidden = true;
        mode = g('mode').value;
        sel = null;
        last = null;
        over = 0;
        endKif = '';
        hist = [];
        P = sp || newPos();
        startSfen = sp ? toSfen(P) : '';
        startP = clonePos(P);
        gid++;
        hKeys = [hashP(P)];
        hChk = [atk(P, P.k[P.side], P.side ^ 1) ? 1 : 0];
        lastInfo = '';
        curAn = null;
        manRec = 0;
        bkNote = '';
        stratLine = '';
        stratPick = '';
        stratOff = 0;
        stratBase = null;
        paused = 0;
        editing = 0;
        g('ed').hidden = true;
        g('info').hidden = false;
        var hs = g('side').value;
        human = hs === 'r' ? (Math.random() < 0.5 ? 0 : 1) : +hs;
        flip = mode === 'vs' && human === 1 ? 1 : 0;
        var t = g('tm').value;
        clk.on = mode === 'vs' && t !== 'n';
        clk.left = num('base') * 60000;
        clk.by = t === 'b' ? num('by') * 1000 : 0;
        clk.fi = t === 'b' ? num('fi') * 1000 : 0;
        g('cand').innerHTML = '';
        g('menu').hidden = true;
        renderBtns();
        g('evB').style.width = '50%';
        g('evT').textContent = '形勢';
        trainOn = 0;
        if (mode === 'train') {
          startTrain();
          render();
          return;
        }
        g('msg').textContent = mode === 'vs' ? 'あなたは' + (human ? '後手' : '先手') : '研究';
        next();
      }

      function sideN(c) {
        return c ? '後手' : '先手';
      }

      function finish(msg, winner, kw) {
        if (over) return;
        over = 1;
        gid++;
        endKif = kw;
        endTxt = 'まで' + hist.length + '手で' + (winner < 0 ? '引き分け' : sideN(winner) + 'の勝ち');
        g('msg').textContent = msg;
        var vs = mode === 'vs',
          el = g('res');
        el.className = winner < 0 ? 'draw' : vs ? (winner === human ? 'win' : 'lose') : 'win';
        el.innerHTML =
          (winner < 0
            ? '引き分け'
            : vs
              ? winner === human
                ? 'あなたの勝ち'
                : 'あなたの負け'
              : sideN(winner) + 'の勝ち') +
          '<small>' +
          msg +
          '(タップで閉じる)</small>';
        el.hidden = false;
        renderBtns();
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        yoStop();
      }

      function canDecl(c) {
        var b = P.b,
          kp = P.k[c],
          kr = kp % 9;
        if (c ? kr < 6 : kr > 2) return 0;
        if (atk(P, kp, c ^ 1)) return 0;
        var n = 0,
          pt = 0,
          t;
        for (var s2 = 0; s2 < 81; s2++) {
          var p = b[s2];
          if (p && p >> 4 === c && (p & 15) !== 8 && (c ? s2 % 9 >= 6 : s2 % 9 <= 2)) {
            n++;
            t = p & 15;
            pt += t === 6 || t === 7 || t === 14 || t === 15 ? 5 : 1;
          }
        }
        for (t = 1; t < 8; t++) pt += P.h[c][t] * (t === 6 || t === 7 ? 5 : 1);
        return n >= 10 && pt >= (c ? 27 : 28);
      }

      function declare() {
        if (!canPlay()) return;
        if (canDecl(P.side)) finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
        else g('msg').textContent = '入玉宣言の条件を満たしていません';
      }

      function judge() {
        var n = hKeys.length - 1,
          k = hKeys[n],
          cnt = 0,
          j0 = -1;
        for (var i = 0; i <= n; i++)
          if (hKeys[i] === k) {
            cnt++;
            if (j0 < 0) j0 = i;
          }
        if (cnt >= 4) {
          var r = cyc(hChk, n, j0),
            mover = P.side ^ 1;
          if (r === 1) finish('連続王手の千日手で' + sideN(mover) + 'の反則負け', P.side, '反則負け');
          else if (r === 2) finish('連続王手の千日手で' + sideN(P.side) + 'の反則負け', mover, '反則負け');
          else finish('千日手(引き分け)', -1, '千日手');
          return 1;
        }
        if (hist.length >= 512) {
          finish('512手で持将棋(引き分け)', -1, '持将棋');
          return 1;
        }
        return 0;
      }

      function next() {
        render();
        if (paused || editing) return;
        turnT0 = Date.now();
        curAn = null;
        manRec = 0;
        renderBtns();
        if (!legal(P).length) {
          finish('詰み(' + sideN(P.side) + 'の負け)', P.side ^ 1, '詰み');
          return;
        }
        if (mode === 'vs' && P.side !== human && canDecl(P.side)) {
          finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
          return;
        }
        if (mode === 'vs' && P.side !== human) think(1);
        else {
          clk.t0 = Date.now();
          think(0);
        }
      }

      function rankInfo(m) {
        if (!curAn) return '';
        var all = curAn.list,
          ix = -1,
          i,
          best,
          sc;
        for (i = 0; i < all.length; i++)
          if (all[i].m === m) {
            ix = i;
            break;
          }
        if (ix < 0 && curAn.all) {
          all = curAn.all;
          for (i = 0; i < all.length; i++)
            if (all[i].m === m) {
              ix = i;
              break;
            }
        }
        if (ix < 0 && curAn.worst && curAn.worst.m === m) return '最悪手';
        if (ix < 0) return '';
        best = all[0].s;
        sc = all[ix].s;
        return (
          ix + 1 + '位' + (Math.abs(sc) > 29000 || Math.abs(best) > 29000 ? '' : ' 最善比' + (sc - best) + 'cp')
        );
      }

      function doMove(m) {
        var inf = rankInfo(m),
          txt = (P.side ? '△' : '▲') + mvT(m),
          kif = mvT(m, 1),
          pc = P.side,
          el = Date.now() - turnT0,
          cap = make(P, m);
        if (bkNote) {
          inf = bkNote;
          bkNote = '';
        }
        if (clk.on && pc === human) clk.left = Math.max(0, clk.left - (Date.now() - clk.t0)) + clk.fi;
        hist.push({ m: m, cap: cap, kif: kif, txt: txt, c: pc, t: el, inf: inf });
        lastInfo = txt + (inf ? ' ' + inf : '');
        hKeys.push(hashP(P));
        hChk.push(atk(P, P.k[P.side], P.side ^ 1) ? 1 : 0);
        last = { f: m & 127, t: (m >> 7) & 127 };
        sel = null;
        g('msg').textContent = hist.length + '手目 ' + txt + (inf ? ' ' + inf : '');
        render();
        if (judge()) return;
        next();
      }

      function undoFor(c) {
        if (mode === 'train') return;
        var i = hist.length - 1;
        while (i >= 0 && hist[i].c !== c) i--;
        if (i < 0) return;
        while (hist.length > i) {
          var h = hist.pop();
          undo(P, h.m, h.cap);
        }
        hKeys.length = hist.length + 1;
        hChk.length = hist.length + 1;
        var l = hist[hist.length - 1];
        last = l ? { f: l.m & 127, t: (l.m >> 7) & 127 } : null;
        over = 0;
        endKif = '';
        sel = null;
        paused = 0;
        renderBtns();
        g('res').hidden = true;
        g('msg').textContent = l ? hist.length + '手目 ' + l.txt + (l.inf ? ' ' + l.inf : '') : '';
        lastInfo = l ? l.txt + (l.inf ? ' ' + l.inf : '') : '';
        next();
      }

      function resign(c) {
        if (mode === 'train') return;
        finish(sideN(c) + '投了', c ^ 1, '投了');
      }

      function renderBtns() {
        var h = '<button id="bNew">新規</button>',
          end = over || paused;
        if (mode === 'study') {
          [0, 1].forEach(function (c) {
            var m2 = c ? '☖' : '☗';
            h +=
              '<button data-a="u" data-c="' +
              c +
              '">' +
              m2 +
              '待った</button><button data-a="r" data-c="' +
              c +
              '">' +
              m2 +
              '投了</button>';
          });
          h += '<button data-a="d">宣言</button><button data-a="e">編集</button>';
        } else if (mode === 'vs') {
          h += '<button data-a="u" data-c="' + human + '">待った</button>';
          if (!end) {
            h +=
              '<button data-a="r" data-c="' +
              human +
              '">投了</button><button data-a="d">宣言</button><button data-a="p">中断</button>';
          } else
            h +=
              (paused ? '<button data-a="c">再開</button>' : '') +
              '<button data-a="s">研究へ</button><button data-a="e">編集</button>';
        } else if (mode === 'train') {
          h +=
            '<button id="bTr">' +
            (trainOn ? '⏸停止' : '▶再開') +
            '</button><button id="bTrR">学習リセット</button>';
        }
        if (mode !== 'train') h += '<button data-a="k">定跡</button>';
        h += '<button id="bMenu">☰</button>';
        g('btns').innerHTML = h;
      }

      function manOn() {
        return mode === 'vs' && g('manAI') && g('manAI').checked;
      }

      function canPlay() {
        return (
          !over && !paused && !editing && (mode === 'study' || (mode === 'vs' && (P.side === human || manOn())))
        );
      }

      /* --- 盤操作 --- */
      function mk(f, d) {
        var tg = {};
        legal(P).forEach(function (m) {
          if ((m & 127) === f && (f < 81 || m >> 15 === d)) {
            var t = (m >> 7) & 127;
            (tg[t] = tg[t] || []).push(m);
          }
        });
        return { f: f, d: d, tg: tg };
      }

      function clickSq(s) {
        if (editing) {
          editClick(s);
          return;
        }
        if (!canPlay()) return;
        var p = P.b[s];
        if (sel && sel.tg[s]) {
          var mm = sel.tg[s];
          if (mm.length > 1) {
            g('ask').hidden = false;
            g('aY').onclick = function () {
              g('ask').hidden = true;
              doMove(mm[0] & 16384 ? mm[0] : mm[1]);
            };
            g('aN').onclick = function () {
              g('ask').hidden = true;
              doMove(mm[0] & 16384 ? mm[1] : mm[0]);
            };
          } else doMove(mm[0]);
          return;
        }
        sel = p && p >> 4 === P.side ? mk(s, 0) : null;
        render();
      }

      function clickHand(c, d) {
        if (editing) {
          editHand(c, d);
          return;
        }
        if (!canPlay() || c !== P.side) return;
        sel = mk(81, d);
        render();
      }

      function render() {
        bkcPaint();
        var bd = g('board');
        if (!bd.firstChild) {
          for (var i = 0; i < 81; i++) {
            var d = document.createElement('div');
            d.className = 'cell';
            bd.appendChild(d);
          }
          bd.onclick = function (e) {
            var c = e.target.closest('.cell');
            if (c) clickSq(+c.dataset.s);
          };
          ['h0', 'h1'].forEach(function (id) {
            g(id).onclick = function (e) {
              var s = e.target.closest('.hp'),
                row = id === 'h0' ? 0 : 1;
              if (editing) {
                editHand(flip ? row : 1 - row, s ? +s.dataset.t : 0);
                return;
              }
              if (s) clickHand(+s.dataset.c, +s.dataset.t);
            };
          });
        }
        for (var k = 0; k < 81; k++) {
          var r = flip ? 8 - ((k / 9) | 0) : (k / 9) | 0,
            f = flip ? k % 9 : 8 - (k % 9),
            s = f * 9 + r,
            p = P.b[s],
            el = bd.children[k];
          el.dataset.s = s;
          el.className =
            'cell' +
            (p && p >> 4 ? ' w' : '') +
            ((p & 15) > 8 ? ' pr' : '') +
            (last && (last.t === s || last.f === s) ? ' lm' : '') +
            (sel && sel.f === s ? ' sl' : '') +
            (sel && sel.tg[s] ? ' tg' : '');
          el.innerHTML = p ? '<span>' + NM[p & 15] + '</span>' : '';
        }
        [0, 1].forEach(function (row) {
          var c = flip ? row : 1 - row,
            h = '';
          for (var t = 7; t >= 1; t--) {
            var n = P.h[c][t];
            if (n)
              h +=
                '<span class="hp' +
                (sel && sel.f === 81 && sel.d === t && c === (editing ? sel.c : P.side) ? ' sl' : '') +
                '" data-c="' +
                c +
                '" data-t="' +
                t +
                '">' +
                NM[t] +
                (n > 1 ? n : '') +
                '</span>';
          }
          g('h' + row).innerHTML = (c ? '△' : '▲') + h;
        });
      }

      function fmtT(ms) {
        var s = Math.ceil(ms / 1000);
        return ((s / 60) | 0) + ':' + String(s % 60).padStart(2, '0');
      }
      setInterval(function () {
        if (!clk.on || over || mode !== 'vs') {
          g('clk').textContent = '';
          return;
        }
        if (P.side !== human) {
          g('clk').textContent = '持ち ' + fmtT(clk.left);
          return;
        }
        var rem = clk.left - (Date.now() - clk.t0);
        if (rem > 0) {
          g('clk').textContent = '持ち ' + fmtT(rem);
          return;
        }
        var b = clk.by + rem;
        if (b <= 0) {
          finish('時間切れ', human ^ 1, '切れ負け');
          g('clk').textContent = '0:00';
          return;
        }
        g('clk').textContent = '秒読み ' + Math.ceil(b / 1000);
      }, 100);

      /* --- AI学習 --- */
      function paintTrain() {
        g('cand').innerHTML = '<div>' + trLive + '</div>' + trStat;
      }

      function startTrain() {
        yoStop();
        ensureJsNet();
        trainOn = 1;
        trStat = '';
        trLive = '自己対局を開始します…';
        paintTrain();
        renderBtns();
        send({ cmd: 'train', id: gid, lw: Array.from(LWS), dep: num('trD'), vms: num('trV'), lr: num('trL') });
      }

      function showTrain(m) {
        LWS = Float64Array.from(m.lw);
        try {
          localStorage.setItem('shogiLW', JSON.stringify(m.lw));
        } catch (e) {}
        g('bar').firstChild.style.width = m.rate * 100 + '%';
        var n = m.mw + m.md + m.ml;
        trStat =
          '<div>' +
          m.g +
          '局完了 / 対学習前: ' +
          m.mw +
          '勝 ' +
          m.md +
          '分 ' +
          m.ml +
          '敗 (' +
          n +
          '局)</div>' +
          '<div>勝率 ' +
          Math.round(m.rate * 100) +
          '% (推定 Elo差 ' +
          (m.elo > 0 ? '+' : '') +
          m.elo +
          ') ※上のバー=勝率</div>';
        paintTrain();
      }

      /* ===== 自陣の形(戦法)の目標 =====
               駒+マスを、先手から見て優先順に並べる。後手は180度回して反転する。
               書き方: P7f P76 歩76 +B22 馬22 成香1d (駒は P L N S G B R K(小文字も可)または漢字、成り駒は +P +L +N +S +B +R または と 成香 成桂 成銀 馬 龍) */
      var STRATS = {
        矢倉: 'P7f S7g G7h G6g B7i K8h',
        美濃囲い: 'K2h S3h G4i G5h',
        穴熊: 'P7f B7g S8h G7h L9h K9i',
        四間飛車: 'P7f R6h K2h S3h G5h',
        三間飛車: 'P7f R7h K2h S3h G5h',
        中飛車: 'P5f R5h K2h S3h',
        '振り飛車(おまかせ)': '',
        棒銀: 'P2e S2f',
        早石田: 'P7f P7e R7h',
        嬉野流: 'S6h B7i G7h S4h P3f S3g S2f'
      };
      var PTYPE = { p: 1, l: 2, n: 3, s: 4, g: 5, b: 6, r: 7, k: 8 };
      var PPROM = { p: 9, l: 10, n: 11, s: 12, b: 14, r: 15 };
      var PKANJI = [
        ['成香', 10],
        ['成桂', 11],
        ['成銀', 12],
        ['歩', 1],
        ['香', 2],
        ['桂', 3],
        ['銀', 4],
        ['金', 5],
        ['角', 6],
        ['飛', 7],
        ['玉', 8],
        ['王', 8],
        ['と', 9],
        ['杏', 10],
        ['圭', 11],
        ['全', 12],
        ['馬', 14],
        ['龍', 15],
        ['竜', 15]
      ];

      function goalCol(ch) {
        var i = '123456789'.indexOf(ch);
        return i >= 0 ? i : '１２３４５６７８９'.indexOf(ch);
      }

      function goalRow(ch) {
        var i = 'abcdefghi'.indexOf(ch.toLowerCase());
        if (i < 0) i = '123456789'.indexOf(ch);
        if (i < 0) i = '１２３４５６７８９'.indexOf(ch);
        if (i < 0) i = '一二三四五六七八九'.indexOf(ch);
        return i;
      }
      /* 1つの指定(例 p7f / p76 / 歩76 / +b22 / 成香1d)を { t: 駒の種類, sq: マス } に変換。解釈できなければ null */
      function parseGoalTok(tk) {
        var t = 0,
          rest = tk,
          mm = /^(\+?)([plnsgbrk])/i.exec(tk),
          i;
        if (mm) {
          var ch = mm[2].toLowerCase();
          t = mm[1] ? PPROM[ch] || 0 : PTYPE[ch];
          rest = tk.slice(mm[0].length);
        } else {
          for (i = 0; i < PKANJI.length; i++)
            if (tk.indexOf(PKANJI[i][0]) === 0) {
              t = PKANJI[i][1];
              rest = tk.slice(PKANJI[i][0].length);
              break;
            }
        }
        if (!t || rest.length !== 2) return null;
        var f = goalCol(rest.charAt(0)),
          r = goalRow(rest.charAt(1));
        if (f < 0 || r < 0) return null;
        return { t: t, sq: f * 9 + r };
      }

      function parseGoals(str, col) {
        var out = [],
          bad = [];
        str
          .trim()
          .split(/[\s,、]+/)
          .forEach(function (tk) {
            if (!tk) return;
            var o = parseGoalTok(tk);
            if (!o) {
              bad.push(tk);
              return;
            }
            out.push({ t: o.t, bt: o.t > 8 ? o.t - 8 : o.t, sq: col ? 80 - o.sq : o.sq, col: col, lab: tk });
          });
        out.bad = bad;
        return out;
      }

      function goalDone(gl) {
        return P.b[gl.sq] === (gl.t | (gl.col << 4));
      }

      function cheb(a, b) {
        return Math.max(Math.abs(((a / 9) | 0) - ((b / 9) | 0)), Math.abs((a % 9) - (b % 9)));
      }

      function guideMoves(goals) {
        var out = [],
          why = [],
          used = {},
          ls = legal(P);
        goals.forEach(function (gl) {
          if (goalDone(gl)) used[gl.sq] = 1;
        });
        goals.forEach(function (gl, gi) {
          if (goalDone(gl)) return;
          /* 目標ごとに「いちばん近い同種の駒」を1枚だけ割り当てる(別の駒を動かさない)。成り駒が目標のときは、成る前の駒も対象 */
          var pb = -1,
            bd = 1e9,
            q,
            cnt = 0;
          for (q = 0; q < 81; q++) {
            var pq = P.b[q];
            if (used[q] || !pq || pq >> 4 !== gl.col) continue;
            var tq = pq & 15;
            if (tq !== gl.t && !(gl.t > 8 && tq === gl.bt)) continue;
            var d = cheb(q, gl.sq) * 10 + Math.abs(((q / 9) | 0) - ((gl.sq / 9) | 0));
            if (d < bd) {
              bd = d;
              pb = q;
            }
          }
          if (pb < 0) {
            why.push(gl.lab + '(動かせる駒がない)');
            return;
          }
          used[pb] = 1;
          var already = (P.b[pb] & 15) > 8;
          ls.forEach(function (m) {
            var t = (m >> 7) & 127,
              pr = (m >> 14) & 1;
            if ((m & 127) !== pb) return;
            /* 成る手は、成り駒が目標で、まだ成っていない駒のときだけ使う */
            if (pr && !(gl.t > 8 && !already)) return;
            if (!pr && gl.t > 8 && !already && t === gl.sq && ls.indexOf(m | 16384) >= 0) return;
            if (t === gl.sq || cheb(t, gl.sq) < cheb(pb, gl.sq)) {
              out.push({ m: m, gi: gi, hit: t === gl.sq });
              cnt++;
            }
          });
          if (!cnt) why.push(gl.lab + '(塞がれていて近づけない)');
        });
        out.sort(function (a, b) {
          return a.gi - b.gi || b.hit - a.hit;
        });
        return { out: out, why: why };
      }

      function setStratLine(gd) {
        stratLine = gd ? '【目標: ' + gd.name + ' ' + gd.prog + (gd.note ? ' / ' + gd.note : '') + '】' : '';
      }

      function stratGuide() {
        var name = g('strat').value;
        if (!name || mode !== 'vs' || P.side === human) return null;
        var str = name === '自作' ? g('stratC').value : STRATS[name];
        if (name === '振り飛車(おまかせ)') {
          if (!stratPick) stratPick = ['四間飛車', '三間飛車', '中飛車'][(Math.random() * 3) | 0];
          str = STRATS[stratPick];
          name = '振り飛車→' + stratPick;
        }
        /* 崩れたら断念: 銀・金・角・飛を取られた(持駒を含めて数が減った)場合は、この対局では目指さない */
        var cnt = { 4: 0, 5: 0, 6: 0, 7: 0 },
          q,
          c = P.side;
        for (q = 0; q < 81; q++) {
          var pc = P.b[q];
          if (pc && pc >> 4 === c) {
            var ty = (pc & 15) > 8 ? (pc & 15) - 8 : pc & 15;
            if (cnt[ty] !== undefined) cnt[ty]++;
          }
        }
        for (q = 4; q < 8; q++) cnt[q] += P.h[c][q];
        if (!stratBase) stratBase = cnt;
        else for (q = 4; q < 8; q++) if (cnt[q] < stratBase[q]) stratOff = 1;
        var goals = parseGoals(str || '', c),
          done = goals.filter(goalDone).length,
          prog = done + '/' + goals.length,
          badTxt = goals.bad.length ? ' 解釈できない指定: ' + goals.bad.join(' ') : '';
        if (!goals.length)
          return {
            cands: [],
            name: name,
            prog: prog,
            note: '目標が書かれていません(例: P7f R6h K2h / 歩76 / 成香1d)' + badTxt
          };
        if (stratOff) return { cands: [], name: name, prog: prog, note: '断念(駒を取られた/形勢が悪い)' };
        if (done >= goals.length) return { cands: [], name: name, prog: prog, note: '完成' };
        if (hist.length > 48) return { cands: [], name: name, prog: prog, note: '手数が進んだため終了' };
        var gm = guideMoves(goals);
        return {
          cands: gm.out,
          name: name,
          prog: prog,
          note:
            (gm.why.length
              ? (gm.out.length ? '今は動かせない(他の駒を先に動かします): ' : '目指せない: ') + gm.why.join(' ')
              : '') + badTxt
        };
      }
      /* 戦法の手を採用するか判断する。採用しない場合は理由を表示して 0 を返す */
      function guideChoose(r, eb) {
        var gd = r.guide;
        if (!gd.cands.length) return 0;
        var bs = -1e9,
          k;
        for (k in r.mv) if (r.mv[k].s > bs) bs = r.mv[k].s;
        var inChk = atk(P, P.k[P.side], P.side ^ 1),
          cap = P.b[(eb >> 7) & 127] !== 0,
          tol = bs >= 0 ? 150 : 60;
        if (bs < -200) {
          stratOff = 1;
          gd.note = '断念(形勢が悪い)';
          setStratLine(gd);
          return 0;
        }
        if (cap || inChk || bs < -100) {
          gd.note = '今は最善手を優先(取り合い・王手・形勢)';
          setStratLine(gd);
          return 0;
        }
        for (var gi = 0; gi < gd.cands.length; gi++) {
          var e = r.mv[gd.cands[gi].m];
          if (e && e.s >= bs - tol) {
            return gd.cands[gi].m;
          }
        }
        gd.note = '評価が下がるため見送り(最善手を指します)';
        setStratLine(gd);
        return 0;
      }

      /* ===== 中断・研究へ・局面編集 ===== */

      function toSfen(Q) {
        var L = ['', 'P', 'L', 'N', 'S', 'G', 'B', 'R', 'K'],
          rows = [],
          hs = '';
        for (var r = 0; r < 9; r++) {
          var row = '',
            e = 0;
          for (var f = 8; f >= 0; f--) {
            var p = Q.b[f * 9 + r];
            if (!p) {
              e++;
              continue;
            }
            if (e) {
              row += e;
              e = 0;
            }
            var t = p & 15,
              pro = t > 8,
              ch = L[pro ? t - 8 : t];
            row += (pro ? '+' : '') + (p >> 4 ? ch.toLowerCase() : ch);
          }
          if (e) row += e;
          rows.push(row);
        }
        [0, 1].forEach(function (c) {
          [7, 6, 5, 4, 3, 2, 1].forEach(function (t) {
            var n = Q.h[c][t];
            if (n) hs += (n > 1 ? n : '') + (c ? L[t].toLowerCase() : L[t]);
          });
        });
        return rows.join('/') + ' ' + (Q.side ? 'w' : 'b') + ' ' + (hs || '-') + ' 1';
      }

      function bodText(Q) {
        var K = [
          '',
          '',
          '二',
          '三',
          '四',
          '五',
          '六',
          '七',
          '八',
          '九',
          '十',
          '十一',
          '十二',
          '十三',
          '十四',
          '十五',
          '十六',
          '十七',
          '十八'
        ];
        var hs = function (c) {
          var x = '';
          [7, 6, 5, 4, 3, 2, 1].forEach(function (t) {
            var n = Q.h[c][t];
            if (n) x += NM[t] + K[n] + ' ';
          });
          return x.trim() || 'なし';
        };
        var t = '後手の持駒：' + hs(1) + '\n  ９ ８ ７ ６ ５ ４ ３ ２ １\n+---------------------------+\n';
        for (var r = 0; r < 9; r++) {
          var row = '|';
          for (var f = 8; f >= 0; f--) {
            var p = Q.b[f * 9 + r];
            row += p ? (p >> 4 ? 'v' : ' ') + NM[p & 15] : ' ・';
          }
          t += row + '|' + RN[r] + '\n';
        }
        return t + '+---------------------------+\n先手の持駒：' + hs(0) + '\n' + (Q.side ? '後手番\n' : '');
      }

      function startEdit() {
