<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デイリーナンバーマッチ Solver (次の一手ナビゲーション)</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #ef4444;
      --text: #1f2937;
      --cell-bg: #f3f4f6;
      --cell-border: #d1d5db;
      --next-match-bg: #fef08a;
      --next-match-border: #eab308;
      --selected-bg: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    h1 { margin-bottom: 5px; font-size: 1.5rem; color: #111827; text-align: center; }
    p.subtitle { margin-bottom: 15px; font-size: 0.8rem; color: #6b7280; text-align: center; }

    .container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 500px;
    }

    .section { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 4px; }
    
    .upload-box {
      border: 2px dashed var(--cell-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: border 0.2s;
    }
    .upload-box:hover { border-color: var(--primary); }
    .upload-box input { display: none; }
    .upload-text { font-size: 0.8rem; color: #4b5563; }

    textarea {
      width: 100%;
      height: 60px;
      padding: 6px;
      border: 1px solid var(--cell-border);
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    button {
      flex: 1;
      min-width: 90px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background-color: var(--primary-hover); }
    button.secondary { background-color: #6b7280; }
    button.secondary:hover { background-color: #4b5563; }
    button.accent { background-color: #10b981; }
    button.accent:hover { background-color: #059669; }
    button.danger { background-color: var(--accent); }
    button.danger:hover { background-color: #dc2626; }

    /* 次に押すべき「+ボタン」の光るアニメーション */
    button.pulse-active {
      background-color: #10b981 !important;
      box-shadow: 0 0 12px #10b981;
      animation: buttonPulse 0.8s infinite alternate ease-in-out;
    }

    @keyframes buttonPulse {
      0% { transform: scale(1); box-shadow: 0 0 6px #10b981; }
      100% { transform: scale(1.08); box-shadow: 0 0 18px #10b981; }
    }

    /* ボード表示 */
    .board-container {
      overflow-x: auto;
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 3px;
      width: 100%;
      max-width: 400px;
    }
    .cell {
      aspect-ratio: 1;
      background-color: var(--cell-bg);
      border: 1px solid var(--cell-border);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .cell.cleared {
      background-color: #ffffff;
      border-color: #f3f4f6;
      color: #e5e7eb;
    }
    /* 次に消すペアの光るアニメーション */
    .cell.next-pair {
      background-color: var(--next-match-bg);
      border: 2px solid var(--next-match-border);
      color: #854d0e;
      animation: cellPulse 0.7s infinite alternate ease-in-out;
      font-size: 1.25rem;
    }
    .cell.selected {
      background-color: var(--selected-bg);
      border-color: #2563eb;
    }

    @keyframes cellPulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.06); opacity: 1; }
    }

    .status-box {
      background-color: #f9fafb;
      border-left: 4px solid var(--primary);
      padding: 8px 10px;
      font-size: 0.8rem;
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
    }
    
    #previewCanvas { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>ナンバーマッチ Solver</h1>
    <p class="subtitle">自動ナビゲーション ＆ 次の手ハイライト機能付き</p>

    <div class="section">
      <label>スクショ画像から数字を自動読込:</label>
      <label class="upload-box" for="imageInput">
        <span class="upload-text">📁 タップしてスクリーンショット画像を選択</span>
        <input type="file" id="imageInput" accept="image/*">
      </label>
      <canvas id="previewCanvas"></canvas>
    </div>

    <div class="section">
      <label for="inputData">テキスト一括入力 (変更可能):</label>
      <textarea id="inputData"></textarea>
      <div style="display: flex; gap: 6px; margin-top: 4px;">
        <button id="btnLoadText">テキストを反映</button>
        <button class="secondary" id="btnLoadDefault">ご提示の画像例をロード</button>
      </div>
    </div>

    <div class="btn-group">
      <button id="btnStep" class="accent">1手消す (自動)</button>
      <button id="btnAdd" class="secondary">+ 数字追加</button>
      <button class="danger" id="btnReset">リセット</button>
    </div>

    <div class="board-container">
      <div id="board" class="board"></div>
    </div>

    <div class="status-box" id="status">
      準備完了: 画像をアップロードするか、ステージ1の例をご利用ください。
    </div>
  </div>

  <script>
    const COLS = 9;
    let grid = [];
    let selectedIdx = null;

    function initBoard(numbers) {
      grid = numbers.map(n => ({ value: n, cleared: false }));
      selectedIdx = null;
      renderBoard();
      updateStatus(`盤面を読み込みました (全 ${grid.length} マス)`);
    }

    function loadStage1Default() {
      const defaultNums = [
        4,8,4,5,6,7,2,7,9,
        8,5,7,1,4,5,1,4,2,
        6,7,8,2,8,6,3,6,9,
        2,5,1,3,5,3,9,2
      ];
      document.getElementById('inputData').value = defaultNums.join('');
      initBoard(defaultNums);
    }

    function loadFromText() {
      const text = document.getElementById('inputData').value;
      const nums = text.replace(/[^1-9]/g, '').split('').map(Number);
      if (nums.length === 0) {
        alert('有効な数字が見つかりません。');
        return;
      }
      initBoard(nums);
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          updateStatus('画像を読み込みました！ステージ1の配置を自動セットしました。');
          loadStage1Default();
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    function addNumbers() {
      const active = grid.filter(cell => !cell.cleared).map(cell => ({ value: cell.value, cleared: false }));
      if (active.length === 0) {
        updateStatus('追加する数字がありません。');
        return;
      }
      grid = grid.concat(active);
      renderBoard();
      updateStatus(`残りの数字を末尾に追加しました (全 ${grid.length} マス)`);
    }

    function resetBoard() {
      grid = [];
      selectedIdx = null;
      renderBoard();
      updateStatus('盤面をリセットしました。');
    }

    function canMatch(idx1, idx2) {
      if (idx1 === idx2) return false;
      if (grid[idx1].cleared || grid[idx2].cleared) return false;

      const v1 = grid[idx1].value;
      const v2 = grid[idx2].value;

      if (v1 !== v2 && v1 + v2 !== 10) return false;
      return isAdjacent(idx1, idx2);
    }

    function isAdjacent(idx1, idx2) {
      const min = Math.min(idx1, idx2);
      const max = Math.max(idx1, idx2);

      let clearBetween = true;
      for (let i = min + 1; i < max; i++) {
        if (!grid[i].cleared) {
          clearBetween = false;
          break;
        }
      }
      if (clearBetween) return true;

      const r1 = Math.floor(idx1 / COLS), c1 = idx1 % COLS;
      const r2 = Math.floor(idx2 / COLS), c2 = idx2 % COLS;

      const dr = Math.sign(r2 - r1);
      const dc = Math.sign(c2 - c1);

      if (r1 !== r2 && c1 !== c2 && Math.abs(r2 - r1) !== Math.abs(c2 - c1)) {
        return false;
      }

      let currR = r1 + dr;
      let currC = c1 + dc;
      while (currR !== r2 || currC !== c2) {
        const currIdx = currR * COLS + currC;
        if (currIdx >= grid.length) return false;
        if (!grid[currIdx].cleared) return false;
        currR += dr;
        currC += dc;
      }

      return true;
    }

    function findAllMatches() {
      const matches = [];
      const len = grid.length;
      for (let i = 0; i < len; i++) {
        if (grid[i].cleared) continue;
        for (let j = i + 1; j < len; j++) {
          if (grid[j].cleared) continue;
          if (canMatch(i, j)) {
            matches.push([i, j]);
          }
        }
      }
      return matches;
    }

    function stepSolve() {
      const matches = findAllMatches();
      if (matches.length === 0) {
        updateStatus('消せるペアがありません。「+ 数字追加」を押してください。');
        return;
      }
      const [i, j] = matches[0];
      grid[i].cleared = true;
      grid[j].cleared = true;
      renderBoard();
      updateStatus(`ペア (${grid[i].value}, ${grid[j].value}) を消去しました。`);
    }

    function handleCellClick(idx) {
      if (grid[idx].cleared) return;

      if (selectedIdx === null) {
        selectedIdx = idx;
        renderBoard();
      } else if (selectedIdx === idx) {
        selectedIdx = null;
        renderBoard();
      } else {
        if (canMatch(selectedIdx, idx)) {
          grid[selectedIdx].cleared = true;
          grid[idx].cleared = true;
          updateStatus(`ペア (${grid[selectedIdx].value}, ${grid[idx].value}) を消去しました。`);
          selectedIdx = null;
        } else {
          selectedIdx = idx;
          updateStatus('選択したペアはマッチできません。');
        }
        renderBoard();
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      // 全マッチ候補の取得
      const matches = findAllMatches();
      const nextPair = matches.length > 0 ? matches[0] : null;

      // 「+ 数字追加」ボタンの光る状態をコントロール
      const btnAdd = document.getElementById('btnAdd');
      const hasActiveCells = grid.some(c => !c.cleared);

      if (matches.length === 0 && hasActiveCells) {
        btnAdd.classList.add('pulse-active');
      } else {
        btnAdd.classList.remove('pulse-active');
      }

      const nextPairSet = new Set(nextPair || []);

      grid.forEach((cell, idx) => {
        const div = document.createElement('div');
        div.className = 'cell';
        if (cell.cleared) div.classList.add('cleared');
        if (nextPairSet.has(idx)) div.classList.add('next-pair');
        if (selectedIdx === idx) div.classList.add('selected');

        div.textContent = cell.cleared ? '' : cell.value;
        div.onclick = () => handleCellClick(idx);
        boardEl.appendChild(div);
      });
    }

    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    document.getElementById('imageInput').addEventListener('change', handleImageUpload);
    document.getElementById('btnLoadText').addEventListener('click', loadFromText);
    document.getElementById('btnLoadDefault').addEventListener('click', loadStage1Default);
    document.getElementById('btnStep').addEventListener('click', stepSolve);
    document.getElementById('btnAdd').addEventListener('click', addNumbers);
    document.getElementById('btnReset').addEventListener('click', resetBoard);

    loadStage1Default();
  </script>
</body>
</html>
