<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8" />
    <title>Solo > cartpole | AI Creator Battle</title>
    <link rel="stylesheet" href="https://mathotagamma.github.io/statics/main-style.css" />
    
    <link rel="stylesheet" href="https://mathotagamma.github.io/ai-creator-battle/header-template-style.css" />
    
    <script type="module" src="https://mathotagamma.github.io/statics/main-script.js"></script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .top-area {
        flex-grow: 1;
        position: relative;
      }
      
      #alert-div {
        position: absolute;
        top: 10px;
        left: 7px;
        font-weight: bold;
        color: red;
        border: 1px solid grey;
        display: inline-block;
        padding: 2px;
        margin: 10px;
      }

      #btn-container {
        margin: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        background: white;
        border: 1px solid black;
        border-radius: 10px;
        min-width: 200px;
        min-height: 75px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="header-container"></div>
    <main>
      <div class="top-area">
        <div id="alert-div">
          Google Driveに接続中です。しばらくお待ちください。
        </div>
      </div>
      <div class="dock-bottom-area" data-height="150px">
        <div class="dock-bottom-bar"></div>
        <div class="dock-content">
          
        </div>
      </div>
    </main>

    <script type="module">
      import { createHeader } from 'https://mathotagamma.github.io/ai-creator-battle/header-template-script.js';
      import { DriveManager, mergeMissingKeys } from 'https://mathotagamma.github.io/ai-creator-battle/drive-manager.js';

      const alertDiv = document.getElementById('alert-div');
      const btnContainer = document.getElementById('btn-container');

      let hasDriveConnection = false;
      let entirelyLayersInfo = null;
      let userUsableInfo = null;

      /*
        initializing...initを実行中
        exit...退出した。(リロード、退出待ち)
        drawing...描画中
        usually...通常
      */
      let status = "initializing";
      const appDataDirectory = '/application-data/ai-creator-battle/';

      function logger(message, _) {
        console.log(message);
      }

      const driveManager = new DriveManager({
        clientId: '673216051028-hjomu6c8livrv4ga0c0f37o3i3qt0dso.apps.googleusercontent.com',
        redirectUri: 'https://mathotagamma.github.io/statics/drive-api/oauth2callback',
        appDataDirectory,
        onLog: (message, duration) => logger(message, duration),
        onLoginWithAnotherEmail: (prevEmail, newEmail) => {
          alert(`以前とは異なるアカウントでログインしました(前回:${prevEmail})。\nホームに戻ります。`);
          location.href = '../';
        },
      });

      // ===== Headerテンプレートを組み込み =====
      // onSignIn/onSignOut/onCheckがthrowすれば、Header側が自動で
      // 「進行中 -> 失敗しました」のステータス表示に切り替えてくれる。
      const header = createHeader({
        title: 'Solo &gt; cartpole | AI Creator Battle',
        drive: {
          onCheck: async () => {
            return driveManager.checker();
          },
          onSignIn: async () => {
            const ok = await driveManager.init();
            hasDriveConnection = driveManager.checker().ok;
            // init()がfalseを返した(=失敗した)場合は明示的にthrowして
            // Header側に「失敗しました」を表示させる。
            if (!ok)
              throw new Error('Google連携に失敗しました。');
          },
          onSignOut: async () => {
            const ok = await driveManager.signOut();
            hasDriveConnection = false;
            if (!ok)
              throw new Error('Sign Outに失敗しました。');
          },
          getUserInfo: async () => {
            const checkStatus = driveManager.checker();
            if (!checkStatus.ok)
              return null;
            const res = await driveManager.getAbout('user(displayName, photoLink)');
            if (res == null)
              return null;
            return {
              displayName: res.user.displayName,
              photoLink: res.user.photoLink
            };
          }
        }
      });
      document.getElementById('header-container').appendChild(header.element);

      async function init() {
        header.setStatus('Google Driveに接続中...', 'progress');

        await driveManager.init();

        // Header側のユーザー情報表示も同期
        await header.updateGoogleUI();

        const ok = await driveConnect();

        if (!ok) {
          header.setStatus('接続できませんでした。', 'error');
          status = "exit";
          return;
        }

        header.setStatus('接続しました。', 'success');
        status = "drawing";

        alertDiv.innerHTML = 'Driveに接続しました。ページの描画中...';

        alertDiv.style.color = "black";
      }

      async function driveConnect() {
        if (status === "exit")
          return;
        alertDiv.innerHTML = 'Google Driveとの接続状況を取得中です。';
        hasDriveConnection = await driveManager.checker().ok;

        if (!hasDriveConnection) {
          alert('Google Driveと連携できませんでした。再度お試しください。');
          alertDiv.innerHTML = 'Google Driveに接続できませんでした。<br>ページのリロードをお試しください。';
          status = "exit";
          return false;
        }
        let ok = false;

        alertDiv.innerHTML = 'Google Driveからアプリデータ内ファイルを取得中。しばらくお待ち下さい。';
        entirelyLayersInfo = await driveManager.getFile({
          path: 'entirely-layers-info.json',
          type: 'json'
        });
        ok = entirelyLayersInfo != null;
        if (ok) {
          userUsableInfo = await driveManager.getFile({
            path: 'user-usable-info.json',
            type: 'json'
          });
          ok = userUsableInfo != null;
        }

        if (!ok) {
          if (confirm('Google Driveに、必要なデータが構築されていません。一度、「モデルを編集」ページを訪れる必要があります。\nページを移動しますか？'))
            window.location.href = '../model-editor/';
          alertDiv.innerHTML = 'Google Driveに、必要なデータが構築されていません。<br>一度、「モデルを編集」ページを訪れる必要があります。<br><a href="../model-editor/">モデルを編集</a>';
          status = "exit";
          return false;
        }
        alertDiv.innerHTML = 'Google Driveに正常に接続できました。<br>AIを実行するゲームを選んでください。';
        // OK
        return true;
      }

      init();
    </script>
  </body>

</html>
