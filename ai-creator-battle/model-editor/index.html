<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Model Editor | AI Creator Battle</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        overflow:hidden;
        touch-action: none;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: row;
      }
      main {
        display: flex;
        width: 100%;
        flex-direction: row;
        border: 1px solid black;
        flex: 1;
      }
      .dock-content {
        min-width: 100px;
      }
      .right-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .layers-screen {
        flex: 1;
      }
      .layer-editor {
        flex: 1;
        border-top: 1px solid black;
      }
    </style>
    <link rel="stylesheet" href="/statics/main-style.css" />
  </head>
  <body>
    <header>
      <nav class="breadcrumb"></nav>
      <div class="font-size-L">AI Creator Battle</div>
    </header>
    <main>
      <div class="dock-left-area" data-min-width="150px" data-toggle-square="false">
        <div class="dock-content">
          <select id="game-select">
            <option value="cartpole">カートポール</option>
            <!--<option value="breakout">ブロック崩し</option>-->
          </select>
        </div>
        <div class="dock-left-bar"></div>
      </div>
      <div class="right-area">
        <div class="layers-screen">
          
        </div>
        <div class="layer-editor">
          <select id="layer-select"></select>
        </div>
      </div>
    </main>
    <script>
      const gameSelect = document.getElementById('game-select');
      const layerSelect = document.getElementById('layer-select');

      let gameKind;

      gameSelect.addEventListener('change', (e) => {
        gameKind = e.target.value;
        alert(gameKind);
      });

      function init() {
        gameKind = gameSelect.value;
      }
      init();
    </script>
    <script src="/statics/main-script.js"></script>
  </body>
</html>
