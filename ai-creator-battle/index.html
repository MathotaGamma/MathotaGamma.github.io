<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>AI Creator Battle</title>
    <style>
      html {
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 10px;
      }
      .btn-container {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
      }
      button {
        background: white;
        border: 1px solid black;
        border-radius: 10px;
        min-width: 200px;
        min-height: 75px;
        font-size: 20dp;
      }
    </style>
    <script type="module" src="/statics/main-script.js"></script>
    <link rel="stylesheet" href="/statics/main-style.css" />
  </head>
  <body>
    <nav class="breadcrumb"></nav>
    <h1>AI Creator Battle</h1>
    <p>
      AI Creator Battleへようこそ！ここでは、あなたがカスタマイズしたAIと相手のAIを激突させることができます。
    </p>
    <p>
      「AIに興味があるけど何も知らない...」「AIについては人より知っていると思う」AI好きで、初学者から上級者まで全ての方が楽しんでAIを作れるサイトを目指しました。
    </p>
    <p>
      学習率、エポック数、モデルの深さ――。あなたの調整次第で、AIは最強の戦士にも、ただの形骸にも変わります。
    </p>
    <div class="btn-container">
      <button class="font-size-L" onclick="window.location.href = './model-editor/';">モデル編集</button>
      <button class="font-size-L" onclick="window.location.href = './solo/';">一人で遊ぶ</button>
      <button class="font-size-L" onclick="window.location.href = './online/';">オンラインで遊ぶ</button>
    </div>
  </body>
</html>
