<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Model Editor | AI Creator Battle</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        overflow:hidden;
        touch-action: none;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: row;
      }
      main {
        display: flex;
        width: 100%;
        flex-direction: column;
        border: 1px solid black;
        flex: 1;
      }
      .main-header {
        displey: flex;
        width: 100%;
        height: auto;
        flex-direction: row;
      }
      .editor-screen {
        display: flex; width: 100%;
        flex-direction: row;
        border-top: 1px solid black;
        flex: 1;
      }
      .right-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .layers-screen {
        height: auto;
        display: flex;
        flex-direction: row;
      }
      .layer-editor {
        flex: 1;
        border-top: 1px solid black;
      }
    </style>
    <link rel="stylesheet" href="/statics/main-style.css" />
  </head>
  <body>
    <header>
      <nav class="breadcrumb"></nav>
      <div class="font-size-L">AI Creator Battle</div>
    </header>
    <main>
      <div class="main-header">
        <select id="layer-kind-select">
          <option value="Dense">Dense</option>
          <option value="Flatten">Flatten</option>
        </select>
        <button id="add-layer-btn">Layer追加</button>
        <button id="save-btn">保存</button>
      </div>
      <div class="editor-screen">
        <div class="dock-left-area" data-min-width="150px" data-width="200px" data-toggle-square="false">
          <div class="dock-content">
            <select id="game-select">
              <option value="cartpole">カートポール</option>
              <option value="breakout">ブロック崩し</option>
            </select>
          </div>
          <div class="dock-left-bar"></div>
        </div>
        <div class="right-area">
          <div class="layers-screen">
            
          </div>
          <div class="layer-editor">
            <select id="layer-select"></select>
          </div>
        </div>
      </div>
    </main>
    <script>
      const layersScreen = document.getElementById('layers-screen');
      const gameSelect = document.getElementById('game-select');
      const layerSelect = document.getElementById('layer-select');
      const layerKindSelect = document.getElementById('layer-kind-select');
      const addLayerBtn = document.getElementById('add-layer-btn');
      const saveBtn = document.getElementById('save-btn');

      let gameKind;
      let currentGameInfo;
      let ck;
      let isChanged = false;

      const gameInfo = {
        cartpole: {
          // x, v, theta, omega ... -1 ~ 1
          inputShape: [ 4 ],
          
        }
      }

      const LayerInitArgs = {
        Input: {
          
        },
        Dense: {
          units: 32
        },
        Flatten: {

        }
      }

      function addLayer(kind) {
        let args = LayerInitArgs[kind];
        if (Object.keys(args).length === 0)
          args = undefined;
        ck.addLayers([
          Layer[kind](args)
        ]);
      }

      function logger(...message) {
        console.log(message);
      }

      function initGame() {
        if (ck)
          ck.delete();
        ck = new CogniKeel({
          inputShape: currentGameInfo.inputShape,
          onLog: logger
        });
        addLayer('Input');
      }

      function draw() {
        layersScreen.innerHTML = '';
      }

      gameSelect.addEventListener('change', (e) => {
        if (isChanged) {
          if (!confirm('この操作を行うと、保存されていないデータは戻すことができません。'))
            return;
        }
        gameKind = e.target.value;
        alert(gameKind);
        isChanged = false;
        initGame();
      });

      function init() {
        gameKind = gameSelect.value;
        currentGameInfo = gameInfo[gameKind];
        initGame();
        draw();
      }
      init();
    </script>
    <script src="/statics/main-script.js"></script>
  </body>
</html>
