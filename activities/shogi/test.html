    <!--
      v47 (v46からの変更点)
      - 局面編集に「盤を上下反転」(盤上の駒を180度回す。先手・後手の持ち主・持駒・手番は変えない)と
        「先後入れ替え」(180度回し、駒の持ち主・持駒・手番も入れ替える=鏡像の局面)を追加
      - 視点の上下反転ボタン「⇅」を追加(盤・持駒・先手後手の表示がそのまま反転する)
      - 「⑨ 終盤から開始」: 棋譜(KIF、複数可)を読み込み、終盤の局面から、詰みが見えず(詰みの評価値が出ない)、
        評価値が800cp以上の勝勢の局面をエンジンで探し、勝勢の側をあなたが持って VS AI を始める

      v46 (v45からの変更点)
      - 評価値グラフ: 縦軸を ±2999cp の直線目盛りに変更(従来は勝率曲線で、±1500cpあたりから張り付いていた)。詰みは±2999cp
      - 「AIの手を自分で指せる」設定をやめ、AIの手番に出るボタン「次は自分が指す」に変更(VS AI・AI vs AI)。
        押すとAIが考えるのをやめ、1手だけ自分で指せる。指すと元に戻る。もう一度押す(「AIに任せる」)と取り消し

      v45 (v44からの変更点)
      - 「最善手の狙い」の表示と、その判定処理をすべて削除
      - 局面編集中に、直前の手の青いハイライトが残る不具合を修正
      - 序盤の不自然さを改善: 序盤は評価値の差がほとんど無く、許容内から無作為に選ぶと意味のない手が混ざっていた。
        強さレベルの許容cpは序盤ほど小さく(4手目まで12%、30手目で全開)、手のばらつきも序盤は最大50cp。選ぶときは最善手に近い手ほど選ばれやすくした
      - 対局中に強さレベル・手のばらつき・AIの考える時間を変えると、AIの手番ならすぐに反映して考え直す
      - 設定画面の補足説明を整理(不要なものを削除)

      v44 (v43からの変更点)
      - 強さレベル: 不自然だった「完全ランダム手(うっかり)」をやめ、最善手との評価差の許容(cp)の範囲内から無作為に選ぶ方式に統一
        許容 Lv1=700cp / Lv2=400 / Lv3=220 / Lv4=140 / Lv5=90 / Lv6=60 / Lv7=40 / Lv8=25 / Lv9=15 / Lv10=8
        弱すぎたLv3〜は読む深さを引き上げ(Lv3=5, Lv4=7, Lv5=9 …)。許容が400cp未満のレベルでは、勝勢を負けにする手は選ばない
      - 囲い・戦法の大表示が毎手出る不具合を修正: 判定が手ごとに出たり消えたりして、同じ囲いが何度も「完成」扱いになっていた。
        1局の中で同じ囲い・戦法(とその上位の名前)は1回だけ大きく表示する(盤の上の常時表示は従来どおり)

      v43 (v42からの変更点)
      - 起動時: NN(hao.bin / やねうら王)の読込が終わるまで対局を始めない。読込が終われば自動で開始し、
        読込に失敗(ダウンロード失敗・オフラインで未保存・WASM失敗など)したらNNなしで開始する。
        読込中は盤を触れず、AIも考えない。40秒間なにも進まないときもNNなしで開始する
      - 強さレベルを大幅に弱く: 最弱のLv1は、約半分の手が完全なランダム手(うっかり)で、残りも候補40手から
        ほぼ均等に選ぶ。Lv2〜Lv6にも「うっかり率」(30%/18%/10%/5%/2%)を追加し、許す下がり幅と候補数も拡大

      v42 (v41からの変更点)
      - AIの強さレベルが効いていなかった問題を修正
        原因: 悪手を混ぜる幅が最大150cpで、しかも序盤だけ(30手目以降はほぼゼロ)だった。さらに水匠(NNUE)は深さ1〜4でも十分強い
        対策: レベルごとに「許す評価値の下がり幅」(Lv1=800cp 〜 Lv10=20cp)と「候補の数」(Lv1〜2=10手 〜 Lv10=5手)を設定し、
        ゲーム全体を通して、その範囲から評価差で重み付けして選ぶ(Stockfishの Skill Level と同じ考え方)。深さ制限は従来どおり併用
        「無制限」は従来どおり最強(「手のばらつき」の設定だけが効く)
      - 候補手の並び順: 最新の深さまで読めた手を評価値の高い順に並べ、読み途中の古い手はその後ろに回す(深さが多い順に見えていた)
      - 設定画面に、強さレベルとばらつきの説明を追加

      v41 (v40からの変更点)
      - 探索エンジン(自作エンジン): 世界最強クラスの将棋AIと同じ作りに変更
        反復深化(浅い深さから1つの探索を深めていく) + 置換表の共有 + PVS(最善手だけ全力・他は幅ゼロの窓で確認、αを超えたら読み直し)
        + アスピレーション窓 + ヌルムーブ枝刈り + LMR(後ろの静かな手は浅く) + futility + 王手延長 + MultiPV(上位N手を順に確定)
        従来の「全手を同じ深さで読む → 評価の高い手を追加で深く読む」をやめ、有望な手ほど深く読まれる1本の探索にした
        (同じ深さ5で従来の約7倍速。大会用エンジンのやねうら王使用時は従来どおりやねうら王が探索する)
      - 時間の使い方: 設定「早指し」(既定ON)。最善手が4手続けて変わらず、時間の45%を過ぎたら早めに指す(やねうら王・自作エンジンとも)
      - 囲い・戦法の表示: akicho8/bioshogi の shape_info(盤面図の定義)をJSに移植。成立すると画面中央に大きく表示し、盤の上に常時表示
        (ancestors/parent の関係で上位互換の名前だけ表示。手順に依存する戦法・kill_only は判定しない。設定で表示ON/OFF)
      - 指した手の「何位・最善比」が出ないことがある不具合を修正: 候補(上位5手)の外の手を指したとき、その手だけをエンジンで短時間(0.4秒)評価して順位と最善比を出す
      - 局面編集の完了に「完了→AI vs AI」を追加。編集前と同じ局面で完了したとき、AI vs AIが認識されない不具合も修正
      - 設定画面をグループ分け(対局 / 時間 / AIの強さ / 表示・操作 / 定跡 / 戦型表示 / 評価関数 / その他)。関係ない項目は自動で隠す
      - 「AIの手を自分で指す」設定を「表示・操作」に移動し、説明を追加(ONなら VS AI でもAIの手番に盤をタップして指せる)

      v40 (v39からの変更点)
      - 自己対局(AI学習)をすべて削除(モード・設定・ボタン・学習の処理・学習成果の保存)
      - 学習しない「AI vs AI」モードを追加。画面はVS AIと同じで、AIの考慮中に駒をタッチすると、その手を指せる(先手・後手どちらの番でも)

      v27 (v26からの変更点)
      - コードを整形: 1行にまとめていた文を1文ずつの行に展開し、インデントを2スペースにそろえた(動作は変更なし)
      - エンジンと hao.bin の置き場所の指定を、メインスレッド(UIスクリプト)の先頭の「置き場所の設定」にまとめた
        HAO_URLS(hao.bin の取得先) / ENGINE_DIRS(やねうら王の置き場) / ENGINE_FILES(ファイル名) / SIZE_HAO・SIZE_WASM(進捗表示用の大きさ)

      v26 (v25からの変更点)
      - 自陣の形(戦法)の目標を、自作エンジンでも使えるように変更(やねうら王専用ではなくなった)
      - どのエンジンで動いているかを、候補手欄の先頭に常時表示(「エンジン: やねうら王(WASM) + hao.bin」/「自作エンジン(やねうら王は使えません: 理由)」)

      v25 (v24からの変更点)
      - 最悪手: 解析が終わったあと、全手を短時間(自分の手番1.5秒/AIの手番0.7秒)だけ評価し直して最悪手を必ず表示
        (VS AIの上位5手のみの探索では出なかった)。あわせて、上位5手の外の手を指したときも「何位・最善比」を表示
      - AIの手のばらつき: 最善手以外を選んだ手には ★ を付けて表示(順位・最善比つき)。候補の深度条件を1段ゆるめ、選ばれにくい場面を減らした
      - 設定「AIの手を自分で決める」を追加。ONのとき、AIの手番でも盤をタップして指せる。候補手(上位5手)をタップしても指せる。
        「AI推奨で指す」ボタンでAIの選んだ手をそのまま指せる(AIは自動では指さない)
      - 設定「自陣の形(戦法)の目標」を追加(プリセット+自作)。自作は「駒+マス」(例 P7f R6h K2h)を優先順に空白区切り(先手視点。後手は自動で反転)
        AIは最善手から150cp以内(形勢が悪いときは60cp)なら、目標に近づく手を優先して指す
        目指せないときは理由を画面に表示(動かせる駒がない/塞がれている(他の駒を先に動かす場合は「今は動かせない」)/評価が下がるため見送り/駒を取られた・形勢が悪いため断念)
        (v26で自作エンジンでも有効になった)

      v24 (v23からの変更点)
      - 詰みが見つかった局面で、時間制限の探索が深度245(上限)まで空回りする問題を修正
        (時間指定の探索で詰みの評価が出て深度6以上になったら探索を打ち切る。深度表示も99を上限に)

      v23 (v22からの変更点)
      - AIの強さ: 「10(最強)」を「10」に変更し、末尾に「無制限」(探索深さの制限なし)を追加。既定は無制限
      - 局面編集: パレット(駒の種類選択・先手後手の駒・盤に置く/持駒に追加・消す)を廃止
        「全消去」を「全て持駒へ」に変更(玉以外の駒を先手の持駒にまとめる。そこから選択して好きな場所・側に置ける)
        玉の上には置けない(玉が消えるのを防止)
      - 設定の「任意」用の数値欄は、「任意」を選んだときだけ表示(初期値7が紛らわしかったため)

      v22 (v21からの変更点)
      - 局面編集の操作を刷新
        盤上の駒をタップ=選択 / 別のマスをタップ=移動(先に駒があれば、選択した駒の持ち主の持駒にして置く)
        選択中に同じ駒をもう一度タップ=種類切替(自歩→自と→相歩→相と→…。金・玉は 自→相)して選択解除
        選択中に持駒エリアをタップ=その側の持駒にする(玉は不可) / 持駒の駒をタップ=選択して盤へ置ける
        移動・配置・切替・持駒化のあとは選択解除
      - AIの強さレベル(1〜10)を追加。低いほど探索深さを制限し、手のばらつきを大きくする
      - ばらつきで選ぶ手の評価低下に上限(150cp)を設定。勝勢から互角以下になる手も選ばない

      v21 (v20からの変更点)
      - VS AIの自分の手番の解析を、AIの手番と同じ方式に変更(考慮時間=AI考慮時間、候補手は上位5手)。研究・AI学習は従来のまま
      - そのため VS AI中は、自分の手の「何位・最善比」は上位5手に入った場合のみ表示され、最悪手は表示されない

      v20 (v19からの変更点)
      - ばらつきの許容値を手数に応じて滑らかに減衰: 許容cp = 設定値 × 4 / (1 + e^((手数 - 15) / 5))
        (0手目で約3.8倍、15手目で2倍、30手目で約0.2倍、以降ほぼ最善手)

      v19 (v18からの変更点)
      - AIの手のばらつき設定を追加(既定60cp)。最善手との評価差が許容内の候補から評価差で重み付けして選ぶ(序盤16手までは許容2倍)
      - ばらつきが有効なときは AIの手番も MultiPV=5 で探索

      v18 (元ファイルからの変更点)
      - 盤面サイズを JS で実測計算(ボタンの折返し高さも考慮)。小さい画面でも極端に小さくならない
      - 横長/狭い画面では「左:盤面 / 右:情報・ボタン」の横配置に自動切替
      - ボタンが画面外に出ない・ページがスクロールしない(position:fixed + visualViewport 追従)
      - 評価バー: 常にMultiPV1の評価値を使用。停止要求が失われたときの自動復旧(ウォッチドッグ)を追加
    -->

    <style>

      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        overscroll-behavior: none;

        touch-action: none;
      }
      #app {

        left: 0;
        top: 0;
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;

        gap: 2px;

        order: 1;
      }
      #ev {
        order: 2;
      }
      #h0 {
        order: 3;
      }
      #board {
        order: 4;
      }
      #h1 {
        order: 5;

      #info {

      }
      #btns {

    <script id="eng">
      /* ===== 将棋エンジン(メインとWorkerで共用) ===== */
      var DR = [-1, -1, 0, 1, 1, 1, 0, -1],
        DF = [0, 1, 1, 1, 0, -1, -1, -1],
        FL = [4, 3, 2, 1, 0, 7, 6, 5];
      var STEP = [0, 1, 0, 0, 171, 215, 0, 0, 255, 215, 215, 215, 215, 0, 85, 170];
      var SLD = [0, 0, 1, 0, 0, 0, 170, 85, 0, 0, 0, 0, 0, 0, 170, 85];
      var VAL = [0, 90, 350, 450, 550, 600, 900, 1000, 0, 600, 600, 600, 600, 0, 1100, 1300];
      var KK = [0, 0, 1, 2, 3, 4, 5, 7, 0, 4, 4, 4, 4, 0, 6, 8];
      var HB = [0, 1, 39, 49, 59, 69, 79, 85],
        HE = [0, 20, 44, 54, 64, 74, 82, 88];

      function newPos() {
        var P = { b: new Int8Array(81), h: [new Int8Array(8), new Int8Array(8)], side: 0, k: [4 * 9 + 8, 4 * 9] };
        var back = [2, 3, 4, 5, 8, 5, 4, 3, 2];
        for (var f = 0; f < 9; f++) {
          P.b[f * 9] = back[f] | 16;
          P.b[f * 9 + 8] = back[f];
          P.b[f * 9 + 2] = 17;
          P.b[f * 9 + 6] = 1;
        }
        P.b[7 * 9 + 1] = 7 | 16;
        P.b[1 * 9 + 1] = 6 | 16;
        P.b[7 * 9 + 7] = 6;
        P.b[1 * 9 + 7] = 7;
        return P;
      }

      function fromSt(s) {
        return {
          b: Int8Array.from(s.b),
          h: [Int8Array.from(s.h[0]), Int8Array.from(s.h[1])],
          side: s.side,
          k: s.k.slice()
        };
      }

      function toSt(P) {
        return { b: Array.from(P.b), h: [Array.from(P.h[0]), Array.from(P.h[1])], side: P.side, k: P.k.slice() };
      }

      function gen(P, co) {
        var b = P.b,
          c = P.side,
          o = [],
          hd = P.h[c],
          pf = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        function ad(s, ts, t) {
          if (co && !b[ts]) return;
          var r0 = s % 9,
            r1 = ts % 9,
            z0 = c ? r0 >= 6 : r0 <= 2,
            z1 = c ? r1 >= 6 : r1 <= 2,
            last = c ? 8 - r1 : r1;
          var pr = t <= 7 && t !== 5 && t !== 8 && (z0 || z1);
          var must = t === 1 || t === 2 ? last === 0 : t === 3 ? last <= 1 : 0;
          if (pr) o.push(s | (ts << 7) | (1 << 14));
          if (!must) o.push(s | (ts << 7));
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p || p >> 4 !== c) continue;
          var t = p & 15,
            f = (s / 9) | 0,
            r = s % 9;
          if (t === 1) pf[f] = 1;
          if (t === 3) {
            var kr = r + (c ? 2 : -2);
            if (kr >= 0 && kr < 9)
              for (var e = -1; e <= 1; e += 2) {
                var kf = f + e;
                if (kf >= 0 && kf < 9 && !(b[kf * 9 + kr] && b[kf * 9 + kr] >> 4 === c)) ad(s, kf * 9 + kr, t);
              }
          }
          for (var j = 0; j < 8; j++) {
            var sl = (SLD[t] >> j) & 1;
            if (!((STEP[t] >> j) & 1) && !sl) continue;
            var a = c ? FL[j] : j,
              nf = f + DF[a],
              nr = r + DR[a];
            while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
              var q = b[nf * 9 + nr];
              if (q && q >> 4 === c) break;
              ad(s, nf * 9 + nr, t);
              if (q || !sl) break;
              nf += DF[a];
              nr += DR[a];
            }
          }
        }
        if (!co) {
          for (var d = 1; d < 8; d++) {
            if (!hd[d]) continue;
            for (var u = 0; u < 81; u++) {
              if (b[u]) continue;
              var uf = (u / 9) | 0,
                ur = u % 9,
                ul = c ? 8 - ur : ur;
              if ((d <= 2 && ul === 0) || (d === 3 && ul <= 1) || (d === 1 && pf[uf])) continue;
              o.push(81 | (u << 7) | (d << 15));
            }
          }
        }
        return o;
      }

      function atk(P, s, c) {
        var b = P.b,
          f = (s / 9) | 0,
          r = s % 9,
          kr = r + (c ? -2 : 2);
        if (kr >= 0 && kr < 9) {
          for (var e = -1; e <= 1; e += 2) {
            var kf = f + e;
            if (kf >= 0 && kf < 9 && b[kf * 9 + kr] === (3 | (c << 4))) return 1;
          }
        }
        for (var i = 0; i < 8; i++) {
          var a = (i + 4) & 7,
            j = c ? FL[a] : a,
            nf = f + DF[i],
            nr = r + DR[i],
            k = 1;
          while (nf >= 0 && nf < 9 && nr >= 0 && nr < 9) {
            var p = b[nf * 9 + nr];
            if (p) {
              if (p >> 4 === c) {
                var t = p & 15;
                if (((STEP[t] >> j) & 1 && k === 1) || (SLD[t] >> j) & 1) return 1;
              }
              break;
            }
            nf += DF[i];
            nr += DR[i];
            k++;
          }
        }
        return 0;
      }

      function make(P, m) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15,
          c = P.side,
          b = P.b,
          cap = b[t];
        if (f === 81) {
          b[t] = d | (c << 4);
          P.h[c][d]--;
        } else {
          var p = b[f];
          b[f] = 0;
          if (pr) p += 8;
          b[t] = p;
          if ((p & 15) === 8) P.k[c] = t;
          if (cap) {
            var ct = cap & 15;
            P.h[c][ct > 8 ? ct - 8 : ct]++;
          }
        }
        P.side ^= 1;
        return cap;
      }

      function undo(P, m, cap) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15,
          c = P.side ^ 1,
          b = P.b;
        if (f === 81) {
          b[t] = 0;
          P.h[c][d]++;
        } else {
          var p = b[t];
          if (pr) p -= 8;
          b[f] = p;
          b[t] = cap;
          if ((p & 15) === 8) P.k[c] = f;
          if (cap) {
            var ct = cap & 15;
            P.h[c][ct > 8 ? ct - 8 : ct]--;
          }
        }
        P.side = c;
      }

      function legal(P) {
        var ms = gen(P),
          o = [],
          c = P.side;
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i],
            cap = make(P, m),
            ok = !atk(P, P.k[c], c ^ 1);
          if (ok && m >> 15 === 1 && atk(P, P.k[c ^ 1], c) && !legal(P).length) ok = false;
          undo(P, m, cap);
          if (ok) o.push(m);
        }
        return o;
      }

      /* ----- ハッシュ・千日手 ----- */
      var Z1 = new Int32Array(3000),
        Z2 = new Int32Array(3000),
        PK = [],
        PC = [],
        EC = new Map();
      (function () {
        var x = 123456789;
        function r() {
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          return x | 0;
        }
        for (var i = 0; i < 3000; i++) {
          Z1[i] = r();
          Z2[i] = r();
        }
      })();

      function hashP(P) {
        var h1 = P.side ? -1640531527 : 0,
          h2 = P.side ? 1013904242 : 0,
          b = P.b,
          i,
          p;
        for (i = 0; i < 81; i++) {
          p = b[i];
          if (p) {
            h1 ^= Z1[i * 32 + p];
            h2 ^= Z2[i * 32 + p];
          }
        }
        for (var c = 0; c < 2; c++)
          for (var t = 1; t < 8; t++) {
            var n = P.h[c][t];
            if (n) {
              var k = 2592 + (c * 8 + t) * 19 + n;
              h1 ^= Z1[k];
              h2 ^= Z2[k];
            }
          }
        return (h1 >>> 0) * 2097152 + (h2 >>> 11);
      }
      /* 千日手の周期 j..k のうち、k手目を指した側だけが毎手王手→1、もう一方→2、なし→0 */
      function cyc(pc, k, j) {
        var a = 1,
          b = 1,
          i;
        for (i = k; i > j; i -= 2)
          if (!pc[i]) {
            a = 0;
            break;
          }
        for (i = k - 1; i > j; i -= 2)
          if (!pc[i]) {
            b = 0;
            break;
          }
        return a ? 1 : b ? 2 : 0;
      }

      /* ----- 評価 ----- */
      var NN = 0,
        LW = new Float64Array(16),
        FB,
        FW,
        B1,
        W1,
        B2,
        W2,
        B3,
        W3;
      var A0 = new Int32Array(256),
        A1 = new Int32Array(256),
        IN = new Int32Array(512),
        H1 = new Int32Array(32),
        H2 = new Int32Array(32);

      function mat(P, x) {
        var c = P.side,
          b = P.b;
        x.fill(0);
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (p) x[p & 15] += p >> 4 === c ? 1 : -1;
        }
        for (var t = 1; t < 8; t++) x[t] += P.h[c][t] - P.h[c ^ 1][t];
        return x;
      }
      var XV = new Float64Array(16);

      function nnEval(P) {
        var b = P.b,
          W = FW,
          k0 = P.k[0] * 1548,
          k1 = (80 - P.k[1]) * 1548;
        A0.set(FB);
        A1.set(FB);
        function add(i0, i1) {
          var o0 = (k0 + i0) * 256,
            o1 = (k1 + i1) * 256;
          for (var j = 0; j < 256; j++) {
            A0[j] += W[o0 + j];
            A1[j] += W[o1 + j];
          }
        }
        for (var s = 0; s < 81; s++) {
          var p = b[s];
          if (!p) continue;
          var t = p & 15;
          if (t === 8) continue;
          var c = p >> 4,
            kk = 90 + 162 * KK[t];
          add(kk + (c ? 81 : 0) + s, kk + (c ? 0 : 81) + 80 - s);
        }
        for (var cc = 0; cc < 2; cc++) {
          for (var d = 1; d < 8; d++) {
            for (var i = 0; i < P.h[cc][d]; i++) add((cc ? HE[d] : HB[d]) + i, (cc ? HB[d] : HE[d]) + i);
          }
        }
        var st = P.side,
          X0 = st ? A1 : A0,
          X1 = st ? A0 : A1;
        for (var j = 0; j < 256; j++) {
          var v = X0[j];
          IN[j] = v < 0 ? 0 : v > 127 ? 127 : v;
          v = X1[j];
          IN[256 + j] = v < 0 ? 0 : v > 127 ? 127 : v;
        }
        for (var i2 = 0; i2 < 32; i2++) {
          var sm = B1[i2],
            o = i2 * 512;
          for (var j2 = 0; j2 < 512; j2++) {
            var iv = IN[j2];
            if (iv) sm += W1[o + j2] * iv;
          }
          sm >>= 6;
          H1[i2] = sm < 0 ? 0 : sm > 127 ? 127 : sm;
        }
        for (var i3 = 0; i3 < 32; i3++) {
          var s3 = B2[i3];
          for (var j3 = 0; j3 < 32; j3++) s3 += W2[i3 * 32 + j3] * H1[j3];
          s3 >>= 6;
          H2[i3] = s3 < 0 ? 0 : s3 > 127 ? 127 : s3;
        }
        var out = B3[0];
        for (var j4 = 0; j4 < 32; j4++) out += W3[j4] * H2[j4];
        return out / 20;
      }

      function evalPos(P) {
        var x = mat(P, XV),
          e = 0,
          k;
        if (NN) {
          var hk = hashP(P),
            cv = EC.get(hk);
          if (cv === undefined) {
            cv = nnEval(P);
            if (EC.size > 600000) EC.clear();
            EC.set(hk, cv);
          }
          e = cv;
        } else for (k = 1; k < 16; k++) e += VAL[k] * x[k];
        for (k = 1; k < 16; k++) e += LW[k] * x[k];
        return Math.round(e);
      }

      /* ----- 探索 ----- */
      var nodes = 0,
        dl = 1e15,
        stopF = 0;
      var TT = new Map(),
        KL = [],
        HT = new Int32Array(32768),
        ttLW = '';

      function sortMv(P, ms, tm, ply) {
        var b = P.b,
          k1 = KL[ply * 2] | 0,
          k2 = KL[ply * 2 + 1] | 0;
        var sc = ms.map(function (m) {
            if (m === tm) return 1e8;
            var v = b[(m >> 7) & 127] ? VAL[b[(m >> 7) & 127] & 15] * 10 - VAL[b[m & 127] & 15] + 1e6 : 0;
            if ((m >> 14) & 1) v += 5e5;
            if (!v) v = m === k1 ? 9e5 : m === k2 ? 8e5 : HT[m & 32767];
            return v;
          }),
          idx = ms.map(function (_, i) {
            return i;
          });
        idx.sort(function (x, y) {
          return sc[y] - sc[x];
        });
        return idx.map(function (i) {
          return ms[i];
        });
      }

      function qs(P, a, b, ply) {
        var e = evalPos(P);
        if (e >= b) return e;
        if (e > a) a = e;
        if (ply > 6) return e;
        var c = P.side,
          ms = sortMv(P, gen(P, 1), 0, 63);
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i],

      function readFile(f) {

            );

          idbPut('hao', r.result).catch(function () {});

      function idb() {
        return new Promise(function (res, rej) {
          var r = indexedDB.open('shogiNN', 1);
          r.onupgradeneeded = function () {
            r.result.createObjectStore('f');
          };
          r.onsuccess = function () {
            res(r.result);
          };
          r.onerror = function () {
            rej(r.error);
          };
        });
      }

      async function idbGet(k) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var q = d.transaction('f').objectStore('f').get(k);
          q.onsuccess = function () {
            res(q.result);
          };
          q.onerror = function () {
            rej(q.error);
          };
        });
      }

      async function idbPut(k, v) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var t = d.transaction('f', 'readwrite');
          t.objectStore('f').put(v, k);
          t.oncomplete = res;
          t.onerror = function () {
            rej(t.error);
          };
        });
      }

      function to(p, ms) {
        return Promise.race([
          p,
          new Promise(function (r) {
            setTimeout(function () {
              r(null);
            }, ms);
          })
        ]);
      }

      async function autoLoad() {
        try {
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
        } catch (e) {}
        try {
          var c = await to(idbGet('hao'), 2500);
          if (c && c.byteLength > 1e6) {
            setNN('保存済みの hao.bin を読込中…', 50, 1);
            useNet(c, 'hao.bin(保存済み)');
            return;
          }
        } catch (e) {}
        if (navigator.onLine === false) {
          setNN('オフラインで hao.bin が未保存です。☰からファイルを選んでください', 0, 1);

      async function loadHao() {
        var err = '';
        for (var k = 0; k < HAO_URLS.length; k++) {
          try {
            setNN('hao.bin ダウンロード開始…', 0, 1);
            var r = await fetch(HAO_URLS[k]);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var tot = +r.headers.get('content-length') || SIZE_HAO,
              ch = [],
              n = 0;
            if (!r.body || !r.body.getReader) {
              var ab = await r.arrayBuffer();
              ch.push(new Uint8Array(ab));
              n = ab.byteLength;
            }
            var rd =
              r.body && r.body.getReader
                ? r.body.getReader()
                : {
                    read: function () {
                      return Promise.resolve({ done: 1 });
                    }
                  };
            for (;;) {
              var x = await rd.read();
              if (x.done) break;
              ch.push(x.value);
              n += x.value.length;
              setNN(
                'hao.bin ダウンロード中 ' + (n / 1048576).toFixed(1) + 'MB / ' + (tot / 1048576).toFixed(1) + 'MB',
                Math.min(50, (n * 50) / tot),
                1
              );
            }
            if (n < 1e6) throw new Error('サイズ不正 ' + n + 'B(LFSポインタ)');
            var u8 = new Uint8Array(n),
              o = 0;
            ch.forEach(function (c) {
              u8.set(c, o);
              o += c.length;
            });
            idbPut('hao', u8.buffer).catch(function () {});
            useNet(u8.buffer, 'hao.bin');
            return;
          } catch (e) {
            err += k + 1 + ': ' + e.message + ' ';
          }
        }
        setNN('取得失敗(タップで再試行) ' + err, 0, 0);
        g('nnB').textContent = '⚠取得失敗:タップで再試行';
        haoFail = 1;
        nnCheck();
      }

      /* --- 表記・棋譜 --- */
      function mvT(m, kif) {
        var f = m & 127,
          t = (m >> 7) & 127,
          pr = (m >> 14) & 1,
          d = m >> 15;
        var nm = f === 81 ? NM[d] : NM[P.b[f] & 15],
          dis = '';
        if (f !== 81 && !kif) {
          dis = disamb(f, t);
          if (!pr && legal(P).indexOf(m | 16384) >= 0) dis += '不成';
        }
        return (
          FN[(t / 9) | 0] +
          RN[t % 9] +
          nm +
          dis +
          (pr ? '成' : '') +
          (f === 81 ? '打' : kif ? '(' + (((f / 9) | 0) + 1) + ((f % 9) + 1) + ')' : '')
        );
      }
      /* 同じ種類の駒が複数ある場合の区別: 直・右・左・上・引・寄 (先手後手それぞれ自分から見た向き) */
      function disamb(f, t) {
        var pc = P.b[f],
          black = pc >> 4 === 0,
          froms = [],
          tF = (t / 9) | 0,
          tR = t % 9;
        legal(P).forEach(function (x) {
          var xf = x & 127;
          if (xf < 81 && ((x >> 7) & 127) === t && P.b[xf] === pc && froms.indexOf(xf) < 0) froms.push(xf);
        });
        if (froms.length < 2) return '';
        var info = froms.map(function (x) {
          var xF = (x / 9) | 0,
            xR = x % 9;
          return { me: x === f, rs: black ? tF - xF : xF - tF, fw: black ? xR - tR : tR - xR };
        });
        var me = info.filter(function (o) {
            return o.me;
          })[0],
          others = info.filter(function (o) {
            return !o.me;
          });
        if (
          me.rs === 0 &&
          me.fw > 0 &&
          !others.some(function (o) {
            return o.rs === 0 && o.fw > 0;
          }) &&
          others.some(function (o) {
            return o.rs !== 0;
          })
        )
          return '直';
        var mov = me.fw > 0 ? '上' : me.fw < 0 ? '引' : '寄';
        var rights = others.filter(function (o) {
            return o.rs > me.rs;
          }).length,
          lefts = others.filter(function (o) {
            return o.rs < me.rs;
          }).length;
        var same = others.filter(function (o) {
          return o.rs === me.rs;
        }).length;
        var side = rights === 0 && lefts > 0 ? '右' : lefts === 0 && rights > 0 ? '左' : '';
        if (same === 0) return side || mov;
        return side + mov;
      }

      function engLabel() {
        if (YO.state === 'ok')

        if (YO.state === 'init' || YO.state === 'none') return '自作エンジン(やねうら王を準備中)';
        return '自作エンジン(やねうら王は使えません: ' + (YO.why || '理由不明') + ')';
      }

            pv +
            '<div>思考 ' +
            Math.round(m.pct) +
            '%' +
            (m.info || '') +
            ' (手番側の評価値)' +
            '</div>';
        m.list.slice(0, n).forEach(function (x, i) {
          h +=
            '<div>' +
            (i + 1) +
            '位 ' +
            (P.side ? '△' : '▲') +
            mvT(x.m) +
            '  ' +
            fmtS(x.s) +
            (i && Math.abs(x.s) < 29000 && Math.abs(m.list[0].s) < 29000 ? '  最善比' + (x.s - m.list[0].s) + 'cp' : '') +
            '  (深度' +
            x.d +
            ')</div>';
        });
        if (m.worst) h += '<div style="color:#f88">最悪手 ' + mvT(m.worst.m) + '  ' + fmtS(m.worst.s) + '</div>';
        g('cand').innerHTML = h;
      }

      function setEv(sb) {
        var p = 1 / (1 + Math.exp(-Math.max(-3000, Math.min(3000, sb)) / 600));
        g('evB').style.width = p * 100 + '%';
        g('evT').textContent =
          (sb >= 0 ? '先手 ' : '後手 ') +
          Math.round((sb >= 0 ? p : 1 - p) * 100) +
          '% (' +
          (sb > 0 ? '+' : '') +
          Math.round(sb) +
          ')';
      }

      function exportKif() {
        var tot = [0, 0],
          f2 = function (n) {
            return String(n).padStart(2, '0');
          };
        var t =
          (startSfen ? '手合割：その他\n' : '手合割：平手\n') +
          '先手：' +
          (mode === 'vs' && human === 0 ? '人間' : 'AI') +
          '\n後手：' +
          (mode === 'vs' && human === 1 ? '人間' : 'AI') +
          '\n' +
          (startSfen ? bodText(startP) : '') +
          '手数----指手---------消費時間--\n';
        hist.forEach(function (h, i) {
          var sec = Math.round(h.t / 1000);
          tot[h.c] += sec;
          t +=
            String(i + 1).padStart(4, ' ') +
            ' ' +
            h.kif +
            '   (' +
            ((sec / 60) | 0) +
            ':' +
            f2(sec % 60) +
            '/' +
            f2((tot[h.c] / 3600) | 0) +
            ':' +
            f2(((tot[h.c] / 60) | 0) % 60) +
            ':' +
            f2(tot[h.c] % 60) +
            ')\n' +
            (h.inf ? '*' + h.inf + '\n' : '');
        });
        if (over && endKif) t += String(hist.length + 1).padStart(4, ' ') + ' ' + endKif + '\n' + endTxt + '\n';
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' }));
        a.download = 'shogi_' + Date.now() + '.kif';
        a.click();
      }

      /* --- 対局進行 --- */
      function newGame(sp) {
        manNext = 0;
        g('res').hidden = true;
        tacQuiet = 1;
        tacKey = '';
        tacSeen = [{}, {}];
        aiAI = g('mode').value === 'aivai' ? 1 : 0;
        mode = aiAI ? 'vs' : g('mode').value;
        sel = null;
        last = null;
        over = 0;
        endKif = '';
        evEnd = null;
        hist = [];
        P = sp || newPos();
        startSfen = sp ? toSfen(P) : '';
        startP = clonePos(P);
        gid++;
        hKeys = [hashP(P)];
        hChk = [atk(P, P.k[P.side], P.side ^ 1) ? 1 : 0];
        lastInfo = '';
        curAn = null;
        manRec = 0;
        bkNote = '';
        stratLine = '';
        stratPick = '';
        stratOff = 0;
        stratBase = null;
        paused = 0;
        editing = 0;
        g('ed').hidden = true;
        g('info').hidden = false;
        var hs = g('side').value;
        human = aiAI ? 2 : hs === 'r' ? (Math.random() < 0.5 ? 0 : 1) : +hs;
        flip = mode === 'vs' && human === 1 ? 1 : 0;
        var t = g('tm').value;
        clk.on = mode === 'vs' && !aiAI && t !== 'n';
        clk.left = num('base') * 60000;
        clk.by = t === 'b' ? num('by') * 1000 : 0;
        clk.fi = t === 'b' ? num('fi') * 1000 : 0;
        g('cand').innerHTML = '';
        g('menu').hidden = true;
        renderBtns();
        g('evB').style.width = '50%';
        g('evT').textContent = '形勢';
        g('msg').textContent = aiAI ? 'AI vs AI' : mode === 'vs' ? 'あなたは' + (human ? '後手' : '先手') : '研究';
        next();
      }

      function sideN(c) {
        return c ? '後手' : '先手';
      }

      function finish(msg, winner, kw) {
        if (over) return;
        over = 1;
        gid++;
        evEnd = curAn && curAn.ev != null ? curAn.ev * (P.side ? -1 : 1) : null;
        endKif = kw;
        endTxt = 'まで' + hist.length + '手で' + (winner < 0 ? '引き分け' : sideN(winner) + 'の勝ち');
        g('msg').textContent = msg;
        var vs = mode === 'vs' && !aiAI,
          el = g('res');
        el.className = winner < 0 ? 'draw' : vs ? (winner === human ? 'win' : 'lose') : 'win';
        el.innerHTML =
          (winner < 0
            ? '引き分け'
            : vs
              ? winner === human
                ? 'あなたの勝ち'
                : 'あなたの負け'
              : sideN(winner) + 'の勝ち') +
          '<small>' +
          msg +
          '(タップで閉じる)</small>' +
          evSvg(300, 120);
        el.hidden = false;
        renderBtns();
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        yoStop();
      }

      function canDecl(c) {
        var b = P.b,
          kp = P.k[c],
          kr = kp % 9;
        if (c ? kr < 6 : kr > 2) return 0;
        if (atk(P, kp, c ^ 1)) return 0;
        var n = 0,
          pt = 0,
          t;
        for (var s2 = 0; s2 < 81; s2++) {
          var p = b[s2];
          if (p && p >> 4 === c && (p & 15) !== 8 && (c ? s2 % 9 >= 6 : s2 % 9 <= 2)) {
            n++;
            t = p & 15;
            pt += t === 6 || t === 7 || t === 14 || t === 15 ? 5 : 1;
          }
        }
        for (t = 1; t < 8; t++) pt += P.h[c][t] * (t === 6 || t === 7 ? 5 : 1);
        return n >= 10 && pt >= (c ? 27 : 28);
      }

      function declare() {
        if (!canPlay()) return;
        if (canDecl(P.side)) finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
        else g('msg').textContent = '入玉宣言の条件を満たしていません';
      }

      function judge() {
        var n = hKeys.length - 1,
          k = hKeys[n],
          cnt = 0,
          j0 = -1;
        for (var i = 0; i <= n; i++)
          if (hKeys[i] === k) {
            cnt++;
            if (j0 < 0) j0 = i;
          }
        if (cnt >= 4) {
          var r = cyc(hChk, n, j0),
            mover = P.side ^ 1;
          if (r === 1) finish('連続王手の千日手で' + sideN(mover) + 'の反則負け', P.side, '反則負け');
          else if (r === 2) finish('連続王手の千日手で' + sideN(P.side) + 'の反則負け', mover, '反則負け');
          else finish('千日手(引き分け)', -1, '千日手');
          return 1;
        }
        if (hist.length >= 512) {
          finish('512手で持将棋(引き分け)', -1, '持将棋');
          return 1;
        }
        return 0;
      }

      function next() {
        render();
        if (nnWait) {
          g('msg').textContent = 'NN読込中…';
          return;
        }
        if (paused || editing) return;
        turnT0 = Date.now();
        curAn = null;
        manRec = 0;
        renderBtns();
        if (!legal(P).length) {
          finish('詰み(' + sideN(P.side) + 'の負け)', P.side ^ 1, '詰み');
          return;
        }
        if (mode === 'vs' && P.side !== human && canDecl(P.side)) {
          finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
          return;
        }
        if (mode === 'vs' && P.side !== human) think(1);
        else {
          clk.t0 = Date.now();
          think(0);
        }
      }

      function rankInfo(m) {
        if (!curAn) return '';
        var all = curAn.list,
          ix = -1,
          i,
          best,
          sc;
        for (i = 0; i < all.length; i++)
          if (all[i].m === m) {
            ix = i;
            break;
          }
        if (ix < 0 && curAn.all) {
          all = curAn.all;
          for (i = 0; i < all.length; i++)
            if (all[i].m === m) {
              ix = i;
              break;
            }
        }
        if (ix < 0 && curAn.worst && curAn.worst.m === m) return '最悪手';
        if (ix < 0) return '';
        best = all[0].s;
        sc = all[ix].s;
        var rk = ix + 1;
        if (ix < 5) {
          /* 評価値が同じ手は同じ順位にする */
          rk = 1;
          for (i = 0; i < all.length; i++) if (all[i].s > sc) rk++;
        }
        return rk + '位' + (Math.abs(sc) > 29000 || Math.abs(best) > 29000 ? '' : ' 最善比' + (sc - best) + 'cp');
      }

      /* 指した手が候補(上位5手)に無いとき、その手だけをやねうら王で短時間評価して、順位と最善比を出す */
      function yoEvalMove(Qb, m, an, cb) {
        var id = ++gid,
          u = m2u(m),
          fin = 0,
          tmo = 0;
        var done = function (x) {
          if (fin) return;
          fin = 1;
          clearTimeout(tmo);
          if (id !== gid) return;
          var t = '';
          if (x && Math.abs(x.s) < 29000 && Math.abs(an.list[0].s) < 29000) {
            var rk = 1;
            an.list.slice(0, 5).forEach(function (y) {
              if (y.s > x.s) rk++;
            });
            var more = an.list.length >= 5 && x.s < an.list[4].s;
            t = (more ? '6位以下' : rk + '位') + ' 最善比' + (x.s - an.list[0].s) + 'cp';
          }
          cb(t);
        };
        tmo = setTimeout(function () {
          done(null);
        }, 3000);
        YO.req = {
          id: id,
          play: 0,
          t0: Date.now(),
          ms: 400,
          dcap: 0,
          mpv: 1,
          mv: {},
          dt: {},
          depth: 0,
          cdepth: 0,
          pm: 0,
          ui: 0,
          guide: null,
          Q: Qb,
          sfen: toSfen(Qb),
          only: u,
          ex: function (r, d) {
            if (d) done(r.mv[m]);
          }
        };
        YO.pending = true;
        yoKick();
      }

      function doMove(m) {
        manNext = 0;
        var inf = rankInfo(m),
          an = curAn,
          Qb = clonePos(P),
          needEv =
            !inf &&
            !bkNote &&
            YO.state === 'ok' &&
            YO.ready &&
            an &&
            an.list &&
            an.list.length &&
            an.ev != null &&
            !over,
          evb = curAn && curAn.ev != null ? curAn.ev * (P.side ? -1 : 1) : null,
          txt = (P.side ? '△' : '▲') + mvT(m),
          kif = mvT(m, 1),
          pc = P.side,
          el = Date.now() - turnT0,
          cap = make(P, m);
        if (bkNote) {
          inf = bkNote;
          bkNote = '';
        }
        if (clk.on && pc === human) clk.left = Math.max(0, clk.left - (Date.now() - clk.t0)) + clk.fi;
        var ent = { m: m, cap: cap, kif: kif, txt: txt, c: pc, t: el, inf: inf, ev: evb, bm: curAn ? curAn.bm : '' };
        hist.push(ent);
        lastInfo = txt + (inf ? ' ' + inf : '');
        hKeys.push(hashP(P));
        hChk.push(atk(P, P.k[P.side], P.side ^ 1) ? 1 : 0);
        last = { f: m & 127, t: (m >> 7) & 127 };
        sel = null;
        g('msg').textContent = hist.length + '手目 ' + txt + (inf ? ' ' + inf : '');
        render();
        if (judge()) return;
        if (needEv) {
          yoEvalMove(Qb, m, an, function (t) {
            if (t) {
              ent.inf = t;
              lastInfo = ent.txt + ' ' + t;
              g('msg').textContent = hist.length + '手目 ' + ent.txt + ' ' + t;
            }
            next();
          });
          return;
        }
        next();
      }

      function undoFor(c) {
        manNext = 0;
        var i = hist.length - 1;
        while (i >= 0 && hist[i].c !== c) i--;
        if (i < 0) return;
        while (hist.length > i) {
          var h = hist.pop();
          undo(P, h.m, h.cap);
        }
        hKeys.length = hist.length + 1;
        hChk.length = hist.length + 1;
        var l = hist[hist.length - 1];
        last = l ? { f: l.m & 127, t: (l.m >> 7) & 127 } : null;
        over = 0;
        endKif = '';
        sel = null;
        paused = 0;
        tacQuiet = 1;
        tacSeen = [{}, {}];
        tacKey = '';
        renderBtns();
        g('res').hidden = true;
        g('msg').textContent = l ? hist.length + '手目 ' + l.txt + (l.inf ? ' ' + l.inf : '') : '';
        lastInfo = l ? l.txt + (l.inf ? ' ' + l.inf : '') : '';
        next();
      }

      function resign(c) {
        finish(sideN(c) + '投了', c ^ 1, '投了');
      }

      function renderBtns() {
        var h = '<button id="bNew">新規</button>',
          end = over || paused;
        if (mode === 'study') {
          [0, 1].forEach(function (c) {
            var m2 = c ? '☖' : '☗';
            h +=
              '<button data-a="u" data-c="' +
              c +
              '">' +
              m2 +
              '待った</button><button data-a="r" data-c="' +
              c +
              '">' +
              m2 +
              '投了</button>';
          });
          h += '<button data-a="d">宣言</button>';
        } else if (mode === 'vs' && aiAI) {
          h +=
            '<button data-a="u" data-c="' + (hist.length ? hist[hist.length - 1].c : 0) + '">待った</button>' +
            (end ? '' : '<button data-a="m">' + (manNext ? 'AIに任せる' : '次は自分が指す') + '</button>') +
            (over ? '<button data-a="s">研究へ</button>' : paused ? '<button data-a="c">再開</button>' : '<button data-a="p">中断</button>');
        } else if (mode === 'vs') {
          h += '<button data-a="u" data-c="' + human + '">待った</button>';
          if (!end && (P.side !== human || manNext))
            h += '<button data-a="m">' + (manNext ? 'AIに任せる' : '次は自分が指す') + '</button>';
          if (!end) {
            h +=
              '<button data-a="r" data-c="' +
              human +
              '">投了</button><button data-a="d">宣言</button><button data-a="p">中断</button>';
          } else
            h +=
              (paused ? '<button data-a="c">再開</button>' : '') +
              '<button data-a="s">研究へ</button>';
        }
        h += '<button data-a="f">⇅</button><button id="bMenu">☰</button>';
        g('btns').innerHTML = h;
      }

      /* 「次は自分が指す」: AIの手番で、1手だけ自分で指す */
      var manNext = 0;

      function manOn() {
        return mode === 'vs' && !!manNext;
      }

      function toggleMan() {
        if (mode !== 'vs' || over || paused || editing || nnWait || P.side === human) return;
        manNext = manNext ? 0 : 1;
        renderBtns();
        if (manNext) {
          think(0);
          g('msg').textContent = 'あなたの番です(AIの手番を指します)';
        } else {
          g('msg').textContent = aiAI ? 'AI vs AI' : 'あなたは' + (human ? '後手' : '先手');
          think(1);
        }
      }

      function canPlay() {
        return (
          !nnWait && !over && !paused && !editing && (mode === 'study' || (mode === 'vs' && (P.side === human || manOn())))
        );
      }

      /* --- 盤操作 --- */
      function mk(f, d) {
        var tg = {};
        legal(P).forEach(function (m) {
          if ((m & 127) === f && (f < 81 || m >> 15 === d)) {
            var t = (m >> 7) & 127;
            (tg[t] = tg[t] || []).push(m);
          }
        });
        return { f: f, d: d, tg: tg };
      }

      function clickSq(s) {
        if (editing) {
          editClick(s);
          return;
        }
        if (!canPlay()) return;
        var p = P.b[s];
        if (sel && sel.tg[s]) {
          var mm = sel.tg[s];
          if (mm.length > 1) {
            g('ask').hidden = false;
            g('aY').onclick = function () {
              g('ask').hidden = true;
              doMove(mm[0] & 16384 ? mm[0] : mm[1]);
            };
            g('aN').onclick = function () {
              g('ask').hidden = true;
              doMove(mm[0] & 16384 ? mm[1] : mm[0]);
            };
          } else doMove(mm[0]);
          return;
        }
        sel = p && p >> 4 === P.side ? mk(s, 0) : null;
        render();
      }

      function clickHand(c, d) {
        if (editing) {
          editHand(c, d);
          return;
        }
        if (!canPlay() || c !== P.side) return;
        sel = mk(81, d);
        render();
      }

      function render() {
        bkcPaint();
        tacUpdate(tacQuiet || editing);
        tacQuiet = 0;
        var bd = g('board');
        if (!bd.firstChild) {
          for (var i = 0; i < 81; i++) {
            var d = document.createElement('div');
            d.className = 'cell';
            bd.appendChild(d);
          }
          bd.onclick = function (e) {
            var c = e.target.closest('.cell');
            if (c) clickSq(+c.dataset.s);
          };
          ['h0', 'h1'].forEach(function (id) {
            g(id).onclick = function (e) {
              var s = e.target.closest('.hp'),
                row = id === 'h0' ? 0 : 1;
              if (editing) {
                editHand(flip ? row : 1 - row, s ? +s.dataset.t : 0);
                return;
              }
              if (s) clickHand(+s.dataset.c, +s.dataset.t);
            };
          });
        }
        bd.classList.toggle('flip', !!flip);
        for (var k = 0; k < 81; k++) {
          var r = flip ? 8 - ((k / 9) | 0) : (k / 9) | 0,
            f = flip ? k % 9 : 8 - (k % 9),
            s = f * 9 + r,
            p = P.b[s],
            el = bd.children[k];
          el.dataset.s = s;
          el.className =
            'cell' +
            (p && p >> 4 ? ' w' : '') +
            ((p & 15) > 8 ? ' pr' : '') +
            (!editing && last && (last.t === s || last.f === s) ? ' lm' : '') +
            (sel && sel.f === s ? ' sl' : '') +
            (sel && sel.tg[s] ? ' tg' : '');
          el.innerHTML = p ? '<span>' + NM[p & 15] + '</span>' : '';
        }
        [0, 1].forEach(function (row) {
          var c = flip ? row : 1 - row,
            h = '';
          for (var t = 7; t >= 1; t--) {
            var n = P.h[c][t];
            if (n)
              h +=
                '<span class="hp' +
                (sel && sel.f === 81 && sel.d === t && c === (editing ? sel.c : P.side) ? ' sl' : '') +
                '" data-c="' +
                c +
                '" data-t="' +
                t +
                '">' +
                NM[t] +
                (n > 1 ? n : '') +
                '</span>';
          }
          g('h' + row).innerHTML = (c ? '△' : '▲') + h;
        });
      }

      function fmtT(ms) {
        var s = Math.ceil(ms / 1000);
        return ((s / 60) | 0) + ':' + String(s % 60).padStart(2, '0');
      }
      setInterval(function () {
        if (!clk.on || over || mode !== 'vs') {
          g('clk').textContent = '';
          return;
        }
        if (P.side !== human) {
          g('clk').textContent = '持ち ' + fmtT(clk.left);
          return;
        }
        var rem = clk.left - (Date.now() - clk.t0);
        if (rem > 0) {
          g('clk').textContent = '持ち ' + fmtT(rem);
          return;
        }
        var b = clk.by + rem;
        if (b <= 0) {
          finish('時間切れ', human ^ 1, '切れ負け');
          g('clk').textContent = '0:00';
          return;
        }
        g('clk').textContent = '秒読み ' + Math.ceil(b / 1000);
      }, 100);

      /* 駒+マスの指定(P7f / P76 / 歩76 / 成香1d / +B22)の解釈。定跡の囲い検索で使う */
      var PTYPE = { p: 1, l: 2, n: 3, s: 4, g: 5, b: 6, r: 7, k: 8 };
      var PPROM = { p: 9, l: 10, n: 11, s: 12, b: 14, r: 15 };
      var PKANJI = [
        ['成香', 10],
        ['成桂', 11],
        ['成銀', 12],
        ['歩', 1],
        ['香', 2],
        ['桂', 3],
        ['銀', 4],
        ['金', 5],
        ['角', 6],
        ['飛', 7],
        ['玉', 8],
        ['王', 8],
        ['と', 9],
        ['杏', 10],
        ['圭', 11],
        ['全', 12],
        ['馬', 14],
        ['龍', 15],
        ['竜', 15]
      ];

      function goalCol(ch) {
        var i = '123456789'.indexOf(ch);
        return i >= 0 ? i : '１２３４５６７８９'.indexOf(ch);
      }

      function goalRow(ch) {
        var i = 'abcdefghi'.indexOf(ch.toLowerCase());
        if (i < 0) i = '123456789'.indexOf(ch);
        if (i < 0) i = '１２３４５６７８９'.indexOf(ch);
        if (i < 0) i = '一二三四五六七八九'.indexOf(ch);
        return i;
      }

      function parseGoalTok(tk) {
        var t = 0,
          rest = tk,
          mm = /^(\+?)([plnsgbrk])/i.exec(tk),
          i;
        if (mm) {
          var ch = mm[2].toLowerCase();
          t = mm[1] ? PPROM[ch] || 0 : PTYPE[ch];
          rest = tk.slice(mm[0].length);
        } else {
          for (i = 0; i < PKANJI.length; i++)
            if (tk.indexOf(PKANJI[i][0]) === 0) {
              t = PKANJI[i][1];

        if (f < 0 || r < 0) return null;
        return { t: t, sq: f * 9 + r };

      function toSfen(Q) {
        var L = ['', 'P', 'L', 'N', 'S', 'G', 'B', 'R', 'K'],
          rows = [],
          hs = '';
        for (var r = 0; r < 9; r++) {
          var row = '',
            e = 0;
          for (var f = 8; f >= 0; f--) {
            var p = Q.b[f * 9 + r];
            if (!p) {
              e++;
              continue;
            }
            if (e) {
              row += e;
              e = 0;
            }
            var t = p & 15,
              pro = t > 8,
              ch = L[pro ? t - 8 : t];
            row += (pro ? '+' : '') + (p >> 4 ? ch.toLowerCase() : ch);
          }
          if (e) row += e;
          rows.push(row);
        }
        [0, 1].forEach(function (c) {
          [7, 6, 5, 4, 3, 2, 1].forEach(function (t) {
            var n = Q.h[c][t];
            if (n) hs += (n > 1 ? n : '') + (c ? L[t].toLowerCase() : L[t]);
          });
        });
        return rows.join('/') + ' ' + (Q.side ? 'w' : 'b') + ' ' + (hs || '-') + ' 1';
      }

      function bodText(Q) {

          '八',

          '十二',
          '十三',
          '十四',
          '十五',
          '十六',
          '十七',
          '十八'
        ];
        var hs = function (c) {
          var x = '';
          [7, 6, 5, 4, 3, 2, 1].forEach(function (t) {
            var n = Q.h[c][t];
            if (n) x += NM[t] + K[n] + ' ';
          });
          return x.trim() || 'なし';
        };
        var t = '後手の持駒：' + hs(1) + '\n  ９ ８ ７ ６ ５ ４ ３ ２ １\n+---------------------------+\n';
        for (var r = 0; r < 9; r++) {
          var row = '|';
          for (var f = 8; f >= 0; f--) {
            var p = Q.b[f * 9 + r];
            row += p ? (p >> 4 ? 'v' : ' ') + NM[p & 15] : ' ・';

      /* 盤を180度回す。swap=true なら、駒の持ち主・持駒・手番も入れ替える */
      function edRotate(swap) {
        var old = Array.prototype.slice.call(P.b),
          i,
          p;
        for (i = 0; i < 81; i++) {
          p = old[80 - i];
          P.b[i] = swap && p ? p ^ 16 : p;
        }
        if (swap) {
          var th = P.h[0];
          P.h[0] = P.h[1];
          P.h[1] = th;
          P.side ^= 1;
        }
        for (i = 0; i < 81; i++) {
          p = P.b[i];
          if (p && (p & 15) === 8) P.k[p >> 4] = i;
        }
      }

      /* 成駒→元の駒(持駒にできる種類)。玉は 0 */
      function baseOf(t) {
        return t === 8 ? 0 : t > 8 ? (t === 14 ? 6 : t === 15 ? 7 : t - 8) : t;
      }

      function addHand(c, t) {
        if (t) P.h[c][t] = Math.min(18, P.h[c][t] + 1);
      }

      function editClick(s) {
        var p = P.b[s],
          q,
          c,
          t,
          b,
          pr,
          seq,
          cur,
          nx;
        if (sel && sel.f !== s && p && (p & 15) === 8) {
          g('msg').textContent = '玉の上には置けません';
          return;
        }
        if (sel && sel.f === 81) {
          /* 持駒 → 盤 */
          c = sel.c;
          t = sel.d;
          if (p) addHand(c, baseOf(p & 15));
          P.h[c][t]--;
          P.b[s] = t | (c << 4);
          sel = null;
        } else if (sel) {
          if (sel.f === s) {
            /* 種類切替: 自歩→自と→相歩→相と */
            c = p >> 4;
            t = p & 15;
            b = baseOf(t) || 8;
            pr = b === 8 || b === 5 ? 0 : b === 6 ? 14 : b === 7 ? 15 : b + 8;
            seq = [
              [0, b],
              [0, pr],
              [1, b],
              [1, pr]
            ].filter(function (x) {
              return x[1];
            });
            cur = 0;
            seq.forEach(function (x, i) {
              if (x[0] === c && x[1] === t) cur = i;
            });
            nx = seq[(cur + 1) % seq.length];
            P.b[s] = nx[1] | (nx[0] << 4);
            sel = null;
          } else {
            /* 盤 → 盤(先にある駒は、動かした駒の持ち主の持駒へ) */
            q = P.b[sel.f];
            if (p) addHand(q >> 4, baseOf(p & 15));
            P.b[s] = q;
            P.b[sel.f] = 0;
            sel = null;
          }
        } else if (p) sel = { f: s, tg: {} };
        render();
      }

      function editHand(c, t) {
        var p, b;
        if (sel && sel.f < 81) {
          /* 盤の駒 → その側の持駒 */
          p = P.b[sel.f];
          b = baseOf(p & 15);
          if (!b) {
            g('msg').textContent = '玉は持駒にできません';
            sel = null;
            render();
            return;
          }
          addHand(c, b);
          P.b[sel.f] = 0;
          sel = null;
        } else if (sel && sel.f === 81) {
          if (t && c === sel.c) {
            if (t === sel.d) {
              P.h[c][t]--;
              sel = null;
            } else sel = { f: 81, d: t, c: c, tg: {} };
          } else {
            if (c !== sel.c) {
              P.h[sel.c][sel.d]--;
              addHand(c, sel.d);
            }
            sel = null;
          }
        } else if (t) sel = { f: 81, d: t, c: c, tg: {} };
        render();
      }

      function m2u(m) {
        var f = m & 127,
          t = (m >> 7) & 127,
          sq = function (x) {
            return ((x / 9) | 0) + 1 + 'abcdefghi'[x % 9];
          };
        return (f === 81 ? 'PLNSGBR'[(m >> 15) - 1] + '*' : sq(f)) + sq(t) + ((m >> 14) & 1 ? '+' : '');
      }

      function u2m(u) {
        var sq = function (i) {
          return (u.charCodeAt(i) - 49) * 9 + (u.charCodeAt(i + 1) - 97);
        };
        if (u[1] === '*') return 81 | (sq(2) << 7) | (('PLNSGBR'.indexOf(u[0]) + 1) << 15);
        return sq(0) | (sq(2) << 7) | (u.length > 4 ? 16384 : 0);
      }

      async function yoFetch(key, name, asText, label) {
        try {
          var c = await to(idbGet(key), 2500);
          if (c) return c;
        } catch (e) {}
        var err = '',
          urls = ENGINE_DIRS.map(function (d) {
            return d + name;
          });
        for (var k = 0; k < urls.length; k++) {
          try {
            var r = await fetch(urls[k]);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var tot = +r.headers.get('content-length') || (asText ? 0 : SIZE_WASM),
              ch = [],
              n = 0,
              rd = r.body.getReader();
            for (;;) {
              var x = await rd.read();
              if (x.done) break;
              ch.push(x.value);
              n += x.value.length;
              if (!asText) setNN(label + ' ' + (n / 1048576).toFixed(0) + 'MB', Math.min(95, (n * 95) / tot), 1);
            }
            var u8 = new Uint8Array(n),
              o = 0;
            ch.forEach(function (q) {
              u8.set(q, o);
              o += q.length;
            });
            var val = asText ? new TextDecoder().decode(u8) : u8.buffer;
            if (!asText && n < 1e6) throw new Error('サイズ不正');
            idbPut(key, val).catch(function () {});
            return val;
          } catch (e) {
            err += e.message + ' ';
          }
        }
        throw new Error(name + ' 取得失敗: ' + err);
      }

      function yoKick() {
        if (!YO.pending || !YO.ready) return;

            (!r.sfen && hist.length

            ? 'go movetime ' + r.ms + (r.dcap ? ' depth ' + r.dcap : '') + (r.only ? ' searchmoves ' + r.only : '')
            : 'go depth ' + (r.dcap ? Math.min(D, r.dcap) : D)
        );
        clearTimeout(YO.gt);
        if (r.play)
          YO.gt = setTimeout(
            function () {
              if (YO.cur !== r || !YO.running) return;
              YO.send('stop');
              YO.gt = setTimeout(function () {

      /* 進捗: 深さごとの所要時間は約 1.5〜2.5 倍ずつ増えるので、実測の増加率から終了までの時間を見積もる */
      /* 進捗: 各深さの最初の行が出た時刻から反復1回分の所要時間を測り、増加率で「深さDの反復が終わる時刻」を見積もる */
      function yoProg(r, D) {
        var el = Date.now() - r.t0,
          p;
        if (r.ms) return Math.min(99, (el * 100) / r.ms);
        var ds = Object.keys(r.dt)
            .map(Number)
            .sort(function (x, y) {
              return x - y;
            }),
          n = ds.length;
        if (n < 4) p = Math.min(8, (r.depth * 100) / D / 3);
        else {
          var du = [],
            q;
          for (q = n - 4; q < n - 1; q++) du.push(Math.max(1, r.dt[ds[q + 1]] - r.dt[ds[q]]));
          var ratio = Math.max(1.9, Math.min(3, (du[1] / du[0] + du[2] / du[1]) / 2)),
            est = r.dt[ds[n - 1]],
            d = du[2];
          for (var j = ds[n - 1] + 1; j <= D + 1; j++) {
            d *= ratio;
            est += d;
          }
          if (el > est) est = el * 1.25;
          p = Math.min(95, (el * 100) / est);
        }
        r.pm = Math.max(r.pm, p);
        return r.pm;
      }

      function yoPaint(r, done) {

        arr.sort(function (a, b) {

        });
        var D = Math.max(1, num('D')),
          el = ((Date.now() - r.t0) / 1000).toFixed(1);
        r.shown = {
          t: 'p',
          id: r.id,
          play: r.play,
          ev: r.ev,
          pct: done ? 100 : yoProg(r, D),
          worst: r.mpv > 5 && arr.length > 1 ? arr[arr.length - 1] : null,

      function yoLine(l) {
        if (l === 'readyok') {
          YO.ready = true;
          YO.netReady = !!netBuf;
          nnOk = 1;
          setNN(netBuf ? 'やねうら王 + ' + netName : 'やねうら王(内蔵:水匠5)', 100, 0);
          if (YO.pending) yoKick();
          nnCheck();
          return;
        }
        if (l.indexOf('bestmove') === 0) return yoBest(l);
        if (l.indexOf('info ') !== 0 || l.indexOf('info string') === 0) return;
        var r = YO.cur;
        if (!r || r.id !== gid) return;
        if (l.indexOf(' lowerbound') > 0 || l.indexOf(' upperbound') > 0) return;
        var mp = /multipv (\d+)/.exec(l),
          sc = /score (cp|mate) (-?\d+)/.exec(l),
          pv = / pv (\S+)/.exec(l),
          pvA = / pv (.+)$/.exec(l),
          dp = /depth (\d+)/.exec(l);
        if (!sc || !pv || !dp) return;
        var v = +sc[2],
          s = sc[1] === 'cp' ? v : v > 0 ? 30000 - v : -30000 - v;
        var mv = u2m(pv[1]);
        if (legal(r.Q || P).indexOf(mv) < 0) return;
        r.mv[mv] = { m: mv, s: s, d: +dp[1], k: mp ? +mp[1] : 1, pv: pvA ? pvA[1].trim().split(/\s+/) : [pv[1]] };
        if (!mp || +mp[1] === 1) r.ev = s;
        r.depth = Math.max(r.depth, +dp[1]);
        /* 詰みが見つかったら、時間いっぱい深度だけ増やし続けないよう打ち切る(時間指定の探索のみ) */
        if (
          r.ms &&
          !r.scan &&
          !r.stopped &&
          (!mp || +mp[1] === 1) &&
          Math.abs(s) > 29000 &&
          +dp[1] >= 6 &&
          YO.cur === r &&
          YO.running
        ) {
          r.stopped = 1;
          YO.send('stop');
        }
        /* 早指し: 最善手が4つの深さ続けて変わらず、時間の45%を過ぎたら、そこで打ち切る */
        if (r.bmd && (!mp || +mp[1] === 1)) {
          r.bmd[+dp[1]] = mv;
          var dd = +dp[1];
          if (
            r.play &&
            r.ms &&
            r.eco &&
            !r.scan &&
            !r.stopped &&
            dd >= 10 &&
            r.bmd[dd - 1] === mv &&
            r.bmd[dd - 2] === mv &&
            r.bmd[dd - 3] === mv &&
            Date.now() - r.t0 > r.ms * 0.45 &&
            YO.cur === r &&
            YO.running
          ) {
            r.stopped = 1;
            YO.send('stop');
          }
        }
        if (!r.dt[+dp[1]]) r.dt[+dp[1]] = Date.now() - r.t0;
        if (r.scan) return;
        if (Date.now() - r.ui > 150) {
          r.ui = Date.now();
          yoPaint(r, 0);
        }
      }

      function yoFail() {
        YO.state = 'fail';
        YO.why = 'やねうら王が応答しなくなった';
        YO.running = false;
        YO.cur = null;
        YO.pending = false;
        g('nnB').textContent = 'WASM応答なし→自作エンジン';
        ensureJsNet();
        if (!over && !paused && !editing) next();
      }
      /* 最善手との評価差が許容内の候補から、評価差で重み付けしてランダムに選ぶ */
      var MAXDROP = 150;
      /* d=深さ制限, k=ばらつき(序盤)の倍率, T=許す評価値の下がり幅(cp), n=候補の数。T=0 は悪手を混ぜない(最強) */
      var LVS = [
        null,
        { d: 1, k: 3, T: 700, n: 20 },
        { d: 2, k: 2.5, T: 400, n: 12 },
        { d: 5, k: 2, T: 220, n: 8 },
        { d: 7, k: 1.6, T: 140, n: 6 },
        { d: 9, k: 1.3, T: 90, n: 5 },
        { d: 11, k: 1.1, T: 60, n: 5 },
        { d: 13, k: 1, T: 40, n: 5 },
        { d: 15, k: 1, T: 25, n: 5 },
        { d: 18, k: 1, T: 15, n: 5 },
        { d: 22, k: 1, T: 8, n: 5 },
        { d: 0, k: 1, T: 0, n: 0 }
      ];

      function lvOf() {
        return LVS[+g('lv').value] || LVS[11];
      }

      function pickVar(arr, bm) {
        var lv = lvOf(),
          weak = lv.T > 0,
          T = +g('rnd').value,
          best = null,
          i,
          j;
        /* 「手のばらつき」: 序盤ほど大きく、手数が進むと小さくなる。ただし序盤は意味のない手を避けるため最大50cp */
        if (T) {
          T = Math.min(T * (4 / (1 + Math.exp((hist.length - 15) / 5))) * lv.k, MAXDROP);
          if (hist.length < 12) T = Math.min(T, 50);
        }
        /* 強さレベル: 弱いレベルほど、評価の悪い手も選ぶ。序盤は評価値の差が小さく自然さを保つため許容を小さくし、30手目で全開 */
        if (weak) T = Math.max(T, lv.T * Math.max(0.12, Math.min(1, (hist.length - 4) / 26)));
        if (!T || arr.length < 2 || T < 1) return bm;
        for (i = 0; i < arr.length; i++) if (arr[i].m === bm) best = arr[i];
        if (!best || Math.abs(best.s) > 29000) return bm;
        var c = arr.filter(function (x) {
          return (
            x.d >= best.d - 2 &&
            Math.abs(x.s) < 29000 &&
            x.s >= best.s - T &&
            (T >= 400 || best.s <= MAXDROP || x.s > 0)
          );
        });
        if (c.length < 2) return bm;
        var w = c.map(function (x) {
            return Math.exp((-1.5 * (best.s - x.s)) / T);
          }),
          tot = 0,
          rv;
        for (j = 0; j < w.length; j++) tot += w[j];
        rv = Math.random() * tot;
        for (j = 0; j < c.length; j++) {
          rv -= w[j];
          if (rv <= 0) return c[j].m;
        }
        return bm;
      }
      /* 全手を短時間だけ評価し直す(最悪手と、上位5手の外の手の順位・最善比を出すため) */
      function yoScanStart(r, fin) {
        var n = legal(P).length;
        if (n < 6 || n <= r.mpv) {
          if (fin) fin();
          return;
        }
        YO.req = {
          id: gid,
          scan: 1,
          parent: r,
          fin: fin,
          play: false,
          ms: r.play ? 700 : 1500,
          dcap: 0,
          mpv: Math.min(n, 300),
          mv: {},
          dt: {},
          depth: 0,
          cdepth: 0,
          pm: 0,
          ui: 0
        };
        YO.pending = true;
        yoKick();
      }

      function yoScanDone(r) {
        var arr = Object.keys(r.mv).map(function (k) {
          return r.mv[k];
        });
        arr.sort(function (a, b) {
          return (b.d === r.depth) - (a.d === r.depth) || b.s - a.s || a.k - b.k;
        });
        if (arr.length > 1) {
          var sm = Object.assign(
            { t: 'p', id: gid, play: r.parent.play, list: [], ev: r.parent.ev, info: '' },
            r.parent.shown || {}
          );
          sm.worst = arr[arr.length - 1];
          sm.pct = 100;
          showList(sm);
          if (curAn) curAn.all = arr;
        }
        if (r.fin) r.fin();
      }

      function yoBest(l) {
        clearTimeout(YO.gt);
        var r = YO.cur;
        YO.running = false;
        YO.cur = null;
        if (YO.pending) {
          yoKick();
          return;
        }
        if (r && r.ex) {
          if (r.id === gid) r.ex(r, 1);
          return;
        }
        if (!r || r.id !== gid || over) return;
        if (r.scan) {
          yoScanDone(r);
          return;
        }
        yoPaint(r, 1);
        if (!r.play) {
          yoScanStart(r, null);
          return;
        }
        var u = l.split(/\s+/)[1];
        if (u === 'resign') {
          finish(sideN(P.side) + '投了', P.side ^ 1, '投了');
          return;
        }
        if (u === 'win') {
          finish('入玉宣言で' + sideN(P.side) + 'の勝ち', P.side, '入玉勝ち');
          return;
        }
        var m = u2m(u),
          ls = legal(P);
        if (ls.indexOf(m) < 0) m = ls[0];
        var gm = r.guide ? guideChoose(r, m) : 0;
        m =
          gm ||
          pickVar(
            Object.keys(r.mv).map(function (k) {
              return r.mv[k];
            }),
            m
          );
        if (ls.indexOf(m) < 0) m = ls[0];
        var fin = function () {
          doMove(m);
        };
        if (g('showA').checked) yoScanStart(r, fin);
        else fin();
      }

      /* ===== 定跡ブック(Floodgateの高レート棋譜から作成し、VS AIで使う) ===== */
      var BKS = { w: null, tab: 'make', busy: 0, cancel: 0, opt: null, src: '' },
        BKA = null,
        bkNote = '',
        bkKey = -1,
        bkVal = '';
      var BK_YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011];
      var BK_MIRROR = 'https://mathotagamma.github.io/wdoor-getter/wdoor{year}.7z';

      function bkLS(k, d) {
        try {
          var v = localStorage.getItem(k);
          return v === null ? d : v;
        } catch (e) {
          return d;
        }
      }

      function bkSetLS(k, v) {
        try {
          localStorage.setItem(k, v);
        } catch (e) {}
      }

      function bkMeta() {
        try {
          return JSON.parse(bkLS('shogiBkMeta', '[]')) || [];
        } catch (e) {
          return [];
        }
      }

      function bkEsc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function bkUse() {
        return !!BKA && bkLS('shogiBkUse', '1') === '1';
      }

      /* 定跡のパート: 先手がする定跡=タグ0 / 後手がする定跡=タグ1 / 区別なし=タグ-1 */
      function bkPartsOf(B) {
        return B ? B.parts : [];
      }

      function bkTagged(B) {
        return bkPartsOf(B).some(function (p) {
          return p.tag >= 0;
        });
      }

      /* 定跡を行うのは 'me'(自分) か 'ai'(AI) */
      function bkWho() {
        return bkLS('shogiBkWho', 'me') === 'ai' ? 'ai' : 'me';
      }

      /* 対局(VS AI)でその定跡を行う側の手番: 自分がやるなら自分の手番、AIがやるならAIの手番 */
      function bkDoer() {
        return bkWho() === 'ai' ? 1 - human : human;
      }

      /* 使うパート。対局(VS AI)では行う側のパート、研究・探索では全部 */
      function bkActiveParts(all) {
        var s = !all && mode === 'vs' && !aiAI ? bkDoer() : -1;
        return bkPartsOf(BKA).filter(function (p) {
          return s < 0 || p.tag === s || p.tag < 0;
        });
      }

      function bkSetWho(v) {
        bkSetLS('shogiBkWho', v === 'ai' ? 'ai' : 'me');
        bkSyncWho();
        bkKey = -1;
        bkcKey = '';
        if (BKX.Q && g('bkxBook')) bkxPaintBook();
        bkcPaint();
      }

      function bkSyncWho() {
        ['bkWho', 'bkWhoM'].forEach(function (id) {
          if (g(id)) g(id).value = bkWho();
        });
      }

      function bkMax() {
        return +bkLS('shogiBkMax', '999') || 999;
      }

      /* AIの手番で定跡を使う(1)か、無視してエンジンで考える(0)か */
      function bkSetUse(on) {
        bkSetLS('shogiBkUse', on ? '1' : '0');
        bkKey = -1;
        bkcKey = '';
        var a = g('bkUse'),
          b = g('bkUseM');
        if (a) a.checked = !!on;
        if (b) b.checked = !!on;
        bkcPaint();
      }

      async function idbDel(k) {
        var d = await idb();
        return new Promise(function (res, rej) {
          var t = d.transaction('f', 'readwrite');
          t.objectStore('f').delete(k);
          t.oncomplete = res;
          t.onerror = function () {
            rej(t.error);
          };
        });
      }

      async function bkLoad(id) {
        BKA = null;
        bkKey = -1;
        if (!id) return;
        try {
          var d = await idbGet('bk:' + id);
          if (d && d.parts) {
            BKA = d;
            BKA.id = id;
          }
        } catch (e) {}
        BKX.Q = null;
        bkcPaint();
      }

      /* 現在の局面の定跡手(出現数の多い順、合法手のみ) */
      function bkMoves(Q, all) {
        Q = Q || P;
        if (!BKA) return [];
        var h = hashP(Q),
          acc = {},
          order = [];
        bkActiveParts(all).forEach(function (Pt) {
          var K = Pt.keys,
            lo = 0,
            hi = K.length - 1,
            ix = -1;
          while (lo <= hi) {
            var mid = (lo + hi) >> 1;
            if (K[mid] === h) {
              ix = mid;
              break;
            }
            if (K[mid] < h) lo = mid + 1;
            else hi = mid - 1;
          }
          if (ix < 0) return;
          for (var i = Pt.off[ix]; i < Pt.off[ix + 1]; i++) {
            var mv = Pt.mv[i];
            if (!acc[mv]) {
              acc[mv] = { m: mv, c: 0, w: 0 };
              order.push(mv);
            }
            acc[mv].c += Pt.cnt[i];
            acc[mv].w += Pt.win[i];
          }
        });
        var ls = legal(Q),
          out = [];
        order.forEach(function (mv) {
          if (ls.indexOf(mv) >= 0) out.push(acc[mv]);
        });
        out.sort(function (a, b) {
          return b.c - a.c;
        });
        return out;
      }

      function bkText(ls) {
        return ls
          .map(function (x) {
            return (P.side ? '△' : '▲') + mvT(x.m) + ' ' + x.c + '局(勝率' + Math.round((x.w * 100) / x.c) + '%)';
          })
          .join(' / ');
      }

      /* 評価値リストの右の定跡コンテナ(採用数順が標準。勝率順に切り替え可) */
      var bkSort = 'c',
        bkcKey = '',
        bkOff = -1;

      function bkcPaint() {
        var el = g('bkc');
        if (!BKA) {
          el.hidden = true;
          return;
        }
        el.hidden = false;
        var on = bkLS('shogiBkUse', '1') === '1',
          key = hashP(P) + '|' + bkSort + '|' + hist.length + '|' + BKA.id + '|' + on + '|' + bkWho() + human + mode;
        if (key === bkcKey) return;
        bkcKey = key;
        var ls = bkMoves().slice(),
          tot = 0,
          mx = 1,
          last = hist.length ? hist[hist.length - 1] : null,
          vs = mode === 'vs',
          tagged = bkTagged(BKA);
        ls.forEach(function (x) {
          tot += x.c;
          if (x.c > mx) mx = x.c;
        });
        ls.sort(function (a, b) {
          return bkSort === 'w' ? b.w / b.c - a.w / a.c || b.c - a.c : b.c - a.c || b.w - a.w;
        });
        if (!hist.length) bkOff = -1;
        else if (ls.length) {
          if (bkOff > hist.length) bkOff = -1;
        } else if (bkOff < 0 || bkOff > hist.length) bkOff = hist.length;
        var seg = function (cur, items) {
          return (
            '<span class="seg">' +
            items
              .map(function (x) {
                return '<button data-s="' + x[0] + '"' + (cur === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>';
              })
              .join('') +
            '</span>'
          );
        };
        var h = '<div class="bkh">定跡 <small>' + bkEsc(BKA.name || '') + '</small></div>';
        /* いまの状況 */
        if (vs && P.side !== human)
          h += on
            ? ls.length
              ? '<div class="bkn" style="color:#8f8">→ AIは定跡で指します</div>'
              : '<div class="bkn" style="color:#fa8">→ 定跡外。AIはエンジンで指します</div>'
            : '<div class="bkn" style="color:#fa8">→ 無視設定。AIはエンジンで指します</div>';
        if (bkOff >= 0) h += '<div class="bkn" style="color:#fa8">' + bkOff + '手目から定跡外' + (BKA.minCnt > 1 ? '(出現' + BKA.minCnt + '局未満は除外)' : '') + '</div>';
        if (last && last.inf && last.inf.indexOf('定跡') === 0) h += '<div class="bkn" style="color:#8f8">直前は' + bkEsc(last.inf) + '</div>';
        /* 次の手の一覧 */
        h += '<div class="bkn">次の手 ' + ls.length + '通り・計' + tot + '局 ' + seg(bkSort, [['c', '採用数順'], ['w', '勝率順']]) + '</div>';
        if (!ls.length) h += '<div style="color:#aaa">この局面は定跡なし</div>';
        else {
          h += '<div class="r bkn"><span>手</span><b>採用</b><b>勝率</b></div>';
          ls.forEach(function (x) {
            var pc = Math.round((x.c / mx) * 100);
            h += '<div class="r" style="background:linear-gradient(90deg,#355a35 ' + pc + '%,transparent ' + pc + '%)"><span>' + (P.side ? '△' : '▲') + mvT(x.m) + '</span><b>' + x.c + '局</b><b>' + Math.round((x.w * 100) / x.c) + '%</b></div>';
          });
        }
        /* 設定 */
        h += '<div class="bks"><div>AIの手番 ' + seg(on ? 'u1' : 'u0', [['u1', '定跡を使う'], ['u0', '無視する']]) + '</div>';
        if (tagged && vs && !aiAI) {
          var dsd = bkDoer(),
            who = bkWho();
          h += '<div>定跡を行うのは ' + seg(who === 'ai' ? 'wa' : 'wm', [['wm', '自分'], ['wa', 'AI']]) + '</div>' +
            '<div class="bkn" style="color:#fc6">' + (who === 'ai' ? 'AIは' + (1 - human ? '後手' : '先手') : '自分は' + (human ? '後手' : '先手')) + 'なので、' + (dsd ? '後手' : '先手') + 'の定跡を使用中</div>';
        } else if (tagged) h += '<div class="bkn">' + (aiAI ? 'AI vs AI' : '研究') + ': 先手・後手の定跡を合わせて使用</div>';
        el.innerHTML = h + '</div>';
      }

      /* AIの手番で定跡の手があれば、それを指す(指したら true) */
      function bkTry() {
        if (!bkUse() || mode !== 'vs' || P.side === human || hist.length >= bkMax()) return false;
        var ls = bkMoves();
        if (!ls.length) return false;
        var ws = ls.map(function (x) {
            return 0.6 * x.c + 0.8 * x.w;
          }),
          tot = 0,
          i;
        for (i = 0; i < ws.length; i++) tot += ws[i];
        var rv = Math.random() * tot,
          pk = ls[0];
        for (i = 0; i < ls.length; i++) {
          rv -= ws[i];
          if (rv <= 0) {
            pk = ls[i];
            break;
          }
        }
        var id = ++gid;
        yoStop();
        if (busy) {
          W.postMessage({ cmd: 'stop' });
          busy = 0;
        }
        g('bar').firstChild.style.width = '100%';
        g('cand').innerHTML =
          (lastInfo ? '<div>直前: ' + lastInfo + '</div>' : '') +
          '<div style="color:#8f8">定跡で指します</div><div>' + bkText(ls.slice(0, 5)) + '</div>';
        g('msg').textContent = '定跡で指します';
        setTimeout(
          function () {
            if (gid !== id || over || paused || editing || P.side === human) return;
            if (legal(P).indexOf(pk.m) < 0) return;
            bkNote = '定跡 ' + pk.c + '局 勝率' + Math.round((pk.w * 100) / pk.c) + '%';
            doMove(pk.m);
          },
          350 + Math.random() * 450
        );
        return true;
      }

      function buildBook() {

        g('bk').innerHTML =

          '<div id="bkP" style="margin-top:6px"></div><div id="bkS" style="font-size:12px;color:#aaa"></div>' +

          '<div id="bkList" hidden></div>' +
          '<div id="bkExp" hidden>' +
          '<div id="bkxPath" style="margin:6px 0;word-break:break-all"></div>' +
          '<div id="bkxBd"></div>' +
          '<div style="margin:6px 0"><button data-a="xb">戻る</button> <button data-a="xr">最初から</button> <button data-a="xc">対局の局面から</button> <button data-a="xp">この局面から対局</button> <button data-a="xf">反転</button></div>' +
          '<div style="margin:6px 0;font-size:13px">AI <input type="number" id="bkxSec" value="3" min="1" style="width:50px">秒 <select id="bkxMpv"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>候補 <button data-a="xa">再解析</button> / 自動展開 <input type="number" id="bkxN" value="6" min="1" style="width:50px">手 <button data-a="xauto">開始</button> <button data-a="xstop">止める</button></div>' +
          '<div id="bkxBook"></div><div id="bkxAna"></div>' +
          '</div>';
        g('bkRate').value = bkLS('shogiBkRate', '3800');
        g('bkUrl').value = bkLS('shogiBkUrl', '');
        g('bkc').onclick = function (e) {

          }

          else if (b.dataset.a === 'pick') g('bkFile').click();

          else if (b.dataset.a === 'xb') bkxBack();
          else if (b.dataset.a === 'xr') bkxReset(0);
          else if (b.dataset.a === 'xc') bkxReset(1);
          else if (b.dataset.a === 'xa') bkxAnalyze();
          else if (b.dataset.a === 'xf') {
            BKX.flip ^= 1;
            bkxPaintBoard();
          }
          else if (b.dataset.a === 'xauto') {
            BKX.auto = Math.max(1, +g('bkxN').value || 6);
            if (BKX.ana && BKX.ana.done && BKX.ana.list.length) {
              BKX.auto--;
              bkxApply(BKX.ana.list[0].m);
            } else bkxPaintAna();
          } else if (b.dataset.a === 'xstop') {
            BKX.auto = 0;
            bkxPaintAna();
          } else if (b.dataset.a === 'xs') {
            BKX.sort = b.dataset.v;
            bkxPaintBook();
          } else if (b.dataset.a === 'xp') {
            g('bk').hidden = true;
            BKS.wasEx = false;
            bkxStopEng();
            BKX.auto = 0;
            newGame(clonePos(BKX.Q));
          }
          else if (b.dataset.a === 'del') bkDelete(b.dataset.id);

        g('bk').onchange = function (e) {
          var t = e.target;
          if (t.id === 'bkFile') {
            var fs = Array.from(t.files);
            t.value = '';
            if (fs.length) bkGo(fs);
          } else if (t.id === 'bkImp') {
            if (t.files[0]) bkImport(t.files[0]);
            t.value = '';
          } else if (t.id === 'bkWho') {
            bkSetWho(t.value);
          } else if (t.id === 'bkxSec') {
            BKX.sec = Math.max(1, +t.value || 3);
          } else if (t.id === 'bkxMpv') {
            BKX.mpv = +t.value || 5;
            bkxAnalyze();
          } else if (t.id === 'bkCnt') {
            BKS.cntDirty = 1;
          } else if (t.id === 'bkPatT') {
            if (!BKS.cntDirty) g('bkCnt').value = t.value === 'none' ? 2 : 1;
            g('bkPatMoves').hidden = t.value !== 'moves';
            g('bkPatOwn').hidden = t.value !== 'own';
            g('bkPatWho').hidden = t.value !== 'own' && t.value !== 'form';
            g('bkPatForm').hidden = t.value !== 'form';

            bkSetUse(t.checked);
          } else if (t.id === 'bkMax') bkSetLS('shogiBkMax', String(Math.max(1, +t.value || 30)));
          else if (t.name === 'bkSel') {
