<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solo | AI Creator Battle</title>
    <link rel="stylesheet" href="https://mathotagamma.github.io/statics/main-style.css" />
    
    <link rel="stylesheet" href="https://mathotagamma.github.io/ai-creator-battle/header-template-style.css" />
    
    <script type="module" src="https://mathotagamma.github.io/statics/main-script.js"></script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      main {
        width: 100%;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .top-area {
        flex-grow: 1;
        position: relative;
        max-width: 100%;
      }
      
      #alert-div {
        position: absolute;
        top: 10px;
        left: 7px;
        font-weight: bold;
        color: red;
        border: 1px solid grey;
        display: inline-block;
        padding: 2px;
        margin: 10px;
        
        background: rgba(255, 255, 255, 0.7);
      }

      #btn-container {
        margin: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        background: white;
        border: 1px solid black;
        border-radius: 10px;
        min-width: 200px;
        min-height: 75px;
        font-size: 20px;
      }
      
      label {
        /* 空白を見えるようにする */
        font-family: monospace;
      }
      
      #game-screen-canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid black;
        
      }
      
      
      .is-hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="header-container"></div>
    <main>
      <div class="top-area" id="top-area-div">
        <canvas id="game-screen-canvas"></canvas>
        <div id="alert-div">
          Google Driveに接続中です。しばらくお待ちください。
        </div>
      </div>
      <div class="dock-bottom-area" data-height="150px">
        <div class="dock-bottom-bar"></div>
        <div class="dock-content">
          <!-- pre-start -->
          <div class="items pre-start is-hidden">
            <select id="game-select"></select>
            <input type="button" onclick="trainStart();" value="学習開始" />
            <input type="button" onclick="workStart();" value="動作確認開始" />
            <span>
              間隔...<label id="span-range-label">&nbsp;&nbsp;5</label>:<input type="range" id="span-range" min="5" max="5" step="5" />
            </span>
          </div>
          <!-- training -->
        </div>
      </div>
    </main>

    <script type="module">
      import { CogniKeel, Layer } from 'https://mathotagamma.github.io/APIs/CogniKeel/1-03-01/CogniKeel.js';
      import { createHeader } from 'https://mathotagamma.github.io/ai-creator-battle/header-template-script.js';
      import { DriveManager, mergeMissingKeys } from 'https://mathotagamma.github.io/ai-creator-battle/drive-manager.js';
      import { Cartpole, Breakout } from 'https://mathotagamma.github.io/ai-creator-battle/env.js';
      
      import gameInfoJson from 'https://mathotagamma.github.io/ai-creator-battle/game-info.json' with { type: 'json' };

      const alertDiv = document.getElementById('alert-div');
      const btnContainer = document.getElementById('btn-container');
      
      const gameSelect = document.getElementById('game-select');
      const spanRangeLabel = document.getElementById('span-range-label');
      const spanRange = document.getElementById('span-range');
      
      const topAreaDiv = document.getElementById('top-area-div');
      const gameScreenCanvas = document.getElementById('game-screen-canvas');

      let hasDriveConnection = false;
      
      let entirelyLayersInfo = null;
      let userUsableInfo = null;

      /*
        initializing...initを実行中
        exit...退出した。(リロード、退出待ち)
        drawing...描画中
        usually...通常
      */
      let status = "initializing";
      
      let currentGameKind;
      let Env;
      let env;
      const appDataDirectory = '/application-data/ai-creator-battle/';
      const MCLMs = {};
      let ck;

      function logger(message, _) {
        console.log(message);
      }

      const driveManager = new DriveManager({
        clientId: '673216051028-hjomu6c8livrv4ga0c0f37o3i3qt0dso.apps.googleusercontent.com',
        redirectUri: 'https://mathotagamma.github.io/statics/drive-api/oauth2callback',
        appDataDirectory,
        onLog: (message, duration) => logger(message, duration),
        onLoginWithAnotherEmail: (prevEmail, newEmail) => {
          alert(`以前とは異なるアカウントでログインしました(前回:${prevEmail})。\nホームに戻ります。`);
          location.href = '../';
        },
      });

      // ===== Headerテンプレートを組み込み =====
      // onSignIn/onSignOut/onCheckがthrowすれば、Header側が自動で
      // 「進行中 -> 失敗しました」のステータス表示に切り替えてくれる。
      const header = createHeader({
        title: 'Solo | AI Creator Battle',
        drive: {
          onCheck: async () => {
            return driveManager.checker();
          },
          onSignIn: async () => {
            const ok = await driveManager.init();
            hasDriveConnection = driveManager.checker().ok;
            // init()がfalseを返した(=失敗した)場合は明示的にthrowして
            // Header側に「失敗しました」を表示させる。
            if (!ok)
              throw new Error('Google連携に失敗しました。');
          },
          onSignOut: async () => {
            const ok = await driveManager.signOut();
            hasDriveConnection = false;
            if (!ok)
              throw new Error('Sign Outに失敗しました。');
          },
          getUserInfo: async () => {
            const checkStatus = driveManager.checker();
            if (!checkStatus.ok)
              return null;
            const res = await driveManager.getAbout('user(displayName, photoLink)');
            if (res == null)
              return null;
            return {
              displayName: res.user.displayName,
              photoLink: res.user.photoLink
            };
          }
        }
      });
      document.getElementById('header-container').appendChild(header.element);
      
      
      
      // ===== ボタンの押下処理 =====
      window.trainStart = async () => {
        currentGameKind = gameSelect.value;
        if (!(currentGameKind in MCLMs)) {
          alert('mclmファイルが見つかりませんでした。');
          return;
        }
        const mclm = MCLMs[currentGameKind];
        switch (currentGameKind) {
          case 'cartpole':
            Env = Cartpole;
            break;
          case 'breakout':
            Env = Breakout;
            break;
        }
        
        env = new Env({ inputIdx: userUsableInfo.userInfo.game[Env.gameKind], canvas: gameScreenCanvas });
        // console.log(JSON.stringify(env.step({ action: 0 }), null, 2));
        
        draw('working');
        alertDiv.innerHTML = "学習中...";
        console.log('start');
        try {
          ck = await CogniKeel.fromMCLM({
            mclm,
            onLog: console.log,
            weightsInclude: false
          });
          
          gameScreenResize();
          
          let lastDraw = 0;
          let isFastMode = false;
          let epochCount = 0;
          const epochCountLength = 500;
          let episodeCount = 0;
          const episodeCountLength = 300;
          let done = false;
          
          const drawInterval = 100;
          
          env.reset();
          let state = env.getCurrentState();
          
          function loop() {
            try {
              const end = performance.now() + (isFastMode ? 16 : 0);
              let retData;
              
              // 繰り返す処理
              do {
                const action = 1 ?? ck.step(state).action;
                if (epochCount >= epochCountLength)
                  retData = env.step({ action, done: true });
                else
                  retData = env.step({ action });
                
                done = retData.done;
                state = retData.nextState;
                
                if (done) {
                  epochCount = 0;
                  episodeCount++;
                  if (episodeCount >= episodeCountLength) {
                    env.draw();
                    return;
                  }
                }
                
                epochCount++;
              } while (performance.now() < end);
            
              // 指定間隔経っていたら描画
              if (!isFastMode || performance.now() - lastDraw >= drawInterval) {
                env.draw();
                lastDraw = performance.now();
              }
            } catch(err) {
              throw err;
            }
            requestAnimationFrame(loop);
          }
          
          loop();
        } catch(err) {
          console.log(err.message);
        }
      }
      
      window.workStart = () => {
        currentGameKind = gameSelect.value;
        
        switch (currentGameKind) {
          case 'cartpole':
            Env = Cartpole;
            break;
          case 'breakout':
            Env = Breakout;
            break;
        }
        
        env = new Env(userUsableInfo.userInfo.game[Env.gameKind]);
      }
      
      // ===== 描画関数 =====
      /*
        process...
         - pre-start: 学習(又は動作確認)開始前
         - taining: 学習中
         - train-working: 学習中の動作確認
         - preserving: 重み保存中
         
         - working: 保存された重みによる動作確認
      */
      function draw(process) {
        if (process === "pre-start") {
          
          // console.log(JSON.stringify(userUsableInfo, null, 2));
          // console.log(JSON.stringify(entirelyLayersInfo, null, 2));
          // console.log(JSON.stringify(gameInfoJson, null, 2));
          
          
          const gameKinds = Object.keys(userUsableInfo.userInfo.solo);
          gameSelect.innerHTML = '';
          const firstGameKind = gameKinds[0];
          for (let gameKind of gameKinds) {
            const option = document.createElement('option');
            option.innerHTML = gameKind;
            if (gameKind === firstGameKind)
              option.selected = true;
            gameSelect.appendChild(option);
          }
          
          spanRange.max = String(gameInfoJson[firstGameKind].spanMax);
          spanRange.step = String(gameInfoJson[firstGameKind].spanStep);
          spanRange.value = spanRange.max;
          spanRangeLabel.innerHTML = spanRange.value.padStart(3, '\xa0');
          
          gameSelect.onchange = () => {
            spanRange.max = String(gameInfoJson[gameSelect.value].spanMax);
            spanRange.step = String(gameInfoJson[gameSelect.value].spanStep);
            spanRange.value = spanRange.max;
            spanRangeLabel.innerHTML = spanRange.value.padStart(3, '\xa0');
          }
           
          spanRange.oninput = () => {
            spanRangeLabel.innerHTML = spanRange.value.padStart(3, '\xa0');
          }
        }
        
        // ===== 現在のprocessに合わせて.is-hiddenを付け外しする。
        const elements = document.getElementsByClassName('items');
        for (let element of elements) {
          if (element.classList.contains(process))
            element.classList.remove('is-hidden');
          else
            element.classList.add('is-hidden');
        }
      }
      
      function gameScreenResize() {
        if (Env == null || env == null)
          return;
        const aspectRatio = Env.aspectRatio;
        const w = topAreaDiv.offsetWidth;
        const h = topAreaDiv.offsetHeight;
        gameScreenCanvas.height = h;
        gameScreenCanvas.width = w;
        
        // 横長
        if (w > h*aspectRatio) {
          env.fixedAspect = 'height';
        } else { // 縦長
          env.fixedAspect = 'width';
        }
      }
      
      // topAreaDivのリサイズを取得
      const observer = new ResizeObserver(gameScreenResize);
      
      observer.observe(topAreaDiv);
      
      // ===== 初期化 =====

      async function init() {
        header.setStatus('Google Driveに接続中...', 'progress');

        await driveManager.init();

        // Header側のユーザー情報表示も同期
        await header.updateGoogleUI();

        const ok = await driveConnect();

        if (!ok) {
          header.setStatus('接続できませんでした。', 'error');
          status = "exit";
          return;
        }

        header.setStatus('接続しました。', 'success');
        status = "drawing";

        alertDiv.innerHTML = 'Driveに接続しました。ページの描画中...';
        alertDiv.style.color = "black";
        
        draw('pre-start');
        
        alertDiv.innerHTML = '準備完了。「学習開始」「動作確認開始」を押して開始。';
      }

      async function driveConnect() {
        if (status === "exit")
          return;
        alertDiv.innerHTML = 'Google Driveとの接続状況を取得中です。';
        hasDriveConnection = await driveManager.checker().ok;

        if (!hasDriveConnection) {
          alert('Google Driveと連携できませんでした。再度お試しください。');
          alertDiv.innerHTML = 'Google Driveに接続できませんでした。<br>ページのリロードをお試しください。';
          status = "exit";
          return false;
        }
        let ok = false;

        alertDiv.innerHTML = 'Google Driveからアプリデータ内ファイルを取得中。しばらくお待ち下さい。';
        entirelyLayersInfo = await driveManager.getFile({
          path: 'entirely-layers-info.json'
        });
        ok = entirelyLayersInfo != null;
        if (ok) {
          userUsableInfo = await driveManager.getFile({
            path: 'user-usable-info.json'
          });
          ok = userUsableInfo != null;
        }

        if (!ok) {
          if (confirm('Google Driveに、必要なデータが構築されていません。一度、「モデルを編集」ページを訪れる必要があります。\nページを移動しますか？'))
            window.location.href = '../model-editor/';
          alertDiv.innerHTML = 'Google Driveに、必要なデータが構築されていません。<br>一度、「モデルを編集」ページを訪れる必要があります。<br><a href="../model-editor/">モデルを編集</a>';
          status = "exit";
          return false;
        }
        
        // MCLMを取得。
        const gameKinds = Object.keys(userUsableInfo.userInfo.solo);
        for (let gameKind of gameKinds) {
          const path = 'mclm/'+gameKind+'.mclm';
          if (!await driveManager.existCheck(path)) {
            console.log(gameKind+'はMCLMファイルが見つかりませんでした。');
            continue;
          }
          console.log(await driveManager.existCheck(path));
          let mclm;
          try {
            mclm = await driveManager.getFile({
              path
            });
          } catch(err) {
            console.log(err.message);
          }
          
          if (mclm != null) {
            console.log(gameKind+'はMCLMファイルが見つかりました。');
            MCLMs[gameKind] = mclm;
          }
        }
        
        alertDiv.innerHTML = 'Google Driveに正常に接続できました。<br>AIを実行するゲームを選んでください。';
        // OK
        return true;
      }

      init();
    </script>
  </body>
</html>
