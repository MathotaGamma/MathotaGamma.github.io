<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>Truss</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      html {
        font-size: 20px;
      }
      html, body {
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        overflow:hidden;
        touch-action: none;
      }
      #canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      
      .main-btn {
        border-radius: 0px;
        width: 75px;
        height: 40px;;
        font-size: 1rem;
        z-index: 499;
      }
      
      #to-editor {
        position: absolute;
        left: 50px;
        top: 30px;
      }
      
      #stop-btn {
        position: absolute;
        left: 150px;
        top: 30px;
      }
      
      #edit-btn-container {
        z-index: 498;
        display: none;
        position: absolute;
        flex-direction: row;
        left: 250px;
        top: 25px;
        border: 1px solid black;
        box-sizing: border-box;
        height: 50px;
        padding: 5px;
        gap: 5px;
      }
      
      #edit-btn-container > button {
        height: 40px;
        font-size: 0.8rem;
        padding: 8px;
        border-radius: 0;
        background: rgb(180, 255, 222);
        font-weight: bold;
        color: rgb(200, 0, 0);
      }
      
      @media (max-width: 767px) {
        #edit-btn-container {
          left: 10px;
          top: 75px;
          flex-direction: column;
          height: auto;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <button class="main-btn" id="to-editor">Edit</button>
    <button class="main-btn" id="stop-btn">Stop</button>
    <div id="edit-btn-container">
      <button id="delete-btn">部材を配置</button>
      <button id="material-btn">medium</button>
      <div>
        接触: <input type="checkbox" id="substance-inp">
      </div>
      <button id="undo-btn">&#x21BA;</button>
      <button id="redo-btn">&#x21BB;</button>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./physics.js"></script>
  </body>
</html>
